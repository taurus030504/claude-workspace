<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문영스냅 공식 계정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="profile.css">
<style>
  .pick { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  .pick h1 { font: 400 28px/1.2 var(--f-display); margin: 0 0 6px; }
  .pick p { color: var(--muted); margin: 0 0 24px; }
  .pick a { display: flex; align-items: center; gap: 16px; padding: 14px 12px; border-radius: 12px; }
  .pick a:hover { background: var(--raise); }
  .pick .av { width: 64px; height: 64px; }
  .pick b { display: block; font-size: 16px; }
  .pick small { color: var(--muted); font-size: 13.5px; }
</style>
</head>
<body>
<main class="pick">
  <h1>문영스냅</h1>
  <p>JL 컴퍼니 소속 두 가수의 공식 계정입니다. 수업용 가상 화면입니다.</p>
  <a href="lee-eunho.html" id="a1"></a>
  <a href="kim-seojin.html" id="a2"></a>
</main>
<script src="snap-shared.js"></script>
<script>
  (function () {
    var D = window.SNAP_DATA, A = window.SNAP_ART;
    function av(h) { var a = D.accounts[h].av; return '<span class="av" aria-hidden="true">' + (a.img ? '<img src="' + A.IMG[a.img] + '" alt="">' : A.ART[a.art]({})) + '</span>'; }
    function row(h) { var a = D.accounts[h]; return av(h) + '<span><b>' + h + '</b><small>' + a.name + ' · ' + a.category + ' · 팔로워 ' + a.followers + '</small></span>'; }
    document.getElementById('a1').innerHTML = row('e_euno_official');
    document.getElementById('a2').innerHTML = row('seojin_official');
  })();
</script>
</body>
</html>
