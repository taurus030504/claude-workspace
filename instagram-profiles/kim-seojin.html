<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김서진 (@seojin.line)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Seoul Metro signage system: platform tile, sign grey, real line colors. */
  :root {
    --tile: #F3F5F4;
    --plate: #FFFFFF;
    --ink: #2B2F33;
    --ink-soft: #5C636A;
    --rule: #D5DBD8;
    --line1: #0052A4;
    --line2: #00A84D;
    --line2-deep: #00843D;
    --line3: #EF7C1C;
    --line4: #00A5DE;
    --line5: #996CAC;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--tile);
    color: var(--ink);
    font: 400 15px/1.6 "IBM Plex Sans KR", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--line4); outline-offset: 3px; border-radius: 4px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 16px;
    background: var(--plate);
    border-bottom: 1px solid var(--rule);
  }
  .topbar a { color: inherit; display: grid; place-items: center; width: 32px; height: 32px; }
  .topbar .handle { margin: 0; flex: 1; font: 700 18px/1 "IBM Plex Sans KR", sans-serif; }
  .topbar svg { width: 24px; height: 24px; }

  .wrap { max-width: 935px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ---------- profile header ---------- */
  .profile { display: grid; grid-template-columns: auto 1fr; gap: 20px 24px; align-items: center; }
  .avatar {
    width: 92px; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    background: var(--plate);
    box-shadow: 0 0 0 5px var(--line2);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .stats { display: flex; justify-content: space-around; margin: 0; padding: 0; list-style: none; text-align: center; }
  .stats b { display: block; font: 700 19px/1.2 "IBM Plex Sans KR", sans-serif; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; color: var(--ink-soft); }
  .sign, .bio, .actions { grid-column: 1 / -1; }

  /* the memorable thing: name as a station nameplate */
  .sign {
    margin-top: 6px;
    background: var(--plate);
    border-radius: 6px;
    box-shadow: 0 1px 0 var(--rule), inset 0 0 0 1px var(--rule);
    overflow: hidden;
    text-align: center;
  }
  .sign-name { padding: 22px 16px 14px; }
  .sign-name h2 {
    margin: 0;
    font: 700 clamp(44px, 12vw, 68px)/1 "IBM Plex Sans KR", sans-serif;
    letter-spacing: .04em;
  }
  .sign-name .roman { display: block; margin-top: 8px; font-size: 15px; font-weight: 500; color: var(--ink-soft); letter-spacing: .02em; }
  .sign-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    height: 44px; padding: 0 14px;
    background: var(--line2-deep);
    color: #FFFFFF;
    font-weight: 700; font-size: 15px;
  }
  .sign-bar span { display: flex; align-items: center; gap: 8px; }
  .sign-bar .dir { width: 0; height: 0; border-block: 7px solid transparent; }
  .sign-bar .prev .dir { border-right: 10px solid #FFFFFF; }
  .sign-bar .next .dir { border-left: 10px solid #FFFFFF; }
  .sign-bar .here { width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 3px var(--line2-deep), 0 0 0 5px #FFFFFF; }

  .category { margin: 0 0 4px; font-weight: 700; color: var(--line2-deep); }
  .bio p { margin: 0; max-width: 36em; }

  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 40px; border-radius: 8px;
    font-weight: 700; font-size: 14px;
    background: var(--plate); box-shadow: inset 0 0 0 1px var(--rule);
  }
  .btn-primary { background: var(--line1); color: #FFFFFF; box-shadow: none; }
  .btn-primary[aria-pressed="true"] { background: var(--plate); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }

  @media (min-width: 736px) {
    .wrap { padding-top: 40px; }
    .profile { grid-template-columns: 200px 1fr; gap: 16px 40px; align-items: start; }
    .avatar { width: 160px; grid-row: 1 / 5; justify-self: center; margin-top: 8px; }
    .stats, .sign, .bio, .actions { grid-column: 2; }
    .stats { justify-content: flex-start; gap: 40px; text-align: left; }
    .stats b, .stats span { display: inline; }
    .stats b { margin-right: 6px; font-size: 17px; }
    .stats span { font-size: 15px; }
    .sign { margin-top: 0; }
    .actions { max-width: 340px; }
  }

  /* ---------- highlights as stations on a line ---------- */
  .line {
    display: flex; gap: 0;
    margin: 36px -16px 0; padding: 6px 16px 10px;
    list-style: none;
    overflow-x: auto; scrollbar-width: none;
  }
  .line::-webkit-scrollbar { display: none; }
  .stop { position: relative; flex: none; width: 96px; text-align: center; font-size: 13px; font-weight: 500; }
  .stop button { position: relative; z-index: 1; display: block; width: 100%; }
  .stop .disc {
    display: grid; place-items: center;
    width: 64px; aspect-ratio: 1; margin: 0 auto 8px;
    border-radius: 50%;
    background: var(--plate);
    box-shadow: inset 0 0 0 6px var(--c);
  }
  .stop .disc svg { width: 32px; height: 32px; }
  .stop:not(:last-child)::after {
    content: "";
    position: absolute; top: 29px; left: 50%;
    width: 100%; height: 6px;
    background: var(--c);
    transform-origin: left center;
    animation: draw .45s cubic-bezier(.5, 0, .3, 1) both;
    animation-delay: calc(.2s + var(--i) * .35s);
  }
  @keyframes draw { from { transform: scaleX(0); } }

  /* ---------- tabs ---------- */
  .tabs { display: flex; justify-content: center; margin-top: 24px; border-top: 1px solid var(--rule); }
  .tab {
    flex: 1; max-width: 170px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 48px; margin-top: -1px;
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    border-top: 2px solid transparent;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab[aria-selected="true"] { color: var(--ink); border-top-color: var(--ink); }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid > button { display: block; }
  .grid > button:hover .map { filter: brightness(.96); }
  .empty { grid-column: 1 / -1; padding: 64px 16px; text-align: center; }
  .empty strong { display: block; font-size: 20px; margin-bottom: 6px; }
  .empty p { margin: 0 auto; max-width: 26em; color: var(--ink-soft); }

  .map { position: relative; aspect-ratio: 3 / 4; container-type: inline-size; overflow: hidden; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .map .label {
    position: absolute; left: 7cqw; right: 7cqw; bottom: 6cqw;
    font: 700 7cqw/1.2 "IBM Plex Sans KR", sans-serif;
    text-align: left;
  }

  /* ---------- post viewer ---------- */
  dialog.viewer {
    width: min(880px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px);
    padding: 0; border: 0; border-radius: 10px;
    background: var(--plate); color: var(--ink);
    overflow: auto;
  }
  dialog.viewer::backdrop { background: rgba(43, 47, 51, .6); }
  dialog.viewer[open] { animation: lift .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes lift { from { transform: translateY(12px); opacity: 0; } }
  .viewer-body { display: grid; }
  .viewer-info { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .viewer-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .viewer-head .mini { width: 32px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--line2); }
  .viewer-head .mini svg { display: block; width: 100%; height: 100%; }
  .viewer-close { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; }
  .viewer-close svg { width: 20px; height: 20px; }
  .viewer-cap { margin: 0; max-width: 34em; }
  .viewer-route { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .viewer-route li {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 6px; border-radius: 99px;
    background: var(--tile); font-size: 13px; font-weight: 500;
  }
  .viewer-route li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; box-shadow: inset 0 0 0 2.5px var(--c); }
  .viewer-meta { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); }
  .like { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .like svg { width: 26px; height: 26px; fill: none; stroke: var(--ink); stroke-width: 2; }
  .like[aria-pressed="true"] svg { fill: var(--line3); stroke: var(--line3); }
  .when { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
  @media (min-width: 736px) {
    .viewer-body { grid-template-columns: 1.1fr 1fr; }
    .viewer-info { padding: 20px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  const HIGHLIGHTS = [
    { t: "등굣길", c: 2, pts: [[6, 22], [6, 12], [14, 4], [26, 4]] },
    { t: "동네 산책", c: 2, pts: [[4, 16], [28, 16]] },
    { t: "여행 노선", c: 4, pts: [[4, 24], [12, 16], [20, 16], [28, 8]] },
    { t: "주문 제작", c: 3, pts: [[8, 4], [8, 28], [24, 28]] },
    { t: "작업 과정", c: 5, pts: [[4, 8], [16, 20], [28, 8]] }
  ];

  const path = pts => "M" + pts.map(p => p.join(" ")).join("L");

  function stationsFrom(post) {
    if (post.dots) return post.dots.map(p => [...p, post.lines[0].c]);
    // stations at every corner and end of each line, minus interchanges; each keeps its line's colour
    const xs = (post.x || []).map(p => p.join());
    const all = post.lines.flatMap(l => l.dash ? [] : l.pts.map(p => [...p, l.c]));
    const seen = new Set();
    return all.filter(([x, y]) => { const k = [x, y].join(); if (seen.has(k) || xs.includes(k)) return false; seen.add(k); return true; });
  }

  function map(post, { label = true } = {}) {
    const colorBg = typeof post.bg === "number";
    const bg = colorBg ? HEX[post.bg] : post.bg === "tile" ? "#F3F5F4" : "#FFFFFF";
    const stroke = l => colorBg ? "#FFFFFF" : HEX[l.c];
    const gridPattern = post.grid
      ? `<defs><pattern id="g${post.t.length}" width="2" height="2" patternUnits="userSpaceOnUse"><path d="M2 0H0V2" fill="none" stroke="#C9D2CE" stroke-width=".12"/></pattern></defs><rect width="30" height="40" fill="url(#g${post.t.length})"/>`
      : "";
    const lines = post.lines.map(l => `<path d="${path(l.pts)}" fill="none" stroke="${stroke(l)}"
      stroke-width="${l.sketch ? 1.2 : l.dash ? 1.1 : 2.2}" stroke-linecap="${l.dash ? "butt" : "round"}" stroke-linejoin="round"
      ${l.dash ? 'stroke-dasharray="1 1"' : ""} ${l.sketch ? 'stroke-dasharray="5 .6 3 .6" opacity=".9"' : ""}/>`).join("");
    const st = stationsFrom(post).map(([x, y, c]) =>
      `<circle cx="${x}" cy="${y}" r="1.25" fill="${colorBg ? bg : "#FFFFFF"}" stroke="${colorBg ? "#FFFFFF" : HEX[c]}" stroke-width=".7"/>`).join("");
    const xs = (post.x || []).map(([x, y]) =>
      `<circle cx="${x}" cy="${y}" r="1.9" fill="#FFFFFF" stroke="#2B2F33" stroke-width=".7"/>`).join("");
    const textColor = colorBg ? "#FFFFFF" : "#2B2F33";
    return `<div class="map" style="background:${bg}">
      <svg viewBox="0 0 30 40" aria-hidden="true">${gridPattern}${lines}${st}${xs}</svg>
      ${label ? `<span class="label" style="color:${textColor}">${post.t}</span>` : ""}</div>`;
  }

  function mini(h) {
    return `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="${path(h.pts)}" fill="none" stroke="${HEX[h.c]}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${[h.pts[0], h.pts[h.pts.length - 1]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.2" fill="#fff" stroke="${HEX[h.c]}" stroke-width="1.4"/>`).join("")}</svg>`;
  }

  const avatarSvg = `<svg viewBox="0 0 40 40"><rect width="40" height="40" fill="#fff"/>
    <path d="M6 30H16L24 22V8" fill="none" stroke="#00A84D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 14H34" fill="none" stroke="#EF7C1C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="24" cy="14" r="3.2" fill="#fff" stroke="#2B2F33" stroke-width="1.3"/>
    <circle cx="6" cy="30" r="2.2" fill="#fff" stroke="#00A84D" stroke-width="1.3"/></svg>`;
  document.getElementById("avatar").innerHTML = avatarSvg;
  document.getElementById("viewer-avatar").innerHTML = avatarSvg;

  // Each segment of the line takes the colour of the station it leaves, so changes read as transfers.
  document.getElementById("line").innerHTML = HIGHLIGHTS.map((h, i) =>
    `<li class="stop" style="--c:${C[h.c]};--i:${i}"><button aria-label="${h.t} 하이라이트 보기"><span class="disc">${mini(h)}</span>${h.t}</button></li>`
  ).join("");

  // ---------- grid + tabs ----------
  const grid = document.getElementById("grid");
  function renderGrid(tab) {
    const list = POSTS.map((p, i) => ({ p, i })).filter(({ p }) =>
      tab === "all" ? true : tab === "order" ? p.kind === "order" : false);
    if (!list.length) {
      grid.innerHTML = `<div class="empty"><strong>아직 태그된 게시물이 없어요</strong>
        <p>주문한 노선도 포스터를 걸어 두고 @seojin.line을 태그하면 여기에 모여요.</p></div>`;
      return;
    }
    grid.innerHTML = list.map(({ p, i }) =>
      `<button data-i="${i}" aria-label="${p.t} 게시물 열기">${map(p)}</button>`).join("");
  }
  document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === tab));
    renderGrid(tab.dataset.tab);
  }));
  renderGrid("all");

  // ---------- follow ----------
  const follow = document.getElementById("follow");
  const followers = document.getElementById("followers");
  const baseFollowers = 2047;
  follow.addEventListener("click", () => {
    const on = follow.getAttribute("aria-pressed") !== "true";
    follow.setAttribute("aria-pressed", on);
    follow.textContent = on ? "팔로잉" : "팔로우";
    followers.textContent = (baseFollowers + (on ? 1 : 0)).toLocaleString("ko-KR");
  });

  // ---------- viewer ----------
  const viewer = document.getElementById("viewer");
  const likeBtn = document.getElementById("like");
  const likeCount = document.getElementById("like-count");
  const liked = new Set();
  let current = 0;

  function paintLike() {
    const on = liked.has(current);
    likeBtn.setAttribute("aria-pressed", on);
    likeBtn.setAttribute("aria-label", on ? "좋아요 취소" : "좋아요");
    likeCount.textContent = `좋아요 ${(POSTS[current].likes + (on ? 1 : 0)).toLocaleString("ko-KR")}개`;
  }
  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-i]");
    if (!b) return;
    current = +b.dataset.i;
    const p = POSTS[current];
    const c = typeof p.bg === "number" ? C[p.bg] : C[p.lines[0].c];
    document.getElementById("viewer-media").innerHTML = map(p);
    document.getElementById("viewer-cap").textContent = p.cap;
    document.getElementById("viewer-route").innerHTML = p.stops.map(s => `<li style="--c:${c}">${s}</li>`).join("");
    document.getElementById("viewer-when").textContent = p.when;
    viewer.setAttribute("aria-label", `${p.t} 게시물`);
    paintLike();
    viewer.showModal();
  });
  likeBtn.addEventListener("click", () => {
    liked.has(current) ? liked.delete(current) : liked.add(current);
    paintLike();
  });
  document.getElementById("viewer-close").addEventListener("click", () => viewer.close());
  viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });
</script>
</body>
</html>
