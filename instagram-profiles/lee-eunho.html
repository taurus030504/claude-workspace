<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이은호 (@eunho.riso)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Two-ink risograph system: everything is printed in blue, pink only overprints. */
  :root {
    --paper: #E9EBE4;
    --paper-deep: #DCE0D5;
    --blue: #3255A4;
    --pink: #FF48B0;
    --yellow: #FFE800;
    --rule: rgba(50, 85, 164, .28);
    --halftone-blue: radial-gradient(circle, var(--blue) 40%, transparent 43%) 0 0 / 4.2cqw 4.2cqw;
    --halftone-pink: radial-gradient(circle, var(--pink) 40%, transparent 43%) 0 0 / 4.2cqw 4.2cqw;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--blue);
    font: 400 15px/1.6 "Gothic A1", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* paper tooth */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .25  0 0 0 0 .3  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
    opacity: .55;
  }

  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2.5px solid var(--blue); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 16px;
    background: var(--paper);
    border-bottom: 1.5px solid var(--rule);
  }
  .topbar a { color: inherit; display: grid; place-items: center; width: 32px; height: 32px; }
  .topbar .handle { margin: 0; font: 800 18px/1 "Gothic A1", sans-serif; letter-spacing: -.01em; flex: 1; }
  .topbar svg { width: 24px; height: 24px; }

  .wrap { max-width: 935px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ---------- profile header ---------- */
  .profile {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 18px 24px;
    align-items: center;
  }
  .avatar {
    width: 92px; aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.5px var(--blue);
  }
  .avatar .print { aspect-ratio: 1; }
  .stats { display: flex; justify-content: space-around; margin: 0; padding: 0; list-style: none; text-align: center; }
  .stats b { display: block; font: 800 19px/1.2 "Gothic A1", sans-serif; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 13px; }

  .namebox, .bio, .actions { grid-column: 1 / -1; }

  /* the memorable thing: a mis-registered two-ink name */
  .name {
    position: relative;
    margin: 4px 0 0;
    font: 400 clamp(56px, 15vw, 88px)/.95 "Black Han Sans", sans-serif;
    letter-spacing: -.01em;
    width: max-content;
  }
  .name .ink { display: block; mix-blend-mode: multiply; }
  .name .ink-pink {
    position: absolute; inset: 0;
    background: var(--pink);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    transform: translate(.07em, .05em);
    animation: register 1.1s cubic-bezier(.2, .8, .2, 1) .25s both;
  }
  .name .ink-blue { position: relative; color: var(--blue); }
  @keyframes register {
    from { transform: translate(.42em, -.2em); opacity: 0; }
    30% { opacity: 1; }
    to   { transform: translate(.07em, .05em); }
  }
  .category { margin: 10px 0 0; font-weight: 600; opacity: .78; }

  .bio p { margin: 0; max-width: 36em; }
  .bio .note {
    display: inline-block; margin-top: 10px;
    padding: 2px 8px;
    background: var(--yellow);
    mix-blend-mode: multiply;
    font-weight: 600;
  }

  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 38px;
    border-radius: 6px;
    font-weight: 800; font-size: 14px;
    border: 1.5px solid var(--blue);
  }
  .btn-primary { background: var(--blue); color: var(--paper); }
  .btn-primary[aria-pressed="true"] { background: transparent; color: var(--blue); }

  @media (min-width: 736px) {
    .wrap { padding-top: 40px; }
    .profile { grid-template-columns: 220px 1fr; gap: 14px 40px; align-items: start; }
    .avatar { width: 168px; grid-row: 1 / 5; justify-self: center; }
    .stats, .namebox, .bio, .actions { grid-column: 2; }
    .stats { justify-content: flex-start; gap: 40px; text-align: left; order: 0; }
    .stats b, .stats span { display: inline; }
    .stats b { margin-right: 6px; font-size: 17px; }
    .stats span { font-size: 15px; }
    .actions { max-width: 340px; }
  }

  /* ---------- highlights ---------- */
  .highlights {
    display: flex; gap: 20px;
    margin: 36px -16px 0; padding: 4px 16px 8px;
    overflow-x: auto; scrollbar-width: none;
    list-style: none;
  }
  .highlights::-webkit-scrollbar { display: none; }
  .hl { flex: none; width: 76px; text-align: center; font-size: 12.5px; font-weight: 600; }
  .hl button { display: block; width: 100%; }
  .hl .disc {
    display: block;
    width: 68px; aspect-ratio: 1; margin: 0 auto 8px;
    border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.5px var(--rule);
  }
  .hl .print { aspect-ratio: 1; }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex; justify-content: center; gap: 0;
    margin-top: 28px;
    border-top: 1.5px solid var(--rule);
  }
  .tab {
    flex: 1; max-width: 160px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 48px; margin-top: -1.5px;
    font-size: 13px; font-weight: 800;
    border-top: 2px solid transparent;
    opacity: .55;
  }
  .tab svg { width: 16px; height: 16px; }
  .tab[aria-selected="true"] { opacity: 1; border-top-color: var(--blue); }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
  }
  .grid > button { display: block; position: relative; }
  .grid > button:hover .print { filter: brightness(.94); }
  .empty { grid-column: 1 / -1; padding: 64px 16px; text-align: center; }
  .empty strong { display: block; font: 400 26px/1.2 "Black Han Sans", sans-serif; margin-bottom: 8px; }
  .empty p { margin: 0 auto; max-width: 26em; }

  /* ---------- the print renderer ---------- */
  .print {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: var(--paper);
    container-type: inline-size;
    isolation: isolate;
  }
  .print .l { position: absolute; mix-blend-mode: multiply; }
  .print .glyph {
    font: 400 74cqw/1 "Black Han Sans", sans-serif;
    color: var(--pink);
    left: 10cqw; top: 46cqw;
    transform: translate(var(--dx, 1.4cqw), var(--dy, 1cqw));
  }
  .print .label {
    position: absolute; left: 6cqw; bottom: 5cqw; z-index: 2;
    padding: .8cqw 2cqw;
    margin-left: -2cqw;
    background: var(--paper);
    font: 800 6.4cqw/1.15 "Gothic A1", sans-serif;
    color: var(--blue);
  }

  .v-awning .a { inset: 0 0 auto 0; height: 34cqw; background: repeating-linear-gradient(90deg, var(--blue) 0 10cqw, transparent 10cqw 20cqw); }
  .v-awning .b { left: 0; right: 0; top: 34cqw; height: 6cqw; background: radial-gradient(circle at 5cqw 0, var(--blue) 5cqw, transparent 5.2cqw) 0 0 / 10cqw 6cqw repeat-x; }

  .v-circle .a { width: 80cqw; aspect-ratio: 1; left: 10cqw; top: 8cqw; border-radius: 50%; background: var(--halftone-blue); }
  .v-circle .glyph { top: 40cqw; left: 14cqw; }

  .v-tower .a { width: 20cqw; left: 66cqw; top: 6cqw; bottom: 0; background: var(--blue); }
  .v-tower .b { width: 34cqw; aspect-ratio: 1; left: 58cqw; top: -6cqw; border-radius: 50%; background: var(--halftone-blue); opacity: .9; }
  .v-tower .glyph { left: 2cqw; top: 30cqw; }

  .v-sun .a { width: 64cqw; aspect-ratio: 1; left: 18cqw; top: 10cqw; border-radius: 50%; background: var(--yellow); }
  .v-sun .b { left: 0; right: 0; bottom: 0; height: 52cqw; background: var(--halftone-blue); }
  .v-sun .glyph { top: 26cqw; left: 13cqw; }

  .v-arch .a { left: 12cqw; right: 12cqw; top: 14cqw; bottom: -2cqw; border-radius: 38cqw 38cqw 0 0; background: var(--blue); }
  .v-arch .glyph { top: 34cqw; }

  .v-test .a, .v-test .b, .v-test .c { width: 52cqw; aspect-ratio: 1; border-radius: 50%; }
  .v-test .a { left: 8cqw; top: 14cqw; background: var(--pink); }
  .v-test .b { left: 40cqw; top: 14cqw; background: var(--blue); }
  .v-test .c { left: 24cqw; top: 46cqw; background: var(--yellow); }

  .v-block .a { inset: 0; background: var(--halftone-pink); }
  .v-block .glyph { color: var(--blue); }

  .v-pole .a {
    left: 36cqw; width: 28cqw; top: 8cqw; bottom: 22cqw; border-radius: 14cqw;
    background: repeating-linear-gradient(-35deg, var(--blue) 0 6cqw, transparent 6cqw 12cqw);
  }
  .v-pole .b { left: 36cqw; width: 28cqw; top: 8cqw; bottom: 22cqw; border-radius: 14cqw; background: repeating-linear-gradient(-35deg, transparent 0 6cqw, var(--pink) 6cqw 12cqw); transform: translate(1.2cqw, .8cqw); }
  .v-pole .glyph { font-size: 40cqw; left: 4cqw; top: 4cqw; }

  /* ---------- post viewer ---------- */
  dialog.viewer {
    width: min(880px, calc(100vw - 24px));
    max-height: calc(100dvh - 24px);
    padding: 0; border: 1.5px solid var(--blue); border-radius: 4px;
    background: var(--paper); color: var(--blue);
    overflow: auto;
  }
  dialog.viewer::backdrop { background: rgba(50, 85, 164, .55); }
  dialog.viewer[open] { animation: lift .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes lift { from { transform: translateY(12px); opacity: 0; } }
  .viewer-body { display: grid; }
  .viewer-media .print { width: 100%; }
  .viewer-info { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .viewer-head { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .viewer-head .mini { display: block; flex: none; width: 32px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; }
  .viewer-head .mini .print { aspect-ratio: 1; }
  .viewer-close { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; }
  .viewer-close svg { width: 20px; height: 20px; }
  .viewer-cap { margin: 0; max-width: 34em; }
  .viewer-meta { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 12px; border-top: 1.5px solid var(--rule); }
  .like { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .like svg { width: 26px; height: 26px; fill: none; stroke: var(--blue); stroke-width: 2; }
  .like[aria-pressed="true"] svg { fill: var(--pink); stroke: var(--blue); }
  .when { margin-left: auto; font-size: 13px; opacity: .75; }
  @media (min-width: 736px) {
    .viewer-body { grid-template-columns: 1.1fr 1fr; }
    .viewer-info { padding: 20px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" aria-label="프로필 목록으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <h1 class="handle">eunho.riso</h1>
  <a href="#" aria-label="메뉴 열기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </a>
</header>

<main class="wrap">
  <section class="profile" aria-label="프로필">
    <div class="avatar" id="avatar" aria-hidden="true"></div>

    <ul class="stats">
      <li><b>24</b><span>게시물</span></li>
      <li><b id="followers">1,284</b><span>팔로워</span></li>
      <li><b>312</b><span>팔로잉</span></li>
    </ul>

    <div class="namebox">
      <p class="name" aria-label="이은호">
        <span class="ink ink-pink" aria-hidden="true">이은호</span>
        <span class="ink ink-blue" aria-hidden="true">이은호</span>
      </p>
      <p class="category">리소그래프 진 제작자</p>
    </div>

    <div class="bio">
      <p>동네에서 사라지는 간판을 두 가지 잉크로 찍어 둡니다.</p>
      <p>세탁소, 철물점, 사진관. 블루 한 판, 핑크 한 판.</p>
      <p class="note">진 3호 예약은 DM으로 받아요</p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="follow" aria-pressed="false">팔로우</button>
      <button class="btn">메시지 보내기</button>
    </div>
  </section>

  <ul class="highlights" id="highlights" aria-label="스토리 하이라이트"></ul>

  <nav class="tabs" role="tablist" aria-label="게시물 보기">
    <button class="tab" role="tab" aria-selected="true" data-tab="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
      게시물
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="zine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14"/></svg>
      진
    </button>
    <button class="tab" role="tab" aria-selected="false" data-tab="tagged">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="9" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/></svg>
      태그됨
    </button>
  </nav>

  <section class="grid" id="grid" role="tabpanel" aria-label="게시물"></section>
</main>

<dialog class="viewer" id="viewer" aria-label="게시물 보기">
  <div class="viewer-body">
    <div class="viewer-media" id="viewer-media"></div>
    <div class="viewer-info">
      <div class="viewer-head">
        <span class="mini" id="viewer-avatar" aria-hidden="true"></span>
        eunho.riso
        <button class="viewer-close" id="viewer-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="viewer-cap" id="viewer-cap"></p>
      <div class="viewer-meta">
        <button class="like" id="like" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>
          <span id="like-count"></span>
        </button>
        <span class="when" id="viewer-when"></span>
      </div>
    </div>
  </div>
</dialog>

<script>
  const POSTS = [
    { t: "세탁소 vol.3", g: "세", v: "awning", kind: "zine", likes: 214, when: "2일 전",
      cap: "망원시장 입구 세탁소. 30년 된 차양 줄무늬를 블루 한 판으로, 간판 글자를 핑크로 찍었어요. 진 3호 표지입니다." },
    { t: "동광철물", g: "철", v: "circle", kind: "print", likes: 168, when: "5일 전",
      cap: "철물점 사장님이 직접 쓰신 간판 글씨. 망점을 크게 잡아서 녹슨 느낌을 냈어요." },
    { t: "목욕탕 굴뚝", g: "탕", v: "tower", kind: "zine", likes: 302, when: "1주 전",
      cap: "다음 달에 철거된다는 굴뚝. 사라지기 전에 한 장 남겨 둡니다." },
    { t: "영 사진관", g: "영", v: "sun", kind: "print", likes: 251, when: "1주 전",
      cap: "오랜만에 노랑 드럼을 꺼냈어요. 세 가지 잉크가 겹치는 부분이 제일 좋아요." },
    { t: "별다방", g: "다", v: "arch", kind: "zine", likes: 189, when: "2주 전",
      cap: "아치형 출입문을 블루로 깔고 위에 핑크를 얹으면 보라색이 생겨요. 리소의 제일 큰 재미." },
    { t: "잉크 테스트 12", g: "", v: "test", kind: "process", likes: 97, when: "2주 전",
      cap: "새 종이 테스트. 핑크, 블루, 노랑이 겹치는 순서를 바꿔 보는 중." },
    { t: "신사 양복점", g: "양", v: "block", kind: "print", likes: 143, when: "3주 전",
      cap: "이번엔 반대로 핑크를 바탕에 깔고 글자를 블루로. 같은 두 잉크인데 분위기가 완전히 달라져요." },
    { t: "미용실 회전등", g: "미", v: "pole", kind: "print", likes: 276, when: "3주 전",
      cap: "두 판의 위치가 일부러 살짝 어긋나게 찍었어요. 돌아가는 것처럼 보이길 바라면서." },
    { t: "쌀상회", g: "쌀", v: "circle", kind: "zine", likes: 118, when: "1개월 전",
      cap: "쌀자루 도장을 따라 그린 원. 진 2호 뒷표지." },
    { t: "인쇄실 목요일", g: "목", v: "awning", kind: "process", likes: 84, when: "1개월 전",
      cap: "매주 목요일 저녁, 동네 인쇄실에서 작업해요. 오늘은 300장." },
    { t: "중앙 시장", g: "시", v: "arch", kind: "zine", likes: 207, when: "1개월 전",
      cap: "시장 아치 간판. 진 1호에 실렸던 첫 번째 판을 다시 찍었어요." },
    { t: "번개 수선", g: "번", v: "sun", kind: "print", likes: 131, when: "2개월 전",
      cap: "구두 수선 가게 간판의 번개 모양을 노랑으로." }
  ];

  const HIGHLIGHTS = [
    { t: "세탁소", g: "세", v: "awning" },
    { t: "철물점", g: "철", v: "circle" },
    { t: "인쇄실", g: "목", v: "block" },
    { t: "진 주문", g: "진", v: "arch" },
    { t: "전시", g: "전", v: "sun" }
  ];

  // Each print gets its own small mis-registration so no two read identical.
  function print(p, i = 0) {
    const dx = ((i * 37) % 5 - 2) * .6 + 1.2;
    const dy = ((i * 53) % 5 - 2) * .5 + .8;
    const glyph = p.g ? `<span class="l glyph">${p.g}</span>` : "";
    const label = p.t && p.label !== false ? `<span class="label">${p.t}</span>` : "";
    return `<div class="print v-${p.v}" style="--dx:${dx}cqw;--dy:${dy}cqw">
      <span class="l a"></span><span class="l b"></span><span class="l c"></span>
      ${glyph}${label}</div>`;
  }

  const avatarArt = { g: "은", v: "circle", label: false };
  document.getElementById("avatar").innerHTML = print(avatarArt, 3);
  document.getElementById("viewer-avatar").innerHTML = print(avatarArt, 3);

  document.getElementById("highlights").innerHTML = HIGHLIGHTS.map((h, i) =>
    `<li class="hl"><button aria-label="${h.t} 하이라이트 보기"><span class="disc">${print({ ...h, label: false }, i)}</span>${h.t}</button></li>`
  ).join("");

  // ---------- grid + tabs ----------
  const grid = document.getElementById("grid");
  function renderGrid(tab) {
    const list = POSTS.map((p, i) => ({ p, i })).filter(({ p }) =>
      tab === "all" ? true : tab === "zine" ? p.kind === "zine" : false);
    if (!list.length) {
      grid.innerHTML = `<div class="empty"><strong>아직 태그된 게시물이 없어요</strong>
        <p>은호의 진을 찍어 올리고 @eunho.riso를 태그하면 여기에 모여요.</p></div>`;
      return;
    }
    grid.innerHTML = list.map(({ p, i }) =>
      `<button data-i="${i}" aria-label="${p.t} 게시물 열기">${print(p, i)}</button>`).join("");
  }
  document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t === tab));
    renderGrid(tab.dataset.tab);
  }));
  renderGrid("all");

  // ---------- follow ----------
  const follow = document.getElementById("follow");
  const followers = document.getElementById("followers");
  const baseFollowers = 1284;
  follow.addEventListener("click", () => {
    const on = follow.getAttribute("aria-pressed") !== "true";
    follow.setAttribute("aria-pressed", on);
    follow.textContent = on ? "팔로잉" : "팔로우";
    followers.textContent = (baseFollowers + (on ? 1 : 0)).toLocaleString("ko-KR");
  });

  // ---------- viewer ----------
  const viewer = document.getElementById("viewer");
  const likeBtn = document.getElementById("like");
  const likeCount = document.getElementById("like-count");
  const liked = new Set();
  let current = 0;

  function paintLike() {
    const on = liked.has(current);
    likeBtn.setAttribute("aria-pressed", on);
    likeBtn.setAttribute("aria-label", on ? "좋아요 취소" : "좋아요");
    likeCount.textContent = `좋아요 ${(POSTS[current].likes + (on ? 1 : 0)).toLocaleString("ko-KR")}개`;
  }
  grid.addEventListener("click", e => {
    const b = e.target.closest("[data-i]");
    if (!b) return;
    current = +b.dataset.i;
    const p = POSTS[current];
    document.getElementById("viewer-media").innerHTML = print(p, current);
    document.getElementById("viewer-cap").textContent = p.cap;
    document.getElementById("viewer-when").textContent = p.when;
    viewer.setAttribute("aria-label", `${p.t} 게시물`);
    paintLike();
    viewer.showModal();
  });
  likeBtn.addEventListener("click", () => {
    liked.has(current) ? liked.delete(current) : liked.add(current);
    paintLike();
  });
  document.getElementById("viewer-close").addEventListener("click", () => viewer.close());
  viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });
</script>
</body>
</html>
