  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  /* 교사가 채워야 할 칸 표시 */
  .todo {
    background: var(--todo-bg);
    border: 1px dashed var(--todo-line);
    color: #8a6400;
    padding: 0 6px;
    border-radius: 3px;
    font-size: .92em;
  }

  /* 로고: 이미지 1개를 CSS 변수로 두고 여러 곳에서 재사용 */
  .logo-img {
    display: block;
    background: var(--logo) center / contain no-repeat;
    aspect-ratio: 2000 / 574;
    max-width: 100%;
  }

  /* ---------- 상단 헤더 ---------- */
  .top {
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    align-items: center;
    gap: 20px;
    padding: 18px 0;
  }
  .ad {
    position: relative;
    height: 80px;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
  }
  .ad small { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
  .ad::after {
    content: "AD";
    position: absolute; right: 4px; top: 3px;
    font-size: 9px; font-weight: 500; opacity: .7;
  }
  .ad-1 { background: linear-gradient(120deg, #0f766e, #14b8a6); font-size: 19px; }
  .ad-2 { background: linear-gradient(120deg, #18181b, #3f3f46); font-size: 16px; justify-content: flex-end; text-align: right; }
  .logo { display: flex; justify-content: center; }
  .logo .logo-img { width: 200px; }

  .gnb {
    display: flex;
    align-items: center;
    gap: 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    height: 56px;
  }
  .gnb .updated { font-size: 14px; color: #222; white-space: nowrap; }
  .gnb nav { flex: 1; display: flex; justify-content: center; gap: 26px; overflow-x: auto; scrollbar-width: none; }
  .gnb nav::-webkit-scrollbar { display: none; }
  .gnb nav a { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .gnb nav a.on { color: var(--brand); }
  .gnb .icons { display: flex; gap: 14px; }
  .gnb .icons svg { width: 22px; height: 22px; display: block; }

  /* ---------- 공통 머리 ---------- */
  .crumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text-sub);
    margin: 28px 0 14px;
  }
  .crumb .sep { color: #bbb; }
  .crumb a:hover { color: var(--brand); }
  .headline {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -.04em;
    line-height: 1.35;
    margin: 0 0 26px;
    word-break: keep-all;
    text-wrap: balance;
  }
  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .meta { display: flex; gap: 14px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; padding: 0; margin: 0; }
  .meta li { list-style: none; display: flex; align-items: center; gap: 4px; }
  .meta li + li::before { content: ""; width: 1px; height: 11px; background: #ddd; margin-right: 10px; }
  .meta a:hover { color: var(--brand); text-decoration: underline; }

  /* 공유 버튼: 실제 서비스 로고·색 대신 일반 아이콘 */
  .share { display: flex; gap: 8px; align-items: center; }
  .share .sns {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc; background: #fff;
    display: grid; place-items: center; color: #444;
  }
  .share .sns:hover { border-color: var(--brand); color: var(--brand); }
  .share .sns svg { width: 15px; height: 15px; }
  .share .tool {
    min-width: 36px; height: 32px; padding: 0 6px; white-space: nowrap; border: 1px solid #ddd; background: #fff;
    display: grid; place-items: center; color: #333;
  }
  .share .tool svg { width: 15px; height: 15px; }
  .share .gap { width: 14px; }

  /* ---------- 본문 레이아웃 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr) 300px;
    gap: 46px;
    padding: 40px 0 60px;
  }
  .layout.two { grid-template-columns: minmax(0, 1fr) 300px; }
  .side-left { position: relative; }
  .reporter-card {
    display: block;
    background: var(--bg-soft);
    padding: 18px 10px 20px;
    text-align: center;
  }
  /* 기자 프로필 사진 자리: 얼굴 사진 대신 일러스트(게임 규칙) */
  .avatar {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 12px;
    background: #e3e8ef;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .reporter-card .rname { font-size: 15px; margin-bottom: 4px; }
  .reporter-card .rdesk { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .reporter-card .more { font-size: 13px; color: var(--text-sub); text-decoration: underline; text-underline-offset: 3px; }
  .reporter-card:hover .more { color: var(--brand); }
  .sticky-share {
    position: sticky; top: 16px;
    background: var(--bg-soft);
    margin-top: 8px; padding: 18px 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .sticky-share button {
    width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #555;
    border: 1.5px solid #bbb; display: grid; place-items: center;
  }
  .sticky-share button:hover { border-color: var(--brand); color: var(--brand); }
  .sticky-share svg { width: 15px; height: 15px; }

  .subtitle {
    border-left: 3px solid #999;
    padding-left: 14px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: 1.5;
    margin: 0 0 30px;
    word-break: keep-all;
  }
  .subtitle span { display: block; }

  figure.photo { margin: 0 0 34px; }
  .photo-box {
    position: relative;
    background: radial-gradient(ellipse at 30% 20%, #3a3f55 0%, #1b1d29 70%);
    padding: 26px 0;
    display: flex; justify-content: center;
    overflow: hidden;
  }
  .watermark {
    position: absolute; right: 16px; bottom: 12px;
    width: 110px;
    filter: brightness(0) invert(1);
    opacity: .35;
    pointer-events: none;
  }
  figcaption { font-size: 13px; color: var(--text-sub); padding: 12px 10px 0; line-height: 1.6; }

  /* ---------- SNS 스토리 캡처 (CSS로 재현, 가상 서비스) ---------- */
  .story {
    width: 300px;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(170deg, #27406b 0%, #4f7cb3 55%, #9cc3e6 100%);
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .story .bars { display: flex; gap: 3px; padding: 8px 8px 0; }
  .story .bars i { flex: 1; height: 2px; background: rgba(255,255,255,.45); border-radius: 2px; }
  .story .bars i.done { background: #fff; }
  .story .who { display: flex; align-items: center; gap: 7px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
  .story .who .pic { width: 26px; height: 26px; border-radius: 50%; background: #f3c9a8; }
  .blur { filter: blur(4px); user-select: none; }
  .story .caption {
    align-self: center;
    margin: 6px 0 10px;
    font-size: 17px; font-weight: 800;
    background: #fff; color: #111;
    padding: 4px 10px; border-radius: 6px;
    transform: rotate(-3deg);
    letter-spacing: -.02em;
  }
  .chat {
    margin: 0 16px;
    background: #eceff3;
    border-radius: 8px;
    overflow: hidden;
    color: #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    font-size: 10.5px;
  }
  .chat .bar {
    background: #fff; border-bottom: 1px solid #dde2e8; padding: 6px 9px;
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 10.5px;
  }
  .chat .bar .count { font-weight: 400; color: #6b7785; }
  .chat .bar .back { font-size: 13px; line-height: 1; }
  .chat .msgs { padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg-group { display: flex; gap: 5px; align-items: flex-start; }
  .msg-group .pf { width: 22px; height: 22px; border-radius: 50%; background: #9aa6b4; flex: none; display: grid; place-items: center; color: #fff; overflow: hidden; }
  .msg-group .pf svg { width: 16px; height: 16px; margin-top: 4px; }
  .msg-group .col { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .msg-group .nm { font-size: 9.5px; color: #4b5866; margin-bottom: 1px; }
  .bubble {
    background: #fff; border-radius: 10px; padding: 4px 8px;
    line-height: 1.35; max-width: 170px; word-break: break-all;
  }
  .me { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .me .bubble { background: #7c5cff; color: #fff; }
  .mention { font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .story .tags { margin-top: auto; padding: 0 12px 30px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .story .tags span {
    background: rgba(255,255,255,.92); color: #1f2937;

    font: inherit; font-size: 14px; background: #fff; color: var(--text);

  .citem .c-act button svg { width: 13px; height: 13px; }
  .citem .c-act button.on { border-color: var(--brand); color: var(--brand); }

  .lempty { padding: 40px 0; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---------- 오른쪽 사이드 ---------- */

  }

  function getVote(id) { return store.get('vote:' + id, ''); }

  function getCReact(id) { return store.get('creact:' + id, {}); }   // { 댓글아이디: 'up' | 'down' }
  function toTs(s) {
    var m = String(s).match(/(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).getTime() : 0;
  }
  // 데이터에 들어 있는 댓글 + 이 브라우저에서 단 댓글
  function allComments(a) {
    var id = a['아이디'], react = getCReact(id);
    var seed = (a['댓글'] || []).map(function (c, i) {
      return { id: 's' + i, nick: c['닉네임'], text: c['내용'], time: c['시각'], ts: toTs(c['시각']), up: c['추천'] || 0, down: c['반대'] || 0, mine: false };
    });
    var mine = getMyComments(id).map(function (c) {
      return { id: c.id, nick: c.anon ? '익명' : c.nick, anon: c.anon, text: c.text, time: c.time, ts: c.ts, up: 0, down: 0, mine: true };
    });
    return seed.concat(mine).map(function (c) {
      c.react = react[c.id] || '';
      if (c.react === 'up') c.up++;
      if (c.react === 'down') c.down++;
      return c;
    });
  }
  function counts(a) {
    var id = a['아이디'], base = a['반응'] || {}, v = getVote(id);
    return {
      up: (base['추천'] || 0) + (v === 'up' ? 1 : 0),
      down: (base['반대'] || 0) + (v === 'down' ? 1 : 0),
      vote: v,
      comments: (a['댓글'] || []).length + getMyComments(id).length
    };
  }

          '<li><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>입력 ' + esc(a['시각']) + '</li>' +

  // 댓글 입력칸 윗줄: 닉네임(한 번 정하면 고정) + 익명(사이트 전체 1회)
  function renderCommentTop() {

    // 닉네임은 시작 화면에서 정하므로 여기서는 보여주기만 하고, 고르는 것은 익명 여부뿐

    var right = anonUsed()
      ? '<span class="anon used" title="익명 댓글은 이미 사용했습니다">익명 사용 완료</span>'
      : '<label class="anon" for="cmtAnon"><input type="checkbox" id="cmtAnon">익명으로 작성<small>(1회)</small></label>';
    top.innerHTML = left + right;

  function refreshReactions() {
    if (!current) return;
    var a = articleById[current], c = counts(a);
    document.querySelectorAll('[data-up]').forEach(function (n) { n.textContent = c.up; });
    document.querySelectorAll('[data-down]').forEach(function (n) { n.textContent = c.down; });
    document.querySelectorAll('[data-ccount]').forEach(function (n) { n.textContent = c.comments; });
    document.querySelectorAll('[data-vote]').forEach(function (btn) {
      var on = btn.getAttribute('data-vote') === c.vote;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('[data-sort]').forEach(function (btn) {
      btn.classList.toggle('on', btn.getAttribute('data-sort') === sortMode);
    });

    var all = allComments(a);
    // BEST: 추천 50 이상 중 추천이 많은 순으로 최대 3개 → 정렬과 상관없이 맨 위에 고정
    var best = all.filter(function (cm) { return cm.up >= 50; })
      .sort(function (x, y) { return y.up - x.up || y.ts - x.ts; }).slice(0, 3);
    var bestIds = best.map(function (cm) { return cm.id; });
    var rest = all.filter(function (cm) { return bestIds.indexOf(cm.id) < 0; });
    if (sortMode === 'best') rest.sort(function (x, y) { return (y.up - y.down) - (x.up - x.down) || (y.ts - x.ts); });
    else rest.sort(function (x, y) { return y.ts - x.ts; });
    var ordered = best.concat(rest);
    var list = ordered.slice(0, shownCount);
    var left = ordered.length - list.length;

    var ul = document.getElementById('cmtList');
    if (!ul) return;
    ul.innerHTML = (list.length ? list.map(function (cm) {
      var id = esc(cm.id);
      var isBest = bestIds.indexOf(cm.id) > -1;
      return '<li class="citem' + (isBest ? ' is-best' : '') + '">' +
        '<div class="c-meta">' + (isBest ? '<span class="best">BEST</span>' : '') +
          '<b>' + esc(cm.nick) + '</b>' + (cm.mine ? '<span class="me-tag">내 댓글</span>' : '') +
          '<span>' + esc(cm.time) + '</span></div>' +
        '<p>' + esc(cm.text) + '</p>' +
        '<div class="c-act">' +
          '<button data-creact="up" data-cid="' + id + '" class="' + (cm.react === 'up' ? 'on' : '') + '" aria-pressed="' + (cm.react === 'up') + '" aria-label="댓글 추천">' + ICON.up + cm.up + '</button>' +
          '<button data-creact="down" data-cid="' + id + '" class="down ' + (cm.react === 'down' ? 'on' : '') + '" aria-pressed="' + (cm.react === 'down') + '" aria-label="댓글 반대">' + ICON.down + cm.down + '</button>' +
          (cm.mine ? '<button class="del" data-cdel="' + id + '">삭제</button>' : '') +
        '</div></li>';
    }).join('') : '<li class="cempty">아직 댓글이 없습니다. 첫 댓글을 남겨 보세요.</li>') +
      (left > 0 ? '<li class="cmore"><button type="button" data-more>댓글 더보기 <b>' + left + '</b></button></li>' : '');
  }

  // ================= 화면: 기자 프로필 =================
  function renderReporter(rid) {

    var mine = ARTICLES.filter(function (a) { return a['게시자']['기자'] === rid; });
    var totalUp = 0, totalCm = 0;
    mine.forEach(function (a) { var c = counts(a); totalUp += c.up; totalCm += c.comments; });

    document.getElementById('view').innerHTML = '' +
      crumbHTML([{ t: '기자' }, { t: byline(r) }]) +
      '<div class="layout two">' +
        '<div>' +
          '<section class="profile">' + avatar() +
            '<div>' +
              '<h1>' + esc(r['이름']) + '<small>' + esc(r['직함'] || '기자') + '</small></h1>' +
              '<dl>' +
                '<dt>부서</dt><dd>' + val(r['부서'] || '[교사 입력]') + '</dd>' +
                '<dt>이메일</dt><dd>' + val(r['이메일'] || '[교사 입력]') + '</dd>' +
                '<dt>소개</dt><dd>' + val(r['소개'] || '[교사 입력]') + '</dd>' +
              '</dl>' +
              '<div class="stats"><span>기사<b>' + mine.length + '</b></span><span>추천<b>' + totalUp + '</b></span><span>댓글<b>' + totalCm + '</b></span></div>' +
            '</div>' +
          '</section>' +
          '<h2 class="list-title">' + esc(byline(r)) + '의 기사 <small>' + mine.length + '건</small></h2>' +
          (mine.length ? '<ul class="alist">' + mine.map(articleItemHTML).join('') + '</ul>' : '<p class="lempty">아직 작성한 기사가 없습니다.</p>') +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 화면: 전체기사 =================
  function renderList() {
    current = null;
    document.title = '전체기사 - ' + OUTLET;
    setNav('list');
    document.getElementById('view').innerHTML = '' +
      crumbHTML([{ t: '전체기사' }]) +
      '<div class="layout two" style="padding-top:12px">' +
        '<div>' +
          '<h2 class="list-title">전체기사 <small>' + ARTICLES.length + '건</small></h2>' +
          '<ul class="alist">' + ARTICLES.map(articleItemHTML).join('') + '</ul>' +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 주소(#)에 따라 화면 전환 =================
  function route() {
    var h = location.hash.slice(1), m;
    if (h === 'comments' && current) return;            // 같은 기사 안에서 댓글로 이동
    if (h === 'reset') { renderList(); resetAll(); return; }
    if ((m = h.match(/^reporter-(.+)$/)) && reporterById[m[1]]) renderReporter(m[1]);
    else if (h === 'list') renderList();
    else if ((m = h.match(/^article-(.+)$/)) && articleById[m[1]]) renderArticle(m[1]);
    else renderArticle(ARTICLES[0]['아이디']);
    window.scrollTo(0, 0);
  }

  // ================= 클릭·입력 처리 =================
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  var fontSize = 18;
  var armedDelete = null, armTimer;

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;

    if (t.hasAttribute('data-closed')) { e.preventDefault(); toast('수업용 페이지에서는 열리지 않는 메뉴입니다.'); return; }
    if (t.hasAttribute('data-toast')) { e.preventDefault(); toast(t.getAttribute('data-toast')); return; }
    if (t.hasAttribute('data-share')) { toast('수업용 페이지에서는 공유 기능이 동작하지 않습니다.'); return; }

    if (t.hasAttribute('data-copy')) {
      var url = location.href;
      try {
        navigator.clipboard.writeText(url).then(function () { toast('기사 주소가 복사되었습니다.'); },
          function () { toast('이 화면에서는 주소를 복사할 수 없습니다.'); });
      } catch (err) { toast('이 화면에서는 주소를 복사할 수 없습니다.'); }
      return;
    }

    if (t.hasAttribute('data-font')) {
      fontSize = Math.min(26, Math.max(14, fontSize + Number(t.getAttribute('data-font')) * 2));
      document.documentElement.style.setProperty('--body-size', fontSize + 'px');
      return;
    }

    if (t.hasAttribute('data-vote') && current) {
      var kind = t.getAttribute('data-vote');
      var prev = getVote(current);
      var next = prev === kind ? '' : kind;
      store.set('vote:' + current, next);
      toast(next ? (kind === 'up' ? '이 기사를 추천했습니다.' : '이 기사에 반대했습니다.') : (kind === 'up' ? '추천을 취소했습니다.' : '반대를 취소했습니다.'));
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-sort')) {
      sortMode = t.getAttribute('data-sort');
      shownCount = PAGE;
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-more')) {
      shownCount += PAGE;
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-creact') && current) {
      var cid = t.getAttribute('data-cid'), ck = t.getAttribute('data-creact');
      if (cid.charAt(0) === 'c') { toast('내 댓글에는 추천·반대를 할 수 없습니다.'); return; }
      var react = getCReact(current);
      if (react[cid] === ck) delete react[cid]; else react[cid] = ck;   // 같은 버튼 다시 누르면 취소
      store.set('creact:' + current, react);
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-cdel') && current) {
      var did = t.getAttribute('data-cdel');
      // 한 번 누르면 "삭제 확인"으로 바뀌고, 다시 누르면 삭제
      if (armedDelete !== did) {
        armedDelete = did;
        t.classList.add('arm');
        t.textContent = '삭제 확인';
        clearTimeout(armTimer);
        armTimer = setTimeout(function () { armedDelete = null; refreshReactions(); }, 3000);
        return;
      }
      armedDelete = null;
      clearTimeout(armTimer);
      store.set('comments:' + current, getMyComments(current).filter(function (cm) { return cm.id !== did; }));
      toast('댓글을 삭제했습니다.');
      refreshReactions();
      return;
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'cmtForm' || !current) return;
    e.preventDefault();
    var textEl = document.getElementById('cmtText');
    var text = textEl.value.trim();
    if (!text) { toast('댓글 내용을 입력해 주세요.'); textEl.focus(); return; }

    var anonEl = document.getElementById('cmtAnon');
    if (anonEl && anonEl.checked) {
      openModal({
        title: '익명 댓글은 한 번만 쓸 수 있어요',
        body: '익명 댓글은 <b>모든 기사를 통틀어 1회</b>만 작성할 수 있습니다. 등록한 뒤에는 다시 익명으로 쓸 수 없고, 댓글을 지워도 기회는 돌아오지 않습니다.<br>동의하고 등록할까요?',
        ok: '동의하고 등록',
        onOk: function () { store.set('anonUsed', true); postComment(text, true); renderCommentTop(); }
      });
      return;
    }
    if (!myNick()) { showGate(); return; }
    postComment(text, false);
  });

  function postComment(text, anon) {
    var list = getMyComments(current);
    list.push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nick: anon ? '' : myNick(), anon: anon, text: text, time: now(), ts: Date.now() });
    store.set('comments:' + current, list);
    document.getElementById('cmtText').value = '';
    document.getElementById('cmtLen').textContent = '0';
    sortMode = 'new';
    toast(anon ? '익명 댓글을 등록했습니다.' : '댓글을 등록했습니다.');
    refreshReactions();
  }

  // ---------- 확인 팝업 (브라우저 기본 confirm 대신 화면 안에 띄움) ----------
  var modalBg = null, modalOk = null, lastFocus = null;
  function openModal(o) {
    closeModal();
    lastFocus = document.activeElement;
    modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<div class="m-body"><h5 id="mTitle">' + esc(o.title) + '</h5><p>' + o.body + '</p></div>' +
      '<div class="m-btns"><button type="button" data-m="cancel">' + esc(o.cancel || '취소') + '</button>' +
      '<button type="button" class="ok" data-m="ok">' + esc(o.ok || '확인') + '</button></div></div>';
    document.body.appendChild(modalBg);
    modalOk = o.onOk;
    modalBg.querySelector('[data-m="ok"]').focus();
  }
  function closeModal() {
    if (!modalBg) return;
    modalBg.remove();
    modalBg = null; modalOk = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('click', function (e) {
    if (!modalBg) return;
    var b = e.target.closest('[data-m]');
    if (b) {
      var fn = b.getAttribute('data-m') === 'ok' ? modalOk : null;
      closeModal();
      if (fn) fn();
    } else if (e.target === modalBg) {
      closeModal();
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'cmtText') document.getElementById('cmtLen').textContent = e.target.value.length;
  });

  // ================= 시작 화면 (학번이름·닉네임) =================
  // 게임에 합칠 때 이 화면이 게임 첫 화면 역할을 함. 닉네임 = 실명 글에 쓰이는 이름.
  var gateEl = null;
  function showGate() {
    if (gateEl) return;
    gateEl = document.createElement('div');
    gateEl.className = 'gate';
    gateEl.innerHTML = '' +
      '<form id="gateForm" autocomplete="off">' +
        '<div><div class="g-kicker">학습 게임 시작</div><h2>내 정보를 입력하세요</h2></div>' +
        '<label for="gateId">학번 이름<input id="gateId" maxlength="20" placeholder="예: 20315 김민지"></label>' +
        '<label for="gateNick">닉네임<input id="gateNick" maxlength="10" placeholder="2~10자">' +
          '<span class="g-hint">댓글에 보이는 이름이에요. 시작하면 바꿀 수 없어요.</span></label>' +
        '<button type="submit">시작하기</button>' +
        '<p class="g-note">학번과 이름은 화면에 보이지 않아요.</p>' +
      '</form>';
    document.body.appendChild(gateEl);
    document.getElementById('gateId').focus();
  }
  function hideGate() { if (gateEl) { gateEl.remove(); gateEl = null; } }

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'gateForm') return;
    e.preventDefault();
    var idEl = document.getElementById('gateId'), nickEl = document.getElementById('gateNick');
    var sid = idEl.value.trim().replace(/\s+/g, ' ');
    var nick = nickEl.value.trim();
    if (!/\d/.test(sid) || !/[가-힣a-zA-Z]/.test(sid)) { toast('학번과 이름을 함께 입력해 주세요.'); idEl.focus(); return; }
    if (nick.length < 2) { toast('닉네임은 2~10자로 입력해 주세요.'); nickEl.focus(); return; }
    if (nick === '익명') { toast('\'익명\'은 닉네임으로 쓸 수 없어요.'); nickEl.focus(); return; }
    openModal({
      title: '이대로 시작할까요?',
      body: esc(sid) + '<br>닉네임 <b>' + esc(nick) + '</b><br>시작하면 닉네임은 바꿀 수 없어요.',
      ok: '시작하기',
      cancel: '다시 쓰기',
      onOk: function () {
        store.set('profile', { '학번이름': sid, '닉네임': nick });
        hideGate();
        renderCommentTop();
        toast(nick + '님, 시작합니다.');
      }
    });
  });

  // 교사 테스트용: 주소 끝에 #reset 을 붙여 열면 이 브라우저 기록을 지우고 처음 화면으로
  function resetAll() {
    openModal({
      title: '이 브라우저의 기록을 지울까요?',
      body: '학생 정보, 내가 쓴 댓글, 추천·반대 기록이 모두 지워지고 시작 화면으로 돌아갑니다.',
      ok: '모두 지우기',
      onOk: function () {
        try {
          Object.keys(localStorage).forEach(function (k) { if (k.indexOf(NS) === 0) localStorage.removeItem(k); });
        } catch (err) {}
        Object.keys(mem).forEach(function (k) { delete mem[k]; });
        location.hash = 'list';
        showGate();
        toast('기록을 지웠습니다.');
      }
    });
  }

  // ================= 시작 =================
  document.getElementById('updated').textContent = 'UPDATED. ' + DATA['매체']['업데이트'];
  document.querySelectorAll('[data-outlet]').forEach(function (n) { n.textContent = OUTLET; });
  window.addEventListener('hashchange', route);
  route();
  if (!profile() && location.hash !== '#reset') showGate();
})();
</script>
</body>
</html>
