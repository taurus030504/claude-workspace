  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  /* 교사가 채워야 할 칸 표시 */
  .todo {
    background: var(--todo-bg);
    border: 1px dashed var(--todo-line);
    color: #8a6400;
    padding: 0 6px;
    border-radius: 3px;
    font-size: .92em;
  }

  /* 로고: 이미지 1개를 CSS 변수로 두고 여러 곳에서 재사용 */
  .logo-img {
    display: block;
    background: var(--logo) center / contain no-repeat;
    aspect-ratio: 960 / 210;
    max-width: 100%;
  }

  /* ---------- 상단 헤더 ---------- */
  .top {
    display: grid;
    grid-template-columns: 250px 1fr 250px;   /* 양옆은 비워 둠(광고 없음) */
    align-items: center;
    gap: 20px;
    padding: 18px 0;
  }
  .ad {
    position: relative;
    height: 80px;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
  }
  .ad small { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
  .ad::after {
    content: "AD";
    position: absolute; right: 4px; top: 3px;
    font-size: 9px; font-weight: 500; opacity: .7;
  }
  .ad-text { border: 1px solid var(--line); padding: 16px 18px; margin: 18px 0; display: grid; gap: 4px; font-size: 13px; color: var(--text-sub); position: relative; background: #fff; }
  .ad-text .ad-mark { position: absolute; right: 8px; top: 6px; font-size: 9px; color: #aaa; border: 1px solid #ddd; padding: 0 3px; border-radius: 2px; }
  .ad-text b { font-size: 15px; color: #111; }
  .ad-text em { font-style: normal; color: #1a4fa3; font-size: 12px; margin-top: 4px; }
  .logo { display: flex; justify-content: center; }
  .logo .logo-img { width: 240px; }

  .gnb {
    display: flex;
    align-items: center;
    gap: 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    height: 56px;
  }
  .gnb .updated { font-size: 14px; color: #222; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .gnb .updated b { font-weight: 700; }
  .gnb .updated .next-turn { border: 1px solid #ccc; background: #fff; font-size: 12px; padding: 3px 9px; border-radius: 3px; color: #333; margin-left: 4px; }
  .gnb .updated .next-turn:hover { border-color: #555; }
  .turns { display: flex; gap: 6px; flex-wrap: wrap; }
  .turns button { border: 1px solid #ccc; background: #fff; padding: 8px 12px; font-size: 13px; color: #111; border-radius: 4px; display: grid; gap: 2px; }
  .turns button small { font-size: 11px; color: var(--text-muted); }
  .turns button.on { border-color: #111; background: #111; color: #fff; }
  .turns button.on small { color: #ccc; }
  .gnb nav { flex: 1; display: flex; justify-content: center; gap: 26px; overflow-x: auto; scrollbar-width: none; }
  .gnb nav::-webkit-scrollbar { display: none; }
  .gnb nav a { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .gnb nav a.on { color: var(--brand); }
  .gnb .icons { display: flex; gap: 14px; }
  .gnb .icons svg { width: 22px; height: 22px; display: block; }
  .gnb .icons .icon-btn { border: 0; background: none; padding: 0; display: block; }
  /* 기록 지우기 창 */
  .tools { display: grid; gap: 8px; margin-top: 4px; }
  .tools button { text-align: left; border: 1px solid #ddd; background: #fff; padding: 12px 14px; font-size: 14px; color: #111; border-radius: 4px; display: grid; gap: 3px; }
  .tools button small { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .tools button:hover { border-color: #888; background: var(--bg-soft); }
  .tools button.danger { border-color: #f1b7c4; }
  .tools button.danger:hover { border-color: var(--brand); }
  .pin-note { margin-bottom: 10px !important; }
  .pin-in { display: block; width: 100%; font: inherit; background: #fff; color: #111; font-size: 18px; letter-spacing: .2em; padding: 10px 12px; border: 1.5px solid #ccc; border-radius: 4px; }
  .pin-in:focus { border-color: var(--brand); outline: none; }
  .tools-h { margin: 14px 0 8px; font-size: 14px; font-weight: 700; color: #111; }
  .tools-h:first-child { margin-top: 0; }
  .tools-h small { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 4px; }
  .rq { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
  .rq-item { border: 1px solid #e5e5e5; border-radius: 4px; padding: 10px 12px; }
  .rq-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .rq-head b { color: #111; }
  .rq-head span { color: var(--text-muted); font-size: 12px; }
  .rq-text { margin: 4px 0 !important; font-size: 13.5px !important; color: #333 !important; white-space: pre-wrap; }
  .rq-reason { font-size: 12px; color: #888; margin-bottom: 8px; }
  .rq-btns { display: flex; gap: 6px; }
  .rq-btns button { border: 1px solid #ccc; background: #fff; font-size: 12px; padding: 5px 12px; border-radius: 3px; color: #111; }
  .rq-btns button:hover { border-color: #555; }
  .rq-btns button.ghost { color: var(--text-muted); }
  .modal .m-body .rq p { color: #333; }
  /* 가상 반응 */
  .rx-pill { border: 0; background: #e8344e; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 14px; margin-right: 4px; white-space: nowrap; }
  .rx-pill b { font-weight: 700; margin-left: 2px; }
  .rx-pill[hidden] { display: none; }
  .rx-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #e8344e; margin-left: 4px; vertical-align: 2px; }
  .ritem.rx-fresh { animation: rxFresh 2.4s ease-out; }
  @keyframes rxFresh { 0% { background: #fff4bf; } 100% { background: transparent; } }
  .rx-set { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .rx-set > span { width: 32px; font-size: 12px; color: var(--text-muted); }
  .rx-set .turns button { padding: 5px 12px; }
  .rx-open { margin: 10px 0 8px; }
  .rx-bad { color: #c62828; }
  .rx-lint { margin: 0 0 10px; padding: 0 0 0 16px; font-size: 12px; color: #333; }
  .rx-lint span { color: #c62828; }
  .rx-vs { margin-top: 6px; }
  .rx-vs button { padding: 4px 10px; font-size: 12px; }
  .rxp-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .rxp-row label { display: grid; gap: 3px; font-size: 12px; color: var(--text-muted); }
  .rxp-row select, .rxp-row input { font-size: 13px; padding: 5px 6px; border: 1px solid #ccc; border-radius: 3px; background: #fff; color: #111; }
  .rxp-row .rxp-a { max-width: 190px; }
  .rxp-row .rxp-s { width: 64px; }
  .rxp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rxp-col textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px; border: 1px solid #ccc; border-radius: 3px; resize: vertical; }
  .rxp-v { font-size: 13px; margin: 6px 0; }
  .rxp-v span { color: var(--text-muted); font-size: 12px; }
  .rxp-turn { border-top: 1px solid #eee; padding: 6px 0; font-size: 12px; }
  .rxp-th { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .rxp-th em { font-style: normal; color: var(--text-muted); margin-left: auto; }
  .rxp-turn ul { margin: 4px 0 0; padding: 0 0 0 14px; }
  .rxp-empty { color: var(--text-muted); font-size: 12px; margin: 4px 0 !important; }
  .modal.wide:has(.rxp) { width: 640px; }
  @media (max-width: 640px) { .rxp-cols { grid-template-columns: 1fr; } }
  .tools-now { font-size: 12px; color: var(--text-muted); margin: 0 0 12px !important; }

  /* ---------- 공통 머리 ---------- */
  .crumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text-sub);
    margin: 28px 0 14px;
  }
  .crumb .sep { color: #bbb; }
  .crumb a:hover { color: var(--brand); }
  .headline {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -.04em;
    line-height: 1.35;
    margin: 0 0 26px;
    word-break: keep-all;
    text-wrap: balance;
  }
  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .meta { display: flex; gap: 14px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; padding: 0; margin: 0; }
  .meta li { list-style: none; display: flex; align-items: center; gap: 4px; }
  .meta li + li::before { content: ""; width: 1px; height: 11px; background: #ddd; margin-right: 10px; }
  .meta a:hover { color: var(--brand); text-decoration: underline; }

  /* 공유 버튼: 실제 서비스 로고·색 대신 일반 아이콘 */
  .share { display: flex; gap: 8px; align-items: center; }
  .share .sns {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc; background: #fff;
    display: grid; place-items: center; color: #444;
  }
  .share .sns:hover { border-color: var(--brand); color: var(--brand); }
  .share .sns svg { width: 15px; height: 15px; }
  .share .tool {
    min-width: 36px; height: 32px; padding: 0 6px; white-space: nowrap; border: 1px solid #ddd; background: #fff;
    display: grid; place-items: center; color: #333;
  }
  .share .tool svg { width: 15px; height: 15px; }
  .share .gap { width: 14px; }

  /* ---------- 본문 레이아웃 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr) 300px;
    gap: 46px;
    padding: 40px 0 60px;
  }
  .layout.two { grid-template-columns: minmax(0, 1fr) 300px; }
  .side-left { position: relative; }
  .reporter-card {
    display: block;
    background: var(--bg-soft);
    padding: 18px 10px 20px;
    text-align: center;
  }
  /* 기자 프로필 사진 자리: 얼굴 사진 대신 일러스트(게임 규칙) */
  .avatar {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 12px;
    background: #e3e8ef;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .reporter-card .rname { font-size: 15px; margin-bottom: 4px; }
  .reporter-card .rdesk { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .reporter-card .more { font-size: 13px; color: var(--text-sub); text-decoration: underline; text-underline-offset: 3px; }
  .reporter-card:hover .more { color: var(--brand); }
  .sticky-share {
    position: sticky; top: 16px;
    background: var(--bg-soft);
    margin-top: 8px; padding: 18px 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .sticky-share button {
    width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #555;
    border: 1.5px solid #bbb; display: grid; place-items: center;
  }
  .sticky-share button:hover { border-color: var(--brand); color: var(--brand); }
  .sticky-share svg { width: 15px; height: 15px; }

  .subtitle {
    border-left: 3px solid #999;
    padding-left: 14px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: 1.5;
    margin: 0 0 30px;
    word-break: keep-all;
  }
  .subtitle span { display: block; }

  figure.photo { margin: 0 0 34px; }
  .photo-box {
    position: relative;
    background: radial-gradient(ellipse at 30% 20%, #3a3f55 0%, #1b1d29 70%);
    padding: 26px 0;
    display: flex; justify-content: center;
    overflow: hidden;
  }
  .watermark {
    position: absolute; right: 16px; bottom: 12px;
    width: 110px;
    filter: brightness(0) invert(1);
    opacity: .35;
    pointer-events: none;
  }
  .poster { width: 560px; max-width: calc(100% - 32px); aspect-ratio: 16 / 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(ellipse at 70% 30%, #6b2a44 0%, #1a0f16 60%, #0f0f14 100%); color: #f3e9ec; box-shadow: 0 10px 30px rgba(0,0,0,.45); border-radius: 4px; }
  .poster b { font-size: clamp(34px, 7vw, 64px); font-weight: 900; letter-spacing: .3em; margin-left: .3em; }
  .poster span { font-size: 12px; letter-spacing: .25em; opacity: .75; }
  .photo-box.light { background: #fff; padding: 0 0 8px; }
  .photo-box.light .watermark { filter: none; opacity: .18; }
  .photo-box.light .photo-img { box-shadow: none; border-radius: 0; }
  .photo-img { display: block; width: 380px; max-width: calc(100% - 32px); height: auto; margin: 0 16px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  figcaption { font-size: 13px; color: var(--text-sub); padding: 12px 10px 0; line-height: 1.6; }

  /* ---------- SNS 스토리 캡처 (CSS로 재현, 가상 서비스) ---------- */
  .story {
    width: 300px;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(170deg, #27406b 0%, #4f7cb3 55%, #9cc3e6 100%);
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .story .bars { display: flex; gap: 3px; padding: 8px 8px 0; }
  .story .bars i { flex: 1; height: 2px; background: rgba(255,255,255,.45); border-radius: 2px; }
  .story .bars i.done { background: #fff; }
  .story .who { display: flex; align-items: center; gap: 7px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
  .story .who .pic { width: 26px; height: 26px; border-radius: 50%; background: #f3c9a8; }
  .blur { filter: blur(4px); user-select: none; }
  .story .caption {
    align-self: center;
    margin: 6px 0 10px;
    font-size: 17px; font-weight: 800;
    background: #fff; color: #111;
    padding: 4px 10px; border-radius: 6px;
    transform: rotate(-3deg);
    letter-spacing: -.02em;
  }
  .chat {
    margin: 0 16px;
    background: #eceff3;
    border-radius: 8px;
    overflow: hidden;
    color: #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    font-size: 10.5px;
  }
  .chat .bar {
    background: #fff; border-bottom: 1px solid #dde2e8; padding: 6px 9px;
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 10.5px;
  }
  .chat .bar .count { font-weight: 400; color: #6b7785; }
  .chat .bar .back { font-size: 13px; line-height: 1; }
  .chat .msgs { padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg-group { display: flex; gap: 5px; align-items: flex-start; }
  .msg-group .pf { width: 22px; height: 22px; border-radius: 50%; background: #9aa6b4; flex: none; display: grid; place-items: center; color: #fff; overflow: hidden; }
  .msg-group .pf svg { width: 16px; height: 16px; margin-top: 4px; }
  .msg-group .col { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .msg-group .nm { font-size: 9.5px; color: #4b5866; margin-bottom: 1px; }
  .bubble {
    background: #fff; border-radius: 10px; padding: 4px 8px;
    line-height: 1.35; max-width: 170px; word-break: break-all;
  }
  .me { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .me .bubble { background: #7c5cff; color: #fff; }
  .mention { font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .story .tags { margin-top: auto; padding: 0 12px 30px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .story .tags span {
    background: rgba(255,255,255,.92); color: #1f2937;
    font-weight: 800; font-size: 12px; padding: 4px 9px; border-radius: 6px;
  }
  .story .reply {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    border: 1px solid rgba(255,255,255,.7); border-radius: 20px;
    font-size: 10px; padding: 4px 10px; opacity: .8;
  }

  /* ---------- 방송 캡처 (예능 화면 + 자막, 인물은 실루엣) ---------- */
  .tvcap {
    position: relative;
    width: 560px; max-width: calc(100% - 32px);
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 4px;
    background: linear-gradient(180deg, #f3d9b1 0%, #e9b98a 60%, #b98058 100%);
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .tvcap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tvcap .tv-logo {
    position: absolute; top: 4%; right: 3%;
    background: rgba(0,0,0,.35); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; letter-spacing: -.02em;
  }
  .aitem .ath .tvcap .tv-sub { font-size: 30px; }
  .tvcap .tv-sub {
    position: absolute; left: 0; right: 0; bottom: 9%;
    text-align: center;
    font-size: clamp(18px, 4.6vw, 30px); font-weight: 900; letter-spacing: -.04em;
    color: #fff;
    -webkit-text-stroke: 6px #d6336c; paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    transform: rotate(-2deg);
  }

  /* ---------- 기사 본문 ---------- */
  .article-body {
    font-size: var(--body-size);
    line-height: 1.9;
    letter-spacing: -.02em;
    color: #222;
    word-break: keep-all;
  }
  .article-body p { margin: 0 0 1.4em; }
  .copyright { font-size: 13px; color: var(--text-muted); padding: 22px 0; border-top: 1px solid var(--line); margin-top: 34px; }

  .vote { display: flex; justify-content: center; gap: 10px; margin: 30px 0 10px; }
  .vote button {
    border: 1px solid #ccc; background: #fff; border-radius: 22px;
    padding: 9px 22px; font-size: 14px; display: flex; gap: 8px; align-items: center;
    color: #333;
  }
  .vote button svg { width: 16px; height: 16px; }
  .vote button b { font-variant-numeric: tabular-nums; }
  .vote button.on { border-color: var(--brand); color: var(--brand); background: #fff3f6; }

  .keywords { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 18px 0; border-top: 1px solid var(--line); }
  .keywords strong { font-size: 13px; margin-right: 6px; }
  .keywords span { font-size: 13px; padding: 5px 12px; border: 1px solid #ddd; border-radius: 16px; color: #333; }
  .byline-box {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 18px; background: var(--bg-soft); font-size: 14px;
  }
  .byline-box .who { display: flex; align-items: center; gap: 12px; }
  .byline-box .avatar { width: 40px; height: 40px; margin: 0; }
  .byline-box .link { color: var(--text-sub); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .byline-box .link:hover { color: var(--brand); }

  .more-box { margin-top: 26px; border-top: 2px solid #222; }
  .more-box h4 { font-size: 16px; margin: 14px 0 4px; font-weight: 700; }
  .more-box ul { margin: 0; padding: 0; }
  .more-box li { list-style: none; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 15px; display: flex; justify-content: space-between; gap: 12px; }
  .more-box li a:hover { color: var(--brand); text-decoration: underline; }
  .more-box li time { color: var(--text-muted); font-size: 13px; white-space: nowrap; }

  /* ---------- 댓글 ---------- */
  .comments { margin-top: 44px; }
  .c-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .c-head h4 { font-size: 18px; margin: 0; font-weight: 500; }
  .c-head h4 b { color: #111; font-variant-numeric: tabular-nums; }
  .sort { display: flex; gap: 2px; }
  .sort button { border: 0; background: none; font-size: 13px; color: var(--text-muted); padding: 4px 8px; }
  .sort button.on { color: #111; font-weight: 700; }
  .cbox { border: 1px solid #ccc; }
  .cbox .c-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 8px 14px; border-bottom: 1px solid #eee; font-size: 13px; color: var(--text-sub); min-height: 46px; }
  .cbox .c-top .nick-fixed b { color: #111; margin-right: 1px; }
  .cbox .c-top .anon { margin-left: auto; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .cbox .c-top .anon input { width: 15px; height: 15px; accent-color: var(--brand); margin: 0; }
  .cbox .c-top .anon small { color: var(--text-muted); }
  .cbox .c-top .anon.used { cursor: default; color: var(--text-muted); text-decoration: line-through; }
  .cbox textarea {
    display: block; width: 100%; border: 0; resize: vertical; min-height: 90px; padding: 14px;
    font: inherit; font-size: 14px; background: #fff; color: var(--text);
  }
  .cbox .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-left: 14px; font-size: 13px; color: var(--text-muted); }
  .cbox .foot button { border: 0; background: #333; color: #fff; padding: 12px 26px; font-size: 14px; }
  .cbox .foot button:hover { background: var(--brand); }
  .clist { list-style: none; margin: 0; padding: 0; }
  .citem { padding: 16px 4px; border-bottom: 1px solid #eee; }
  .citem .c-meta { display: flex; gap: 10px; align-items: baseline; font-size: 13px; color: var(--text-muted); }
  .citem .c-meta b { color: #222; font-size: 14px; }
  .citem p { margin: 8px 0 10px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
  .citem .c-meta .best { background: #e8344e; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: .04em; }
  .citem .c-meta .me-tag { border: 1px solid #ccc; color: var(--text-muted); font-size: 10px; padding: 0 5px; border-radius: 3px; }
  .citem .c-act { display: flex; gap: 6px; align-items: center; }
  .citem .c-act button { border: 1px solid #ddd; background: #fff; font-size: 12px; padding: 4px 10px; border-radius: 14px; color: #555; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .citem .c-act button svg { width: 13px; height: 13px; }
  .citem .c-act button.on { border-color: var(--brand); color: var(--brand); }
  .citem .c-act button.on.down { border-color: #2563eb; color: #2563eb; }
  .citem .c-act .c-sub { border: 0; background: none; color: var(--text-muted); font-size: 12px; padding: 4px 6px; }
  .citem .c-act .r-toggle b { color: #111; font-weight: 700; margin-left: 2px; }

        "문단": [
          "이은호와 김서진이 열애설에 휩싸였다.",
          "분위기가 바뀐 것은 {{D-1}}일 밤이다. 이날 두 사람의 예술고 동창이라고 밝힌 이용자 C씨는 자신의 SNS 스토리에 메시지 캡처와 함께 \"나 빼고 비밀연애함ㅡㅡ\"이라는 글을 올렸다.",
          "공개된 메시지에서 이은호는 \"요새 연락도 없고\", \"너무 서운한데ㅔㅔㅔ\", \"놀아줘\"라고 적은 뒤 \"나 말고 딴 사람 생겼어?\"라고 물었다.",
          "이를 본 C씨가 \"뭐야 둘이 사귐?\"이라며 김서진을 태그하자 이은호는 \"아 여기 아니네\"라고 답했다. 투정 섞인 말을 단체 대화방에 잘못 보낸 것 아니냐는 해석이 나오는 대목이다.",
          "해당 스토리에는 두 사람의 공식 계정이 함께 태그돼 있었다. 이 때문에 C씨가 부주의하게 사생활을 노출한 것 아니냐는 의혹도 나오고 있다.",
          "캡처는 게시 직후 온라인 커뮤니티와 SNS를 통해 빠르게 퍼졌다. 누리꾼들은 \"딴 사람 생겼냐고 묻는 건 사귀는 사이 아니냐\", \"단톡방에 잘못 보낸 게 맞는 것 같다\" 등의 반응을 보이고 있다.",
          "한편 두 사람은 예술고 동창으로, 최근 예능 '반창회'에 함께 출연해 남다른 '케미'로 화제를 모은 바 있다. 열애설과 관련해 소속사 JL Company는 아직 별도의 입장을 밝히지 않았다."
        ],

<script>
(function () {
  // ================= 데이터 =================
  var DATA = JSON.parse(document.getElementById('site-data').textContent);
  var OUTLET = DATA['매체']['이름'];
  var ARTICLES = DATA['기사'].slice().sort(function (a, b) { return a['시각'] > b['시각'] ? 1 : -1; });   // 시간순: 첫 화면 = 가장 이른 사건
  var articleById = {}, reporterById = {};
  ARTICLES.forEach(function (a) { articleById[a['아이디']] = a; });
  DATA['기자'].forEach(function (r) { reporterById[r['아이디']] = r; });

  // ================= 저장소 =================
  // 지금은 이 브라우저(localStorage)에만 저장. 게임에 합칠 때 get/set만 실시간 저장소로 바꾸면 됨.
  var NS = 'munyoung:';
  var mem = {};
  var store = {
    get: function (key, fallback) {
      var raw = null;
      try { raw = localStorage.getItem(NS + key); } catch (e) {}
      if (raw == null) raw = mem[key];
      if (raw == null) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    },
    set: function (key, value) {
      var raw = JSON.stringify(value);
      mem[key] = raw;
      try { localStorage.setItem(NS + key, raw); } catch (e) {}
    }
  };

  // ================= 도우미 =================
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // "[교사 입력]" 칸은 노란 표시로
  function val(s) {
    return /^\s*\[교사 입력\]\s*$/.test(String(s)) ? '<span class="todo">교사 입력</span>' : esc(s);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtTs(t) {
    var d = new Date(t);
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function now() { return fmtTs(Date.now()); }
  // 새 글의 시각: 실제 시계와 "기준 시각(floor) + 1분" 중 늦은 쪽. 시나리오 날짜가 실제보다 앞서 있어도 새 글이 항상 가장 최신이 됨
  function postStamp(floorTs) {
    var t = Math.max(gameNow() - 10 * 60000, (floorTs || 0)) + 60000;   // 현재 시점 10분 전과 가장 늦은 글 중 늦은 쪽 + 1분
    return { ts: t, time: fmtTs(t) };
  }
  function latestTs(a) {
    var m = 0;
    allComments(a).forEach(function (cm) {
      if (cm.ts > m) m = cm.ts;
      repliesOf(a, cm).forEach(function (r) { if (r.ts > m) m = r.ts; });
    });
    return m;
  }
  // 사건(이은호·김서진)과 관련된 기사만 열람 가능. 나머지는 제목만 보이고 누르면 안내 팝업
  var CASE_NAMES = DATA['매체']['사건 인물'] || [];
  function isCase(a) {
    var b = a['본문'], text = b['제목'] + ' ' + (b['키워드'] || []).join(' ');
    return a['사건 관련'] === true || (a['사건 관련'] !== false && CASE_NAMES.some(function (n) { return text.indexOf(n) > -1; }));
  }
  function isCaseId(id) { return !!articleById[id] && isCase(articleById[id]); }
  // 포털 검색 결과처럼 사건 인물 이름을 굵게
  function titleHTML(a) {
    var t = esc(a['본문']['제목']);
    if (!isCase(a)) return t;
    CASE_NAMES.forEach(function (n) { t = t.split(esc(n)).join('<b>' + esc(n) + '</b>'); });
    return t;
  }
  function reporterOf(a) { return reporterById[a['게시자']['기자']] || { 아이디: '', 이름: a['게시자']['기자'], 직함: '기자' }; }
  function byline(r) { return r['이름'] + ' ' + (r['직함'] || '기자'); }

    var a = articleById[current], c = counts(a);
    document.querySelectorAll('[data-up]').forEach(function (n) { n.textContent = c.up; });
    document.querySelectorAll('[data-down]').forEach(function (n) { n.textContent = c.down; });
    document.querySelectorAll('[data-ccount]').forEach(function (n) { n.textContent = c.comments; });
    document.querySelectorAll('[data-vote]').forEach(function (btn) {
      var on = btn.getAttribute('data-vote') === c.vote;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('[data-sort]').forEach(function (btn) {
      btn.classList.toggle('on', btn.getAttribute('data-sort') === sortMode);
    });

    var all = allComments(a);
    // BEST: 추천 50 이상 중 추천이 많은 순으로 최대 3개 → 정렬과 상관없이 맨 위에 고정
    var best = all.filter(function (cm) { return cm.up >= 50 && !cm.status; })
      .sort(function (x, y) { return y.up - x.up || y.ts - x.ts; }).slice(0, 3);
    var bestIds = best.map(function (cm) { return cm.id; });
    var ordered;
    if (sortMode === 'best') {
      // 추천순: BEST 3개를 맨 위에 고정하고 나머지는 추천-반대 순
      var rest = all.filter(function (cm) { return bestIds.indexOf(cm.id) < 0; });
      rest.sort(function (x, y) { return (y.up - y.down) - (x.up - x.down) || (y.ts - x.ts); });
      ordered = best.concat(rest);
    } else {
      // 최신순: 고정 없이 시간순 → 방금 쓴 내 댓글이 맨 위로 (BEST 표시는 그대로 붙음)
      ordered = all.slice().sort(function (x, y) { return y.ts - x.ts; });
    }
    var list = ordered.slice(0, shownCount);
    var left = ordered.length - list.length;

    var ul = document.getElementById('cmtList');
    if (!ul) return;
    rendered = {};
    var seenMap = store.get('rx:seen', {}), toMark = [];
    freshIds = {};
    function reportBtn(item) {
      if (item.mine) return '';
      return isReported(current, item.id)
        ? '<span class="c-sub c-report done">신고됨</span>'
        : '<button type="button" class="c-sub c-report" data-report="' + esc(item.id) + '">신고</button>';
    }
    function reactBtns(item, label) {
      var id = esc(item.id);
      return '<button data-creact="up" data-cid="' + id + '" class="' + (item.react === 'up' ? 'on' : '') + '" aria-pressed="' + (item.react === 'up') + '" aria-label="' + label + ' 추천">' + ICON.up + item.up + '</button>' +
        '<button data-creact="down" data-cid="' + id + '" class="down ' + (item.react === 'down' ? 'on' : '') + '" aria-pressed="' + (item.react === 'down') + '" aria-label="' + label + ' 반대">' + ICON.down + item.down + '</button>';
    }
    function replyHTML(cm) {
      var rs = repliesOf(a, cm);
      var items = rs.map(function (r) {
        if (r.status) {
          return '<li class="ritem is-hidden">' +
            (r.status === '블라인드' ? '<div class="c-meta"><b>' + esc(r.nick) + '</b><span>' + esc(r.time) + '</span></div>' : '') +
            hiddenHTML(r) + '</li>';
        }
        rendered[r.id] = { nick: r.nick, text: r.text };
        return '<li class="ritem' + (freshIds[r.id] ? ' rx-fresh' : '') + '">' +
          '<div class="c-meta">' + nickHTML(r) + (r.mine ? '<span class="me-tag">내 답글</span>' : '') + '<span>' + esc(r.time) + '</span></div>' +
          '<p>' + esc(r.text) + '</p>' +
          '<div class="c-act">' + reactBtns(r, '답글') +
            (r.mine ? '<button class="del" data-rdel="' + esc(r.id) + '"' + (armedDelete === r.id ? ' data-armed' : '') + '>' + (armedDelete === r.id ? '삭제 확인' : '삭제') + '</button>' : reportBtn(r)) +
          '</div></li>';
      }).join('');
      var anon = anonUsed()
        ? '<span class="anon used">익명 사용 완료</span>'
        : '<label class="anon"><input type="checkbox" name="anon">익명<small>(1회)</small></label>';
      return '<div class="rwrap">' +
        (items ? '<ul class="rlist">' + items + '</ul>' : '') +
        '<form class="rform" data-rform="' + esc(cm.id) + '">' +
          '<div class="r-top"><span class="nick-fixed"><b>' + esc(myNick()) + '</b>(으)로 답글</span>' + anon + '</div>' +
          '<textarea name="text" maxlength="300" rows="2" placeholder="' + esc(cm.nick) + '님에게 답글을 남겨 보세요."></textarea>' +
          '<div class="foot"><span><b data-rlen>0</b> / 300</span><button type="submit">등록</button></div>' +
        '</form></div>';
    }
    ul.innerHTML = (list.length ? list.map(function (cm) {
      var id = esc(cm.id);
      var isBest = bestIds.indexOf(cm.id) > -1;
      var rcount = repliesOf(a, cm).length, open = !!openReplies[cm.id];
      var unseen = cm.mine && cm.rx ? cm.rx.replies.filter(function (r) { return !seenMap[r.id]; }).map(function (r) { return r.id; }) : [];
      if (open && unseen.length) { unseen.forEach(function (i) { freshIds[i] = 1; }); toMark = toMark.concat(unseen); unseen = []; }
      if (cm.status) {
        return '<li class="citem is-hidden' + (open ? ' r-open' : '') + '">' +
          (cm.status === '블라인드' ? '<div class="c-meta"><b>' + esc(cm.nick) + '</b><span>' + esc(cm.time) + '</span></div>' : '') +
          hiddenHTML(cm) +
          (rcount ? '<div class="c-act"><button type="button" class="c-sub r-toggle' + (open ? ' on' : '') + '" data-rtoggle="' + id + '" aria-expanded="' + open + '">답글 <b>' + rcount + '</b></button></div>' : '') +
          (open ? replyHTML(cm) : '') +
        '</li>';
      }
      rendered[cm.id] = { nick: cm.nick, text: cm.text };
      return '<li class="citem' + (isBest ? ' is-best' : '') + (open ? ' r-open' : '') + '">' +
        '<div class="c-meta">' + (isBest ? '<span class="best">BEST</span>' : '') +
          nickHTML(cm) + (cm.mine ? '<span class="me-tag">내 댓글</span>' : '') +
          '<span>' + esc(cm.time) + '</span></div>' +
        '<p>' + esc(cm.text) + '</p>' +
        '<div class="c-act">' + reactBtns(cm, '댓글') +
          '<button type="button" class="c-sub r-toggle' + (open ? ' on' : '') + '" data-rtoggle="' + id + '" aria-expanded="' + open + '">답글' + (rcount ? ' <b>' + rcount + '</b>' : '') + (unseen.length ? '<i class="rx-dot" aria-label="새 답글"></i>' : '') + '</button>' +
          (cm.mine ? '<button class="del" data-cdel="' + id + '">삭제</button>' : reportBtn(cm)) +
        '</div>' +
        (open ? replyHTML(cm) : '') +
      '</li>';
    }).join('') : '<li class="cempty">아직 댓글이 없습니다. 첫 댓글을 남겨 보세요.</li>') +
      (left > 0 ? '<li class="cmore"><button type="button" data-more>댓글 더보기 <b>' + left + '</b></button></li>' : '');
    rxMarkSeen(toMark);
    renderRxPill();
  }

  // ================= 댓글 작성자(닉네임)별 모아보기 =================
  // 데이터 댓글 + 이 브라우저에서 단 댓글을 닉네임으로 묶는다. 익명 댓글은 추적하지 않는다.
  function nickHTML(cm) {
    if (cm.anon || cm.nick === '익명' || !isTeacher()) return '<b>' + esc(cm.nick) + '</b>';
    return '<a class="nick" href="#user-' + encodeURIComponent(cm.nick) + '"><b>' + esc(cm.nick) + '</b></a>';
  }
  function commentsByNick() {
    var map = {};
    function add(a, cm, parentNick) {
      if (cm.anon || cm.nick === '익명' || cm.status === '삭제' || cm.status === '작성자 삭제') return;
      var u = map[cm.nick] || (map[cm.nick] = { nick: cm.nick, items: [], up: 0, down: 0, articles: {}, mine: false, last: 0 });
      u.items.push({ a: a, cm: cm, parentNick: parentNick || '' });
      u.up += cm.up; u.down += cm.down;
      u.articles[a['아이디']] = true;
      if (cm.mine) u.mine = true;
      if (cm.ts > u.last) u.last = cm.ts;
    }
    VIS().filter(isCase).forEach(function (a) {
      allComments(a).forEach(function (cm) {
        add(a, cm, '');
        repliesOf(a, cm).forEach(function (r) { add(a, r, cm.nick); });
      });
    });
    return Object.keys(map).map(function (k) {
      var u = map[k]; u.count = u.items.length; u.articleCount = Object.keys(u.articles).length; return u;
    });
  }
  function userCrumb(extra) { return crumbHTML([{ t: '댓글 작성자', href: extra ? '#users' : null }].concat(extra ? [extra] : [])); }

  function renderUsers() {
    current = null;
    document.title = '댓글 작성자 - ' + OUTLET;
    setNav('');
    var users = commentsByNick().sort(function (x, y) { return y.count - x.count || y.up - x.up || x.nick.localeCompare(y.nick, 'ko'); });
    var total = 0; users.forEach(function (u) { total += u.count; });
    document.getElementById('view').innerHTML = '' +
      userCrumb(null) +
      '<div class="layout two" style="padding-top:12px">' +
        '<div>' +
          '<h2 class="list-title">댓글 작성자 <small>' + users.length + '명, 댓글 ' + total + '개</small></h2>' +
          '<p class="u-note">닉네임을 누르면 그 사람이 어떤 기사에 어떤 댓글을 썼는지 모두 볼 수 있어요. 익명 댓글은 포함되지 않아요.</p>' +
          '<table class="ulist"><thead><tr><th>닉네임</th><th>댓글</th><th>기사</th><th>추천</th><th>반대</th><th>마지막 댓글</th></tr></thead><tbody>' +
          users.map(function (u) {
            return '<tr' + (u.mine ? ' class="is-me"' : '') + '><td>' + nickHTML({ nick: u.nick }) + (u.mine ? '<span class="me-tag">나</span>' : '') + '</td>' +
              '<td>' + u.count + '</td><td>' + u.articleCount + '</td><td class="up">' + u.up + '</td><td class="down">' + u.down + '</td>' +
              '<td class="t">' + esc(u.items.slice().sort(function (p, q) { return q.cm.ts - p.cm.ts; })[0].cm.time) + '</td></tr>';
          }).join('') +
          '</tbody></table>' +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  function renderUser(nick) {
    current = null;
    document.title = nick + '의 댓글 - ' + OUTLET;
    setNav('');
    var u = commentsByNick().filter(function (x) { return x.nick === nick; })[0];
    var body;
    if (!u) {
      body = '<p class="lempty">\'' + esc(nick) + '\' 닉네임으로 쓴 댓글이 없습니다.</p>';
    } else {
      // 기사 구분 없이 최신 글부터 (어느 기사인지는 표시하지 않음 — 누르면 그 댓글 위치로 감)
      var all = u.items.slice().sort(function (p, q) { return q.cm.ts - p.cm.ts; });
      body = '<section class="ugroup">' +
          '<ul class="clist">' + all.map(function (it) {
            var cm = it.cm, a = it.a;
            var goHref = '#article-' + a['아이디'] + '/comment-' + encodeURIComponent(cm.id);
            return '<li class="citem u-go' + (cm.up >= 50 ? ' is-best' : '') + '" data-go="' + goHref + '" title="누르면 기사의 이 댓글 위치로 갑니다">' +
              '<div class="c-meta">' + (cm.up >= 50 && !it.parentNick ? '<span class="best">BEST</span>' : '') + '<b>' + esc(cm.nick) + '</b>' + (cm.mine ? '<span class="me-tag">' + (it.parentNick ? '내 답글' : '내 댓글') + '</span>' : '') + (it.parentNick ? '<span class="r-tag">' + (it.parentNick === cm.nick ? '내 댓글 밑 답글' : esc(it.parentNick) + ' 댓글에 답글') + '</span>' : '') + '<span>' + esc(cm.time) + '</span></div>' +
              (cm.status === '블라인드'
                ? '<div class="c-hidden"><span class="c-hidden-msg">신고가 누적되어 블라인드 처리된 댓글입니다.</span></div><p class="c-peeked">' + esc(cm.text) + '<span class="c-reason">블라인드 사유: ' + esc(cm.reason || '운영 정책 위반') + '</span></p>'
                : '<p>' + esc(cm.text) + '</p>') +
              '<div class="c-act"><span class="c-num">' + ICON.up + cm.up + '</span><span class="c-num down">' + ICON.down + cm.down + '</span>' +
              '<a class="c-go" href="' + goHref + '">기사에서 보기 ›</a></div></li>';
          }).join('') + '</ul></section>';
    }
    document.getElementById('view').innerHTML = '' +
      userCrumb({ t: nick }) +
      '<div class="layout two">' +
        '<div>' +
          '<section class="profile user">' +
            avatar() +
            '<div>' +
              '<h1>' + esc(nick) + '<small>' + (u && u.mine ? '나' : '네티즌') + '</small></h1>' +
              '<div class="stats">' +
                '<span>댓글<b>' + (u ? u.count : 0) + '</b></span><span>기사<b>' + (u ? u.articleCount : 0) + '</b></span>' +
                '<span>받은 추천<b>' + (u ? u.up : 0) + '</b></span><span>받은 반대<b>' + (u ? u.down : 0) + '</b></span>' +
              '</div>' +
            '</div>' +
          '</section>' +
          body +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 화면: 기자 프로필 =================
  function renderReporter(rid) {

              '<dl>' +
                '<dt>부서</dt><dd>' + val(r['부서'] || '[교사 입력]') + '</dd>' +

            '</div>' +

          (mine.length ? '<ul class="alist">' + mine.map(function (a) { return articleItemHTML(a, { thumb: false }); }).join('') + '</ul>' : '<p class="lempty">아직 작성한 기사가 없습니다.</p>') +

  // ================= 화면: 전체기사 =================
  function renderList() {

    setNav('list');
    document.getElementById('view').innerHTML = '' +
      crumbHTML([{ t: '전체기사' }]) +
      '<div class="layout two" style="padding-top:12px">' +
        '<div>' +
          '<h2 class="list-title">전체기사 <small>' + VIS().length + '건</small></h2>' +

  // 기사 안의 특정 댓글(또는 댓글 영역)로 이동
  function jumpToComment(cid) {
    var a = articleById[current]; if (!a) return;
    if (cid) {
      var parent = cid.indexOf('r') > 0 && cid.charAt(0) === 's' ? cid.slice(0, cid.indexOf('r')) : null;   // 시드 답글 s3r1 → 부모 s3
      if (!parent) { var mineR = getMyReplies(current).filter(function (r) { return r.id === cid; })[0]; if (mineR) parent = mineR.parent; }
      if (!parent && cid.indexOf('_rx') > 0) parent = cid.split('_rx')[0];   // 가상 답글 → 내 댓글
      var target = parent || cid;
      shownCount = Math.max(shownCount, allComments(a).length);   // 전부 펼침
      if (parent) openReplies[parent] = true;
      refreshReactions();
    }
    var el = cid ? document.querySelector('[data-cid="' + CSS.escape(cid) + '"]') : null;
    var box = el ? el.closest('.citem, .ritem') : document.getElementById('comments');
    if (!box) return;
    box.scrollIntoView({ block: 'center' });
    if (el) { box.classList.add('flash'); setTimeout(function () { box.classList.remove('flash'); }, 2200); }
  }

  // ================= 주소(#)에 따라 화면 전환 =================
  function route() {
    var h = location.hash.slice(1), m;
    if (h === 'comments' && current) return;            // 같은 기사 안에서 댓글로 이동
    if (h === 'reset') { renderList(); askTeacher(resetAll); return; }
    if ((m = h.match(/^reporter-(.+)$/)) && reporterById[m[1]]) renderReporter(m[1]);
    else if (h === 'users') { if (isTeacher()) renderUsers(); else { renderList(); askTeacher(renderUsers); } }
    else if ((m = h.match(/^user-(.+)$/))) { var nk; try { nk = decodeURIComponent(m[1]); } catch (err) { nk = m[1]; } if (isTeacher()) renderUser(nk); else { renderList(); askTeacher(function () { renderUser(nk); }); } }
    else if (h === 'list') renderList();
    else if ((m = h.match(/^article-([^/]+)(?:\/(comments|comment-(.+)))?$/)) && articleById[m[1]] && !visible(articleById[m[1]])) { renderList(); toast('아직 볼 수 없는 기사입니다.'); }
    else if (m && articleById[m[1]] && !isCase(articleById[m[1]])) { if (!current) renderList(); lockedNotice(); return; }
    else if (m && articleById[m[1]]) {
      if (current !== m[1]) renderArticle(m[1]);
      if (m[2]) { jumpToComment(m[3] ? decodeURIComponent(m[3]) : ''); return; }
    }
    else renderArticle((VIS()[0] || ARTICLES[ARTICLES.length - 1])['아이디']);
    window.scrollTo(0, 0);
  }

  // ================= 클릭·입력 처리 =================
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  var fontSize = 18;
  var armedDelete = null, armTimer;

  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go && !e.target.closest('a, button')) { location.hash = go.getAttribute('data-go'); return; }
    var t = e.target.closest('button, a');
    if (!t) return;

    var ah = t.getAttribute && t.getAttribute('href'), am = ah && ah.match(/^#article-(.+)$/);
    if (am && articleById[am[1]] && !isCase(articleById[am[1]])) { e.preventDefault(); lockedNotice(); return; }
    if (t.hasAttribute('data-tools')) { askTeacher(openToolsModal); return; }
    if (t.hasAttribute('data-next-turn')) {
      var ni = turnIndex() + 1; if (ni >= TURNS.length) return;
      openModal({ title: TURNS[ni].name + '(으)로 넘길까요?', body: '선생님이 알려 주셨을 때만 넘기세요.<br><b>' + esc(TURNS[ni].time) + '</b> ' + esc(TURNS[ni].note), ok: '넘기기', cancel: '아직',
        onOk: function () { setTurn(ni); toast(TURNS[ni].name + '이 되었습니다.'); } });
      return;
    }
    if (t.hasAttribute('data-set-turn')) { var ti = +t.getAttribute('data-set-turn'); closeModal(); setTurn(ti); toast(TURNS[ti].name + '으로 맞췄습니다.'); return; }
    if (t.hasAttribute('data-closed')) { e.preventDefault(); toast('수업용 페이지에서는 열리지 않는 메뉴입니다.'); return; }
    if (t.hasAttribute('data-toast')) { e.preventDefault(); toast(t.getAttribute('data-toast')); return; }
    if (t.hasAttribute('data-share')) { toast('수업용 페이지에서는 공유 기능이 동작하지 않습니다.'); return; }

    if (t.hasAttribute('data-copy')) {
      var url = location.href;
      try {
        navigator.clipboard.writeText(url).then(function () { toast('기사 주소가 복사되었습니다.'); },
          function () { toast('이 화면에서는 주소를 복사할 수 없습니다.'); });
      } catch (err) { toast('이 화면에서는 주소를 복사할 수 없습니다.'); }
      return;
    }

    if (t.hasAttribute('data-font')) {
      fontSize = Math.min(26, Math.max(14, fontSize + Number(t.getAttribute('data-font')) * 2));
      document.documentElement.style.setProperty('--body-size', fontSize + 'px');
      return;
    }

    if (t.hasAttribute('data-vote') && current) {
      var kind = t.getAttribute('data-vote');
      var prev = getVote(current);
      var next = prev === kind ? '' : kind;
      store.set('vote:' + current, next);
      toast(next ? (kind === 'up' ? '이 기사를 추천했습니다.' : '이 기사에 반대했습니다.') : (kind === 'up' ? '추천을 취소했습니다.' : '반대를 취소했습니다.'));
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-sort')) {
      sortMode = t.getAttribute('data-sort');
      shownCount = PAGE;
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-more')) {

      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-rtoggle') && current) {
      var rid = t.getAttribute('data-rtoggle');

      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-report') && current) { openReportModal(t.getAttribute('data-report')); return; }

    if (t.hasAttribute('data-peek') && current) {
      var pid = t.getAttribute('data-peek');

      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-rdel') && current) {
      var rdid = t.getAttribute('data-rdel');
      if (armedDelete !== rdid) {
        armedDelete = rdid;
        clearTimeout(armTimer);
        armTimer = setTimeout(function () { armedDelete = null; refreshReactions(); }, 3000);
        refreshReactions();
        return;
      }
      armedDelete = null; clearTimeout(armTimer);
      store.set('replies:' + current, getMyReplies(current).filter(function (r) { return r.id !== rdid; }));
      toast('답글을 삭제했습니다.');

      return;

    if (t.hasAttribute('data-cdel') && current) {

        }).join('') + '</div>' +
        '<h6 class="tools-h">댓글 반응 <small>이 브라우저 설정</small></h6>' + rxToolsHTML() +
        '<h6 class="tools-h">신고 접수함 <small>' + pend + '건 대기</small></h6>' + reportsHTML() +
        '<h6 class="tools-h">기록 지우기</h6>' +
        '<p class="tools-now">' + (p ? '<b>' + esc(p['닉네임']) + '</b> / ' : '') + '내 댓글 ' + t.comments + '개, 답글 ' + t.replies + '개, 신고 ' + t.reports + '건</p>' +
        '<div class="tools">' +
          '<button type="button" data-clear="comments">내 댓글과 답글만 지우기<small>닉네임, 추천 기록은 그대로 둡니다. 익명 사용 기회도 그대로입니다.</small></button>' +
          '<button type="button" data-clear="activity">댓글 관련 기록 모두 지우기<small>댓글, 답글, 댓글 추천과 반대, 신고와 처리 결과, 익명 사용 여부까지 지웁니다. 닉네임과 기사 추천은 남습니다.</small></button>' +
          '<button type="button" class="danger" data-clear="all">전부 지우고 시작 화면으로<small>학번이름과 닉네임까지 지웁니다. 처음부터 다시 시작합니다.</small></button>' +
        '</div>'
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-clear]');
    if (!b) return;
    var kind = b.getAttribute('data-clear');
    closeModal();
    if (kind === 'comments') {
      openModal({ title: '내 댓글과 답글을 지울까요?', body: '이 브라우저에서 쓴 댓글과 답글이 모두 지워집니다.', ok: '지우기',
        onOk: function () { clearKeys(['comments:', 'replies:']); afterClear('내 댓글과 답글을 지웠습니다.'); } });
    } else if (kind === 'activity') {
      openModal({ title: '댓글 관련 기록을 모두 지울까요?', body: '댓글, 답글, 댓글 추천과 반대, 신고, 익명 사용 기록이 지워집니다. 닉네임은 그대로입니다.', ok: '지우기',
        onOk: function () { clearKeys(['comments:', 'replies:', 'creact:', 'reports:', 'moderation:', 'anonUsed']); afterClear('댓글 관련 기록을 지웠습니다.'); } });
    } else if (kind === 'all') {
      resetAll();
    }
  });

  // 교사 테스트용: 주소 끝에 #reset 을 붙여 열면 이 브라우저 기록을 지우고 처음 화면으로
  function resetAll() {
    openModal({
      title: '이 브라우저의 기록을 지울까요?',
      body: '학생 정보, 내가 쓴 댓글, 추천과 반대 기록이 모두 지워지고 시작 화면으로 돌아갑니다.',
      ok: '모두 지우기',
      onOk: function () {
        try {
          Object.keys(localStorage).forEach(function (k) { if (k.indexOf(NS) === 0) localStorage.removeItem(k); });
        } catch (err) {}
        Object.keys(mem).forEach(function (k) { delete mem[k]; });
        location.hash = 'list';
        showGate();
        toast('기록을 지웠습니다.');
      }
    });
  }


  // ---------- 가상 반응: 상단 알림, 자동 새로 그림 ----------
  function renderRxPill() {
    var host = document.querySelector('.gnb .icons'); if (!host) return;
    var el = document.getElementById('rxPill');
    if (!el) {
      el = document.createElement('button'); el.type = 'button'; el.id = 'rxPill'; el.className = 'rx-pill'; el.setAttribute('data-rx-pill', '');
      host.insertBefore(el, host.firstChild);
    }
    var list = RX ? rxUnseen() : [];
    el.hidden = !list.length;
    el.innerHTML = '내 댓글에 새 답글 <b>' + list.length + '</b>';
  }
  var rxSig = '';
  function rxSignature() {
    var parts = [rxSetting('on'), rxSetting('level'), rxSetting('speed'), turnIndex()];
    VIS().forEach(function (a) {
      var aid = a['아이디'];
      getMyComments(aid).forEach(function (c) { var r = rxFor(aid, c); parts.push(c.id + ':' + r.up + '/' + r.down + '/' + r.replies.length); });
    });
    return parts.join(',');
  }
  // 학생이 답글을 쓰는 중이어도 글이 날아가지 않게 입력값을 지켰다가 다시 넣는다
  function rxSoftRefresh() {
    if (!current) { renderRxPill(); return; }
    var keep = {}, act = document.activeElement;
    document.querySelectorAll('[data-rform]').forEach(function (f) {
      var ta = f.querySelector('textarea'), an = f.querySelector('input[name="anon"]');
      keep[f.getAttribute('data-rform')] = { v: ta.value, focus: act === ta, s: ta.selectionStart, e: ta.selectionEnd, anon: an ? an.checked : false };
    });
    var y = window.scrollY;
    refreshReactions();
    Object.keys(keep).forEach(function (id) {
      var f = document.querySelector('[data-rform="' + CSS.escape(id) + '"]'); if (!f) return;
      var k = keep[id], ta = f.querySelector('textarea'), an = f.querySelector('input[name="anon"]');
      ta.value = k.v; if (an) an.checked = k.anon;
      var n = f.querySelector('[data-rlen]'); if (n) n.textContent = k.v.length;
      if (k.focus) { ta.focus(); try { ta.setSelectionRange(k.s, k.e); } catch (err) {} }
    });
    window.scrollTo(0, y);
  }
  // 누르는 순간 목록이 다시 그려지면 클릭이 사라지므로, 마지막으로 누른 뒤 1.2초 동안은 기다렸다가 그린다
  var rxLastTouch = 0;
  document.addEventListener('pointerdown', function () { rxLastTouch = Date.now(); }, true);
  document.addEventListener('keydown', function () { rxLastTouch = Date.now(); }, true);
  setInterval(function () {
    if (!RX || Date.now() - rxLastTouch < 1200) return;
    var sig = rxSignature();
    if (sig === rxSig) return;
    var first = !rxSig; rxSig = sig;
    if (first) { renderRxPill(); return; }
    rxSoftRefresh();
  }, 1500);

  // ---------- 가상 반응: 교사 도구 ----------
  var RX_VERDICTS = ['동조', '의심', '반박', '기타', '차단'];
  function rxToolsHTML() {
    if (!RX) return '<p class="tools-now">데이터에 "댓글 반응"이 없습니다.</p>';
    function btns(key, opts) {
      return opts.map(function (o) {
        var cur = rxSetting(key), on = key === 'on' ? (o[0] === '1') === !!cur : o[0] === cur;
        return '<button type="button" data-rx-set="' + key + ':' + esc(o[0]) + '"' + (on ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('');
    }
    var lint = rxLint();
    return '<div class="rx-set"><span>반응</span><div class="turns">' + btns('on', [['1', '켜짐'], ['0', '꺼짐']]) + '</div></div>' +
      '<div class="rx-set"><span>세기</span><div class="turns">' + btns('level', [['보통', '보통'], ['과열', '과열']]) + '</div></div>' +
      '<div class="rx-set"><span>속도</span><div class="turns">' + btns('speed', [['느리게', '느리게'], ['보통', '보통'], ['시연', '시연']]) + '</div></div>' +
      '<div class="rq-btns rx-open"><button type="button" data-rx-preview>미리보기</button><button type="button" data-rx-log>이 브라우저 반응 기록</button></div>' +
      '<p class="tools-now">' + (lint.length ? '대본 검사: <b class="rx-bad">' + lint.length + '줄 확인 필요</b>' : '대본 검사: 문제 없음') + '</p>' +
      (lint.length ? '<ul class="rx-lint">' + lint.map(function (b) { return '<li><b>' + esc(b.turn + ' ' + b.v) + '</b> ' + esc(b.nick) + ' "' + esc(b.text) + '" <span>' + esc(b.why) + '</span></li>'; }).join('') + '</ul>' : '');
  }
  function rxPreviewOut(box) {
    var aid = box.querySelector('.rxp-a').value, t = +box.querySelector('.rxp-t').value;
    var sid = box.querySelector('.rxp-s').value.replace(/\D/g, '') || '00', n = +box.querySelector('.rxp-n').value;
    box.querySelectorAll('.rxp-col').forEach(function (col) {
      var text = col.querySelector('textarea').value.trim(), out = col.querySelector('.rxp-out');
      if (!text) { out.innerHTML = '<p class="rxp-empty">문장을 넣으면 결과가 나옵니다.</p>'; return; }
      var jd = rxJudge(text);
      var c = { id: 'pv', text: text, v: jd.v, turn: t, n: n, ts: TURNS[t].ts - 9 * 60000, rt: 0 };
      var r = rxFor(aid, c, { att: sid.slice(-2) });
      var html = '<div class="rxp-v">판정 <b>' + esc(jd.v) + '</b>' + (jd.hits.length ? ' <span>' + esc(jd.hits.join(', ')) + '</span>' : ' <span>맞은 말 없음</span>') + '</div>';
      if (jd.v === '차단') html += '<p class="rxp-empty">반응 없이 신고 접수함으로 갑니다.</p>';
      var su = 0, sd = 0;
      r.turns.forEach(function (x) {
        su += x.plan.up; sd += x.plan.down;
        var reps = r.replies.filter(function (p) { return p.turn === x.j; });
        html += '<div class="rxp-turn"><div class="rxp-th"><b>' + esc(TURNS[x.j].name) + '</b><span>추천 +' + x.plan.up + '  반대 +' + x.plan.down + '</span><em>누적 ' + su + ' / ' + sd + '</em></div>' +
          (reps.length ? '<ul>' + reps.map(function (p) { return '<li><b>' + esc(p.nick) + '</b> ' + esc(p.text) + '</li>'; }).join('') + '</ul>' : '<p class="rxp-empty">답글 없음</p>') + '</div>';
      });
      out.innerHTML = html;
    });
  }
  function openRxPreview() {
    var arts = ARTICLES.filter(isCase);
    var col = function (ph) { return '<div class="rxp-col"><textarea maxlength="300" rows="2" placeholder="' + ph + '"></textarea><div class="rxp-out"></div></div>'; };
    openModal({
      title: '반응 미리보기', wide: true, single: true, ok: '닫기',
      body: '<div class="rxp" data-rxp>' +
        '<div class="rxp-row"><label>기사<select class="rxp-a">' + arts.map(function (a) { return '<option value="' + esc(a['아이디']) + '"' + (a['아이디'] === (current && isCaseId(current) ? current : 'a1') ? ' selected' : '') + '>' + esc(a['아이디'] + ' ' + a['본문']['제목'].slice(0, 18)) + '</option>'; }).join('') + '</select></label>' +
        '<label>쓴 턴<select class="rxp-t">' + TURNS.map(function (tn, i) { return '<option value="' + i + '"' + (i === turnIndex() ? ' selected' : '') + '>' + esc(tn.name) + '</option>'; }).join('') + '</select></label>' +
        '<label>학번<input class="rxp-s" value="1401" maxlength="5" inputmode="numeric"></label>' +
        '<label>몇 번째<select class="rxp-n"><option value="0">첫 댓글</option><option value="1">두 번째</option><option value="2">세 번째</option></select></label></div>' +
        '<p class="tools-now">같은 기사, 턴, 출석번호, 순번, 문장이면 어느 반에서나 이 결과가 그대로 나옵니다.</p>' +
        '<div class="rxp-cols">' + col('문장 하나') + col('비교할 문장 (선택)') + '</div></div>'
    });
    var box = document.querySelector('[data-rxp]'); if (box) rxPreviewOut(box);
  }
  document.addEventListener('input', function (e) { var box = e.target.closest && e.target.closest('[data-rxp]'); if (box) rxPreviewOut(box); });
  document.addEventListener('change', function (e) { var box = e.target.closest && e.target.closest('[data-rxp]'); if (box) rxPreviewOut(box); });
  function openRxLog() {
    var rows = [];
    ARTICLES.forEach(function (a) {
      var aid = a['아이디'];
      getMyComments(aid).forEach(function (c) { rows.push({ a: a, c: c, r: rxFor(aid, c) }); });
    });
    openModal({
      title: '이 브라우저 반응 기록', wide: true, single: true, ok: '닫기',
      body: rows.length ? '<p class="tools-now">판정을 바꾸면 그 댓글의 반응이 새 판정으로 다시 정해집니다.</p><div class="rq">' + rows.map(function (x) {
        var v = x.c.vOverride || x.r.v;
        return '<div class="rq-item"><div class="rq-head"><b>' + esc(x.c.anon ? '익명' : x.c.nick) + '</b><span>' + esc(x.a['아이디'] + ' ' + TURNS[x.c.turn || 0].name) + '</span></div>' +
          '<p class="rq-text">' + esc(x.c.text) + '</p>' +
          '<div class="rq-reason">받은 반응: 추천 ' + x.r.up + ', 반대 ' + x.r.down + ', 답글 ' + x.r.replies.length + '</div>' +
          '<div class="turns rx-vs">' + RX_VERDICTS.map(function (k) { return '<button type="button" data-rx-v="' + esc(x.a['아이디'] + '|' + x.c.id + '|' + k) + '"' + (k === v ? ' class="on"' : '') + '>' + k + '</button>'; }).join('') + '</div></div>';
      }).join('') + '</div>' : '<p class="tools-now">이 브라우저에서 쓴 댓글이 없습니다.</p>'
    });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-rx-set], [data-rx-preview], [data-rx-log], [data-rx-v], [data-rx-pill]');
    if (!b) return;
    if (b.hasAttribute('data-rx-pill')) {
      var u = rxUnseen()[0]; if (!u) return;
      var h = '#article-' + u.aid + '/comment-' + encodeURIComponent(u.rid);
      if (location.hash === h) jumpToComment(u.rid); else location.hash = h;
      return;
    }
    if (b.hasAttribute('data-rx-preview')) { openRxPreview(); return; }
    if (b.hasAttribute('data-rx-log')) { openRxLog(); return; }
    if (b.hasAttribute('data-rx-v')) {
      var p = b.getAttribute('data-rx-v').split('|'), list = getMyComments(p[0]);
      list.forEach(function (c) { if (c.id === p[1]) c.vOverride = p[2]; });
      store.set('comments:' + p[0], list);
      rxSig = 'x'; openRxLog(); toast('판정을 ' + p[2] + '(으)로 바꿨습니다.');
      return;
    }
    var kv = b.getAttribute('data-rx-set').split(':');
    store.set('rx:' + kv[0], kv[0] === 'on' ? kv[1] === '1' : kv[1]);
    rxSig = 'x'; openToolsModal();
  });

  // ================= 시작 =================
  renderClock();
  document.querySelectorAll('[data-outlet]').forEach(function (n) { n.textContent = OUTLET; });
  window.addEventListener('hashchange', route);
  route();
  if (!profile() && location.hash !== '#reset') showGate();
})();
</script>
</body>
</html>
