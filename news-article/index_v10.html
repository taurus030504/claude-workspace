  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 16px; }

  /* 교사가 채워야 할 칸 표시 */
  .todo {
    background: var(--todo-bg);
    border: 1px dashed var(--todo-line);
    color: #8a6400;
    padding: 0 6px;
    border-radius: 3px;
    font-size: .92em;
  }

  /* 로고: 이미지 1개를 CSS 변수로 두고 여러 곳에서 재사용 */
  .logo-img {
    display: block;
    background: var(--logo) center / contain no-repeat;
    aspect-ratio: 2000 / 574;
    max-width: 100%;
  }

  /* ---------- 상단 헤더 ---------- */
  .top {
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    align-items: center;
    gap: 20px;
    padding: 18px 0;
  }
  .ad {
    position: relative;
    height: 80px;
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: #fff;
    font-weight: 700;
    line-height: 1.25;
  }
  .ad small { display: block; font-weight: 400; font-size: 11px; opacity: .85; }
  .ad::after {
    content: "AD";
    position: absolute; right: 4px; top: 3px;
    font-size: 9px; font-weight: 500; opacity: .7;
  }
  .ad-1 { background: linear-gradient(120deg, #0f766e, #14b8a6); font-size: 19px; }
  .ad-2 { background: linear-gradient(120deg, #18181b, #3f3f46); font-size: 16px; justify-content: flex-end; text-align: right; }
  .logo { display: flex; justify-content: center; }
  .logo .logo-img { width: 200px; }

  .gnb {
    display: flex;
    align-items: center;
    gap: 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    height: 56px;
  }
  .gnb .updated { font-size: 14px; color: #222; white-space: nowrap; }
  .gnb nav { flex: 1; display: flex; justify-content: center; gap: 26px; overflow-x: auto; scrollbar-width: none; }
  .gnb nav::-webkit-scrollbar { display: none; }
  .gnb nav a { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .gnb nav a.on { color: var(--brand); }
  .gnb .icons { display: flex; gap: 14px; }
  .gnb .icons svg { width: 22px; height: 22px; display: block; }

  /* ---------- 공통 머리 ---------- */
  .crumb {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--text-sub);
    margin: 28px 0 14px;
  }
  .crumb .sep { color: #bbb; }
  .crumb a:hover { color: var(--brand); }
  .headline {
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -.04em;
    line-height: 1.35;
    margin: 0 0 26px;
    word-break: keep-all;
    text-wrap: balance;
  }
  .meta-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .meta { display: flex; gap: 14px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; padding: 0; margin: 0; }
  .meta li { list-style: none; display: flex; align-items: center; gap: 4px; }
  .meta li + li::before { content: ""; width: 1px; height: 11px; background: #ddd; margin-right: 10px; }
  .meta a:hover { color: var(--brand); text-decoration: underline; }

  /* 공유 버튼: 실제 서비스 로고·색 대신 일반 아이콘 */
  .share { display: flex; gap: 8px; align-items: center; }
  .share .sns {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ccc; background: #fff;
    display: grid; place-items: center; color: #444;
  }
  .share .sns:hover { border-color: var(--brand); color: var(--brand); }
  .share .sns svg { width: 15px; height: 15px; }
  .share .tool {
    min-width: 36px; height: 32px; padding: 0 6px; white-space: nowrap; border: 1px solid #ddd; background: #fff;
    display: grid; place-items: center; color: #333;
  }
  .share .tool svg { width: 15px; height: 15px; }
  .share .gap { width: 14px; }

  /* ---------- 본문 레이아웃 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 130px minmax(0, 1fr) 300px;
    gap: 46px;
    padding: 40px 0 60px;
  }
  .layout.two { grid-template-columns: minmax(0, 1fr) 300px; }
  .side-left { position: relative; }
  .reporter-card {
    display: block;
    background: var(--bg-soft);
    padding: 18px 10px 20px;
    text-align: center;
  }
  /* 기자 프로필 사진 자리: 얼굴 사진 대신 일러스트(게임 규칙) */
  .avatar {
    width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 12px;
    background: #e3e8ef;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .avatar svg { display: block; width: 100%; height: 100%; }
  .reporter-card .rname { font-size: 15px; margin-bottom: 4px; }
  .reporter-card .rdesk { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .reporter-card .more { font-size: 13px; color: var(--text-sub); text-decoration: underline; text-underline-offset: 3px; }
  .reporter-card:hover .more { color: var(--brand); }
  .sticky-share {
    position: sticky; top: 16px;
    background: var(--bg-soft);
    margin-top: 8px; padding: 18px 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .sticky-share button {
    width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #555;
    border: 1.5px solid #bbb; display: grid; place-items: center;
  }
  .sticky-share button:hover { border-color: var(--brand); color: var(--brand); }
  .sticky-share svg { width: 15px; height: 15px; }

  .subtitle {
    border-left: 3px solid #999;
    padding-left: 14px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: 1.5;
    margin: 0 0 30px;
    word-break: keep-all;
  }
  .subtitle span { display: block; }

  figure.photo { margin: 0 0 34px; }
  .photo-box {
    position: relative;
    background: radial-gradient(ellipse at 30% 20%, #3a3f55 0%, #1b1d29 70%);
    padding: 26px 0;
    display: flex; justify-content: center;
    overflow: hidden;
  }
  .watermark {
    position: absolute; right: 16px; bottom: 12px;
    width: 110px;
    filter: brightness(0) invert(1);
    opacity: .35;
    pointer-events: none;
  }
  .poster { width: 560px; max-width: calc(100% - 32px); aspect-ratio: 16 / 9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(ellipse at 70% 30%, #6b2a44 0%, #1a0f16 60%, #0f0f14 100%); color: #f3e9ec; box-shadow: 0 10px 30px rgba(0,0,0,.45); border-radius: 4px; }
  .poster b { font-size: clamp(34px, 7vw, 64px); font-weight: 900; letter-spacing: .3em; margin-left: .3em; }
  .poster span { font-size: 12px; letter-spacing: .25em; opacity: .75; }
  .photo-img { display: block; width: 380px; max-width: calc(100% - 32px); height: auto; margin: 0 16px; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  figcaption { font-size: 13px; color: var(--text-sub); padding: 12px 10px 0; line-height: 1.6; }

  /* ---------- SNS 스토리 캡처 (CSS로 재현, 가상 서비스) ---------- */
  .story {
    width: 300px;
    max-width: 100%;
    aspect-ratio: 9 / 16;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(170deg, #27406b 0%, #4f7cb3 55%, #9cc3e6 100%);
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .story .bars { display: flex; gap: 3px; padding: 8px 8px 0; }
  .story .bars i { flex: 1; height: 2px; background: rgba(255,255,255,.45); border-radius: 2px; }
  .story .bars i.done { background: #fff; }
  .story .who { display: flex; align-items: center; gap: 7px; padding: 8px 10px; font-size: 12px; font-weight: 600; }
  .story .who .pic { width: 26px; height: 26px; border-radius: 50%; background: #f3c9a8; }
  .blur { filter: blur(4px); user-select: none; }
  .story .caption {
    align-self: center;
    margin: 6px 0 10px;
    font-size: 17px; font-weight: 800;
    background: #fff; color: #111;
    padding: 4px 10px; border-radius: 6px;
    transform: rotate(-3deg);
    letter-spacing: -.02em;
  }
  .chat {
    margin: 0 16px;
    background: #eceff3;
    border-radius: 8px;
    overflow: hidden;
    color: #111;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    font-size: 10.5px;
  }
  .chat .bar {
    background: #fff; border-bottom: 1px solid #dde2e8; padding: 6px 9px;
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 10.5px;
  }
  .chat .bar .count { font-weight: 400; color: #6b7785; }
  .chat .bar .back { font-size: 13px; line-height: 1; }
  .chat .msgs { padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .msg-group { display: flex; gap: 5px; align-items: flex-start; }
  .msg-group .pf { width: 22px; height: 22px; border-radius: 50%; background: #9aa6b4; flex: none; display: grid; place-items: center; color: #fff; overflow: hidden; }
  .msg-group .pf svg { width: 16px; height: 16px; margin-top: 4px; }
  .msg-group .col { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }

  /* ---------- 방송 캡처 (예능 화면 + 자막, 인물은 실루엣) ---------- */

  .keywords { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 18px 0; border-top: 1px solid var(--line); }

  .more-box { margin-top: 26px; border-top: 2px solid #222; }

  /* ---------- 댓글 ---------- */
  .comments { margin-top: 44px; }

  .c-head h4 { font-size: 18px; margin: 0; font-weight: 500; }

  .sort { display: flex; gap: 2px; }
  .sort button { border: 0; background: none; font-size: 13px; color: var(--text-muted); padding: 4px 8px; }

  .cbox { border: 1px solid #ccc; }

  .cbox textarea {
    display: block; width: 100%; border: 0; resize: vertical; min-height: 90px; padding: 14px;
    font: inherit; font-size: 14px; background: #fff; color: var(--text);
  }
  .cbox .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-left: 14px; font-size: 13px; color: var(--text-muted); }
  .cbox .foot button { border: 0; background: #333; color: #fff; padding: 12px 26px; font-size: 14px; }
  .cbox .foot button:hover { background: var(--brand); }
  .clist { list-style: none; margin: 0; padding: 0; }
  .citem { padding: 16px 4px; border-bottom: 1px solid #eee; }

  .citem .c-meta b { color: #222; font-size: 14px; }
  .citem p { margin: 8px 0 10px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }

  .citem .c-meta .me-tag { border: 1px solid #ccc; color: var(--text-muted); font-size: 10px; padding: 0 5px; border-radius: 3px; }

  .citem .c-act button svg { width: 13px; height: 13px; }

  .citem.is-best { background: #fff8fa; padding-left: 12px; padding-right: 12px; }
  .cmore { list-style: none; }
  .cmore button { width: 100%; margin-top: 14px; padding: 13px; border: 1px solid #ccc; background: #fff; font-size: 14px; color: #333; }
  .cmore button b { color: var(--brand); font-variant-numeric: tabular-nums; }

  .cempty { padding: 28px 0; text-align: center; color: var(--text-muted); font-size: 14px; border-bottom: 1px solid #eee; }

  /* ---------- 기자 프로필 ---------- */
  .profile {
    display: grid;

  }
  .profile .avatar { width: 120px; height: 120px; margin: 0; }

  .profile .stats b { color: var(--brand); font-size: 16px; font-variant-numeric: tabular-nums; margin-left: 4px; }

  /* ---------- 댓글 작성자별 보기 ---------- */
  .sort .who-link { font-size: 13px; color: var(--text-sub); padding: 4px 8px; margin-right: 6px; border-right: 1px solid #ddd; text-decoration: underline; text-underline-offset: 3px; }
  .sort .who-link:hover { color: var(--brand); }
  .citem .c-meta a.nick b:hover, .ulist a.nick b:hover { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
  .u-note { margin: 14px 0 18px; font-size: 14px; color: var(--text-sub); line-height: 1.6; }
  .ulist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ulist th { text-align: left; font-weight: 700; font-size: 12px; color: var(--text-muted); padding: 8px 10px; border-bottom: 2px solid #222; white-space: nowrap; }
  .ulist td { padding: 11px 10px; border-bottom: 1px solid #eee; font-variant-numeric: tabular-nums; }
  .ulist td b { color: #111; font-size: 15px; }
  .ulist td.up { color: var(--brand); }
  .ulist td.down { color: #2563eb; }
  .ulist td.t { color: var(--text-muted); font-size: 13px; white-space: nowrap; }
  .ulist tr.is-me td { background: #fff8fa; }
  .ulist .me-tag { border: 1px solid #ccc; color: var(--text-muted); font-size: 10px; padding: 0 5px; border-radius: 3px; margin-left: 6px; }
  .profile.user { margin-bottom: 26px; }
  .profile .u-avatar { background: #9aa6b4; display: grid; place-items: center; }
  .profile .u-avatar svg { width: 70%; height: 70%; margin-top: 18%; }
  .ugroup { margin-top: 26px; }
  .ugroup h3 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0; padding-bottom: 10px; border-bottom: 2px solid #222; font-size: 17px; font-weight: 500; line-height: 1.45; letter-spacing: -.03em; word-break: keep-all; }
  .ugroup h3 .sec { font-size: 12px; color: var(--brand); font-weight: 700; white-space: nowrap; }
  .ugroup h3 a:hover { text-decoration: underline; }
  .ugroup h3 small { font-size: 13px; color: var(--text-muted); white-space: nowrap; margin-left: auto; }
  .citem .c-act .c-num { border: 1px solid #ddd; font-size: 12px; padding: 4px 10px; border-radius: 14px; color: #555; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .citem .c-act .c-num svg { width: 13px; height: 13px; }
  .citem .c-act .c-go { margin-left: auto; font-size: 12px; color: var(--text-muted); text-decoration: underline; text-underline-offset: 3px; }

  .list-title { display: flex; align-items: baseline; gap: 8px; border-bottom: 2px solid #222; padding-bottom: 12px; margin: 0; font-size: 20px; font-weight: 700; }
  .list-title small { font-size: 14px; color: var(--text-muted); font-weight: 400; }
  .alist { list-style: none; margin: 0; padding: 0; }
  .aitem { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 22px; padding: 22px 0; border-bottom: 1px solid #eee; }
  .aitem .sec { font-size: 12px; color: var(--brand); font-weight: 700; margin-bottom: 4px; }
  .aitem h3 { margin: 0 0 8px; font-size: 19px; font-weight: 500; line-height: 1.45; letter-spacing: -.03em; word-break: keep-all; }
  .aitem h3 a:hover { text-decoration: underline; }
  .aitem .sum { margin: 0 0 10px; font-size: 14px; color: var(--text-sub); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .aitem .info { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-muted); }
  .aitem .info a:hover { color: var(--brand); }
  .aitem .ath { width: 150px; height: 100px; border-radius: 2px; display: block; }
  /* 사건 관련 기사: 포털 검색 결과처럼 제목을 파란 링크색 + 인물 이름 굵게. 관련 없는 기사는 회색 */
  .aitem.case h3 a, .side-right .rank a.t.case, .more-box li.case a { color: #1a4fa3; }
  .aitem.case h3 a b, .rank a.t.case b, .more-box li.case a b { font-weight: 700; }
  .aitem.other h3 a, .side-right .rank a.t.other, .more-box li.other a { color: #666; }
  .aitem.no-thumb { grid-template-columns: minmax(0, 1fr); }
  .lempty { padding: 40px 0; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---------- 오른쪽 사이드 ---------- */
  .box { border: 1px solid #ddd; padding: 18px 16px; margin-bottom: 26px; }
  .box h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; }
  .box h3 b { color: var(--brand); font-weight: 700; }
  .rank { padding: 0; margin: 0; }
  .rank li {
    list-style: none; display: grid; grid-template-columns: 26px minmax(0, 1fr) 80px; gap: 8px;
    align-items: start; padding: 12px 0; border-bottom: 1px solid #eee;
  }
  .rank li:last-child { border-bottom: 0; }
  .rank .no { font-size: 20px; color: var(--brand); line-height: 1.2; }
  .rank .t { font-size: 15px; line-height: 1.45; letter-spacing: -.03em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rank a.t:hover { text-decoration: underline; }
  .thumb { width: 80px; height: 54px; border-radius: 2px; }
  .simple { padding: 0; margin: 0; }
  .simple li { list-style: none; padding: 9px 0; border-bottom: 1px dashed #e5e5e5; font-size: 14px; line-height: 1.45; letter-spacing: -.03em; }

  .ad-side { height: 250px; font-size: 22px; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding: 20px; background: linear-gradient(160deg, #1e293b, #4338ca); margin-bottom: 26px; }

  /* ---------- 푸터 ---------- */

  .toast {

  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .gate {

  .gate button {
    border: 0; background: var(--brand); color: #fff;
    font-size: 18px; font-weight: 700; padding: 15px; border-radius: 6px;
  }
  .gate button:hover { background: #c80f43; }
  .gate .g-note { margin: 0; font-size: 12px; color: var(--text-muted); text-align: center; }

  /* ---------- 확인 팝업 ---------- */
  .modal-bg {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    background: #fff; width: 380px; max-width: 100%;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .modal .m-body { padding: 26px 24px 22px; }
  .modal h5 { margin: 0 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -.03em; word-break: keep-all; }
  .modal p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--text-sub); word-break: keep-all; }

  @media (prefers-reduced-motion: reduce) {

  }

<!--
  사이트 데이터
  - "기자": 기자 프로필. 아이디는 영문으로(주소에 쓰임).
  - "기사": 기사 1건 = 템플릿 6칸(템플릿/게시자/시각/본문/이미지/공개 턴) + 아이디
           + 반응(처음부터 보이는 추천·반대 수) + 댓글(처음부터 달려 있는 댓글, 선택)
    · 이미지가 없는 기사는 "이미지": null
    · 새 기사는 맨 아래 기사 묶음을 복사해 아이디만 바꿔 붙이면 됩니다.
  - "[교사 입력]"으로 된 칸은 화면에 노란 표시로 나타납니다. 시나리오에 맞춰 채워 주세요.
-->
<script type="application/json" id="site-data">

        "제목": "이은호·김서진, SNS 스토리에 '비밀 연애' 메시지 캡처 공개…\"나 말고 딴 사람 생겼어?\"",
        "부제": [
          "\"요새 연락도 없고…놀아줘\" 예고 동창이 올린 메시지 그대로 노출",
          "\"둘이서 비밀 연애를 한다\"…두 사람 공식 계정도 태그"
        ],
        "문단": [
          "이은호와 김서진이 열애설에 휩싸였다.",
          "분위기가 바뀐 것은 3일 밤이다. 이날 두 사람의 예술고 동창이라고 밝힌 이용자 C씨는 자신의 SNS 스토리에 메시지 캡처와 함께 \"둘이서 비밀 연애를 한다\"는 글을 올렸다.",
          "공개된 메시지에서 이은호는 \"요새 연락도 없고\", \"너무 서운한데ㅔㅔㅔ\", \"놀아줘\"라고 적은 뒤 \"나 말고 딴 사람 생겼어?\"라고 물었다.",
          "이를 본 동창이 \"뭐야 둘이 사귐?\"이라며 김서진을 태그하자 이은호는 \"아 여기 아니네\"라고 답했다. 투정 섞인 말을 단체 대화방에 잘못 보낸 것 아니냐는 해석이 나오는 대목이다.",
          "해당 스토리에는 두 사람의 공식 계정이 함께 태그돼 있었다. 이 때문에 C씨가 부주의하게 사생활을 노출한 것 아니냐는 의혹도 나오고 있다.",
          "캡처는 게시 직후 온라인 커뮤니티와 SNS를 통해 빠르게 퍼졌다. 누리꾼들은 \"딴 사람 생겼냐고 묻는 건 사귀는 사이 아니냐\", \"단톡방에 잘못 보낸 게 맞는 것 같다\" 등의 반응을 보이고 있다.",

<script>
(function () {
  // ================= 데이터 =================
  var DATA = JSON.parse(document.getElementById('site-data').textContent);
  var OUTLET = DATA['매체']['이름'];
  var ARTICLES = DATA['기사'].slice().sort(function (a, b) { return a['시각'] < b['시각'] ? 1 : -1; });
  var articleById = {}, reporterById = {};
  ARTICLES.forEach(function (a) { articleById[a['아이디']] = a; });
  DATA['기자'].forEach(function (r) { reporterById[r['아이디']] = r; });

  // ================= 저장소 =================
  // 지금은 이 브라우저(localStorage)에만 저장. 게임에 합칠 때 get/set만 실시간 저장소로 바꾸면 됨.
  var NS = 'munyoung:';
  var mem = {};
  var store = {
    get: function (key, fallback) {
      var raw = null;
      try { raw = localStorage.getItem(NS + key); } catch (e) {}
      if (raw == null) raw = mem[key];
      if (raw == null) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    },
    set: function (key, value) {
      var raw = JSON.stringify(value);
      mem[key] = raw;
      try { localStorage.setItem(NS + key, raw); } catch (e) {}
    }
  };

  // ================= 도우미 =================
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // "[교사 입력]" 칸은 노란 표시로
  function val(s) {
    return /^\s*\[교사 입력\]\s*$/.test(String(s)) ? '<span class="todo">교사 입력</span>' : esc(s);
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function now() {
    var d = new Date();
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  // 사건(이은호·김서진)과 관련된 기사만 열람 가능. 나머지는 제목만 보이고 누르면 안내 팝업
  var CASE_NAMES = DATA['매체']['사건 인물'] || [];
  function isCase(a) {
    var b = a['본문'], text = b['제목'] + ' ' + (b['키워드'] || []).join(' ');
    return a['사건 관련'] === true || (a['사건 관련'] !== false && CASE_NAMES.some(function (n) { return text.indexOf(n) > -1; }));
  }
  function isCaseId(id) { return !!articleById[id] && isCase(articleById[id]); }
  // 포털 검색 결과처럼 사건 인물 이름을 굵게
  function titleHTML(a) {
    var t = esc(a['본문']['제목']);
    if (!isCase(a)) return t;
    CASE_NAMES.forEach(function (n) { t = t.split(esc(n)).join('<b>' + esc(n) + '</b>'); });
    return t;
  }
  function reporterOf(a) { return reporterById[a['게시자']['기자']] || { 아이디: '', 이름: a['게시자']['기자'], 직함: '기자' }; }
  function byline(r) { return r['이름'] + ' ' + (r['직함'] || '기자'); }
  function summary(a) {
    var t = (a['본문']['문단'][0] || '');
    return t.length > 110 ? t.slice(0, 110) + '…' : t;
  }
  function thumbStyle(a) {
    if (a['이미지'] && a['이미지']['종류'] === '사진' && a['이미지']['자료']) return "background:#1b1d29 url('" + a['이미지']['자료'] + "') center top / cover no-repeat";   // data URI에는 따옴표가 없음
    if (a['이미지'] && a['이미지']['종류'] === '스토리 캡처') return 'background:linear-gradient(160deg,#27406b,#9cc3e6)';
    if (a['이미지'] && a['이미지']['종류'] === '방송 캡처') return 'background:linear-gradient(160deg,#f3d9b1,#b98058)';
    if (a['이미지'] && a['이미지']['종류'] === '포스터') return 'background:linear-gradient(160deg,#3b1d2a,#0f0f14)';
    return 'background:linear-gradient(160deg,#e5e7eb,#9ca3af)';
  }

  var ICON = {
    person: '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="5"/><path d="M1 26c1.8-6.5 6-10 11-10s9.2 3.5 11 10z"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.3 10.8l7.4-4.4M8.3 13.2l7.4 4.4"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 7l9 6 9-6"/></svg>',
    scrap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 11v9H4v-9zM7 11l4-8c1.7 0 2.5 1 2.2 2.6L12.6 9H19a2 2 0 012 2.3l-1.2 6.9A2 2 0 0117.8 20H7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 13V4H4v9zM7 13l4 8c1.7 0 2.5-1 2.2-2.6L12.6 15H19a2 2 0 002-2.3l-1.2-6.9A2 2 0 0017.8 4H7"/></svg>'
  };
  // 기자 프로필 일러스트(정장 상반신). 얼굴 사진은 쓰지 않는다.
  // 기자 프로필 사진: 사이트 기본 아바타(회색 실루엣). 인물 얼굴 그림 없음
  var REPORTER_ART = '' +
    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<rect width="120" height="120" fill="#dfe3e8"/>' +
      '<circle cx="60" cy="46" r="22" fill="#9aa3ad"/>' +
      '<path d="M14 124c3-26 22-40 46-40s43 14 46 40z" fill="#9aa3ad"/>' +
    '</svg>';
  function avatar() { return '<div class="avatar">' + REPORTER_ART + '</div>'; }

  // ================= 반응(추천·반대·댓글) =================
  function getVote(id) { return store.get('vote:' + id, ''); }
  function getMyComments(id) { return store.get('comments:' + id, []); }
  function getCReact(id) { return store.get('creact:' + id, {}); }   // { 댓글아이디: 'up' | 'down' }
  function toTs(s) {
    var m = String(s).match(/(\d{4})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2})/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]).getTime() : 0;
  }
  // 데이터에 들어 있는 댓글 + 이 브라우저에서 단 댓글
  function allComments(a) {
    var id = a['아이디'], react = getCReact(id);
    var seed = (a['댓글'] || []).map(function (c, i) {
      return { id: 's' + i, nick: c['닉네임'], text: c['내용'], time: c['시각'], ts: toTs(c['시각']), up: c['추천'] || 0, down: c['반대'] || 0, mine: false };
    });
    var mine = getMyComments(id).map(function (c) {
      return { id: c.id, nick: c.anon ? '익명' : c.nick, anon: c.anon, text: c.text, time: c.time, ts: c.ts, up: 0, down: 0, mine: true };
    });
    return seed.concat(mine).map(function (c) {
      c.react = react[c.id] || '';
      if (c.react === 'up') c.up++;
      if (c.react === 'down') c.down++;
      return c;
    });
  }
  function counts(a) {
    var id = a['아이디'], base = a['반응'] || {}, v = getVote(id);
    return {
      up: (base['추천'] || 0) + (v === 'up' ? 1 : 0),
      down: (base['반대'] || 0) + (v === 'down' ? 1 : 0),
      vote: v,
      comments: (a['댓글'] || []).length + getMyComments(id).length
    };
  }
  // 시작 화면에서 입력한 학생 정보 { 학번이름, 닉네임 } — 지금은 이 브라우저에만 저장
  function profile() { return store.get('profile', null); }
  function myNick() { var p = profile(); return p ? p['닉네임'] : ''; }
  function anonUsed() { return store.get('anonUsed', false); }

  // ================= 이미지 렌더러 =================
  var RENDER_IMAGE = {
    // 교사가 만든 이미지 파일을 그대로 보여줌. "자료"에 data URI(tools/embed_image.py로 넣음) 또는 파일 경로
    '사진': function (img) {
      return '<img class="photo-img" src="' + esc(img['자료'] || '') + '" alt="' + esc(img['대체 글'] || img['설명'] || '') + '">';
    },
    // 티저·포스터 이미지 대용: 어두운 바탕에 큰 글자만 (가상 작품)
    '포스터': function (img) {
      return '<div class="poster" role="img" aria-label="' + esc(img['설명'] || '') + '"><b>' + esc(img['문구'] || '') + '</b><span>' + esc(img['부문구'] || '') + '</span></div>';
    },
    // 예능 방송 화면: 교실 배경 + 두 사람 실루엣 + 노란 자막
    '방송 캡처': function (img) {
      return '' +
        '<div class="tvcap" role="img" aria-label="' + esc(img['프로그램'] || '') + ' 방송 화면 캡처">' +
          '<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
            '<rect x="0" y="0" width="160" height="30" fill="#2f4b3a"/>' +
            '<rect x="2" y="2" width="156" height="26" fill="#3d5f49"/>' +
            '<path d="M10 10h22M12 16h30M40 9l6 6" stroke="#e8efe9" stroke-width=".7" opacity=".55" fill="none"/>' +
            '<rect x="0" y="62" width="160" height="28" fill="#a86f49"/>' +
            '<rect x="12" y="58" width="34" height="5" fill="#8a5a3b"/><rect x="112" y="58" width="36" height="5" fill="#8a5a3b"/>' +
            '<g fill="#2b2f3a" opacity=".88">' +
              '<circle cx="58" cy="40" r="10"/><path d="M38 90c1-17 9-26 20-26s19 9 20 26z"/>' +
              '<circle cx="102" cy="42" r="9.5"/><path d="M83 90c1-16 9-24 19-24s18 8 19 24z"/>' +
            '</g>' +
          '</svg>' +
          '<span class="tv-logo">' + esc(img['프로그램'] || '') + '</span>' +
          '<div class="tv-sub">' + esc(img['자막'] || '') + '</div>' +
        '</div>';
    },
    '스토리 캡처': function (img) {
      function bubble(t) {
        return '<span class="bubble">' + esc(t).replace(/(@\S+)/g, '<span class="mention">$1</span>') + '</span>';
      }
      var chat = (img['대화'] || []).map(function (turn) {
        var lines = turn['말'].map(bubble).join('');
        if (turn['보낸 사람'] === '나') return '<div class="me">' + lines + '</div>';
        return '<div class="msg-group"><span class="pf">' + ICON.person + '</span><div class="col"><span class="nm">' +
          esc(turn['보낸 사람']) + '</span>' + lines + '</div></div>';
      }).join('');
      var tags = (img['태그'] || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
      return '' +
        '<div class="story" role="img" aria-label="SNS 스토리에 올라온 단체 대화방 캡처">' +
          '<div class="bars"><i class="done"></i><i class="done"></i><i></i></div>' +
          '<div class="who"><span class="pic blur"></span><span class="blur">example_user_01</span></div>' +
          '<div class="caption">' + esc(img['스토리 글']) + '</div>' +
          '<div class="chat">' +
            '<div class="bar"><span class="back">‹</span><span class="blur">예고 동창방 ♥</span><span class="count">' + esc(img['대화방 인원']) + '</span></div>' +
            '<div class="msgs">' + chat + '</div>' +
          '</div>' +
          '<div class="tags">' + tags + '</div>' +
          '<div class="reply">메시지 보내기</div>' +
        '</div>';
    }
  };

  function crumbHTML(parts) {
    var html = '<div class="crumb"><svg width="13" height="13" viewBox="0 0 24 24" fill="#555" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg><a href="#list">홈</a>';

  // ================= 화면: 기사 보기 =================

          '<li><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><a href="' + rLink + '">' + esc(byline(r)) + '</a></li>' +
          '<li><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>입력 ' + esc(a['시각']) + '</li>' +
          '<li><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg><a href="#comments">댓글 <span data-ccount>0</span></a></li>' +

        '</div>' +
      '</div>' +
      '<div class="layout">' +
        '<aside class="side-left">' +
          '<a class="reporter-card" href="' + rLink + '">' + avatar() +
            '<div class="rname">' + esc(byline(r)) + '</div>' +
            '<div class="rdesk">' + (r['부서'] ? val(r['부서']) : '') + '</div>' +
            '<span class="more">다른 기사 보기</span></a>' +
          '<div class="sticky-share">' +
            '<button aria-label="링크 복사" data-copy>' + ICON.link + '</button>' +
            '<button aria-label="공유하기" data-share>' + ICON.share + '</button>' +
            '<button aria-label="이메일로 보내기" data-share>' + ICON.mail + '</button>' +

        '</aside>' +
        '<article>' +

          figure +

          (b['키워드'] && b['키워드'].length ? '<div class="keywords"><strong>키워드</strong>' + b['키워드'].map(function (k) { return '<span>#' + esc(k) + '</span>'; }).join('') + '</div>' : '') +
          '<div class="byline-box"><div class="who">' + avatar() + '<b>' + esc(byline(r)) + '</b></div><a class="link" href="' + rLink + '">다른 기사 보기</a></div>' +
          moreBox +
          '<section class="comments" id="comments">' +
            '<div class="c-head"><h4><b data-ccount>0</b> 개의 댓글</h4>' +
              '<div class="sort"><a class="who-link" href="#users">작성자별 보기</a><button data-sort="new">최신순</button><button data-sort="best">추천순</button></div></div>' +
            '<form class="cbox" id="cmtForm">' +
              '<div class="c-top" id="cmtTop"></div>' +
              '<textarea id="cmtText" maxlength="400" placeholder="댓글을 입력하세요. 다른 사람을 비방하는 댓글은 삭제될 수 있습니다."></textarea>' +
              '<div class="foot"><span><b id="cmtLen">0</b> / 400</span><button type="submit">등록</button></div>' +

  // 댓글 입력칸 윗줄: 닉네임(한 번 정하면 고정) + 익명(사이트 전체 1회)
  function renderCommentTop() {
    var top = document.getElementById('cmtTop');
    if (!top) return;
    // 닉네임은 시작 화면에서 정하므로 여기서는 보여주기만 하고, 고르는 것은 익명 여부뿐
    var left = '<span class="nick-fixed">' + (myNick() ? '<b>' + esc(myNick()) + '</b>(으)로 작성' : '') + '</span>';
    var right = anonUsed()
      ? '<span class="anon used" title="익명 댓글은 이미 사용했습니다">익명 사용 완료</span>'
      : '<label class="anon" for="cmtAnon"><input type="checkbox" id="cmtAnon">익명으로 작성<small>(1회)</small></label>';
    top.innerHTML = left + right;
  }

  function refreshReactions() {
    if (!current) return;
    var a = articleById[current], c = counts(a);
    document.querySelectorAll('[data-up]').forEach(function (n) { n.textContent = c.up; });
    document.querySelectorAll('[data-down]').forEach(function (n) { n.textContent = c.down; });
    document.querySelectorAll('[data-ccount]').forEach(function (n) { n.textContent = c.comments; });
    document.querySelectorAll('[data-vote]').forEach(function (btn) {
      var on = btn.getAttribute('data-vote') === c.vote;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    document.querySelectorAll('[data-sort]').forEach(function (btn) {
      btn.classList.toggle('on', btn.getAttribute('data-sort') === sortMode);
    });

    var all = allComments(a);
    // BEST: 추천 50 이상 중 추천이 많은 순으로 최대 3개 → 정렬과 상관없이 맨 위에 고정
    var best = all.filter(function (cm) { return cm.up >= 50; })
      .sort(function (x, y) { return y.up - x.up || y.ts - x.ts; }).slice(0, 3);
    var bestIds = best.map(function (cm) { return cm.id; });
    var rest = all.filter(function (cm) { return bestIds.indexOf(cm.id) < 0; });
    if (sortMode === 'best') rest.sort(function (x, y) { return (y.up - y.down) - (x.up - x.down) || (y.ts - x.ts); });
    else rest.sort(function (x, y) { return y.ts - x.ts; });
    var ordered = best.concat(rest);
    var list = ordered.slice(0, shownCount);
    var left = ordered.length - list.length;

    var ul = document.getElementById('cmtList');
    if (!ul) return;
    ul.innerHTML = (list.length ? list.map(function (cm) {
      var id = esc(cm.id);
      var isBest = bestIds.indexOf(cm.id) > -1;
      return '<li class="citem' + (isBest ? ' is-best' : '') + '">' +
        '<div class="c-meta">' + (isBest ? '<span class="best">BEST</span>' : '') +
          nickHTML(cm) + (cm.mine ? '<span class="me-tag">내 댓글</span>' : '') +
          '<span>' + esc(cm.time) + '</span></div>' +
        '<p>' + esc(cm.text) + '</p>' +
        '<div class="c-act">' +
          '<button data-creact="up" data-cid="' + id + '" class="' + (cm.react === 'up' ? 'on' : '') + '" aria-pressed="' + (cm.react === 'up') + '" aria-label="댓글 추천">' + ICON.up + cm.up + '</button>' +
          '<button data-creact="down" data-cid="' + id + '" class="down ' + (cm.react === 'down' ? 'on' : '') + '" aria-pressed="' + (cm.react === 'down') + '" aria-label="댓글 반대">' + ICON.down + cm.down + '</button>' +
          (cm.mine ? '<button class="del" data-cdel="' + id + '">삭제</button>' : '') +
        '</div></li>';
    }).join('') : '<li class="cempty">아직 댓글이 없습니다. 첫 댓글을 남겨 보세요.</li>') +
      (left > 0 ? '<li class="cmore"><button type="button" data-more>댓글 더보기 <b>' + left + '</b></button></li>' : '');
  }

  // ================= 댓글 작성자(닉네임)별 모아보기 =================
  // 데이터 댓글 + 이 브라우저에서 단 댓글을 닉네임으로 묶는다. 익명 댓글은 추적하지 않는다.
  function nickHTML(cm) {
    if (cm.anon || cm.nick === '익명') return '<b>' + esc(cm.nick) + '</b>';
    return '<a class="nick" href="#user-' + encodeURIComponent(cm.nick) + '"><b>' + esc(cm.nick) + '</b></a>';
  }
  function commentsByNick() {
    var map = {};
    ARTICLES.filter(isCase).forEach(function (a) {
      allComments(a).forEach(function (cm) {
        if (cm.anon || cm.nick === '익명') return;
        var u = map[cm.nick] || (map[cm.nick] = { nick: cm.nick, items: [], up: 0, down: 0, articles: {}, mine: false, last: 0 });
        u.items.push({ a: a, cm: cm });
        u.up += cm.up; u.down += cm.down;
        u.articles[a['아이디']] = true;
        if (cm.mine) u.mine = true;
        if (cm.ts > u.last) u.last = cm.ts;
      });
    });
    return Object.keys(map).map(function (k) {
      var u = map[k]; u.count = u.items.length; u.articleCount = Object.keys(u.articles).length; return u;
    });
  }
  function userCrumb(extra) { return crumbHTML([{ t: '댓글 작성자', href: extra ? '#users' : null }].concat(extra ? [extra] : [])); }

  function renderUsers() {
    current = null;
    document.title = '댓글 작성자 - ' + OUTLET;
    setNav('');
    var users = commentsByNick().sort(function (x, y) { return y.count - x.count || y.up - x.up || x.nick.localeCompare(y.nick, 'ko'); });
    var total = 0; users.forEach(function (u) { total += u.count; });
    document.getElementById('view').innerHTML = '' +
      userCrumb(null) +
      '<div class="layout two" style="padding-top:12px">' +
        '<div>' +
          '<h2 class="list-title">댓글 작성자 <small>' + users.length + '명 · 댓글 ' + total + '개</small></h2>' +
          '<p class="u-note">닉네임을 누르면 그 사람이 어떤 기사에 어떤 댓글을 썼는지 모두 볼 수 있어요. 익명 댓글은 포함되지 않아요.</p>' +
          '<table class="ulist"><thead><tr><th>닉네임</th><th>댓글</th><th>기사</th><th>추천</th><th>반대</th><th>마지막 댓글</th></tr></thead><tbody>' +
          users.map(function (u) {
            return '<tr' + (u.mine ? ' class="is-me"' : '') + '><td>' + nickHTML({ nick: u.nick }) + (u.mine ? '<span class="me-tag">나</span>' : '') + '</td>' +
              '<td>' + u.count + '</td><td>' + u.articleCount + '</td><td class="up">' + u.up + '</td><td class="down">' + u.down + '</td>' +
              '<td class="t">' + esc(u.items.slice().sort(function (p, q) { return q.cm.ts - p.cm.ts; })[0].cm.time) + '</td></tr>';
          }).join('') +
          '</tbody></table>' +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  function renderUser(nick) {
    current = null;
    document.title = nick + '의 댓글 - ' + OUTLET;
    setNav('');
    var u = commentsByNick().filter(function (x) { return x.nick === nick; })[0];
    var body;
    if (!u) {
      body = '<p class="lempty">\'' + esc(nick) + '\' 닉네임으로 쓴 댓글이 없습니다.</p>';
    } else {
      // 기사별로 묶어서 최신 기사부터, 기사 안에서는 쓴 순서대로
      var groups = ARTICLES.filter(isCase).map(function (a) {
        var items = u.items.filter(function (it) { return it.a === a; }).sort(function (p, q) { return p.cm.ts - q.cm.ts; });
        return items.length ? { a: a, items: items } : null;
      }).filter(Boolean);
      body = groups.map(function (g) {
        var a = g.a, href = '#article-' + a['아이디'];
        return '<section class="ugroup">' +
          '<h3><span class="sec">' + esc(a['시각'].slice(0, 10)) + '</span><a href="' + href + '">' + esc(a['본문']['제목']) + '</a><small>댓글 ' + g.items.length + '</small></h3>' +
          '<ul class="clist">' + g.items.map(function (it) {
            var cm = it.cm;
            return '<li class="citem' + (cm.up >= 50 ? ' is-best' : '') + '">' +
              '<div class="c-meta">' + (cm.up >= 50 ? '<span class="best">BEST</span>' : '') + '<b>' + esc(cm.nick) + '</b>' + (cm.mine ? '<span class="me-tag">내 댓글</span>' : '') + '<span>' + esc(cm.time) + '</span></div>' +
              '<p>' + esc(cm.text) + '</p>' +
              '<div class="c-act"><span class="c-num">' + ICON.up + cm.up + '</span><span class="c-num down">' + ICON.down + cm.down + '</span>' +
              '<a class="c-go" href="' + href + '">기사에서 보기</a></div></li>';
          }).join('') + '</ul></section>';
      }).join('');
    }
    document.getElementById('view').innerHTML = '' +
      userCrumb({ t: nick }) +
      '<div class="layout two">' +
        '<div>' +
          '<section class="profile user">' +
            '<div class="avatar u-avatar">' + ICON.person + '</div>' +
            '<div>' +
              '<h1>' + esc(nick) + '<small>' + (u && u.mine ? '나' : '네티즌') + '</small></h1>' +
              '<div class="stats">' +
                '<span>댓글<b>' + (u ? u.count : 0) + '</b></span><span>기사<b>' + (u ? u.articleCount : 0) + '</b></span>' +
                '<span>받은 추천<b>' + (u ? u.up : 0) + '</b></span><span>받은 반대<b>' + (u ? u.down : 0) + '</b></span>' +
              '</div>' +
            '</div>' +
          '</section>' +
          body +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 화면: 기자 프로필 =================
  function renderReporter(rid) {
    var r = reporterById[rid];
    current = null;
    document.title = byline(r) + ' - ' + OUTLET;
    setNav('');
    var mine = ARTICLES.filter(function (a) { return a['게시자']['기자'] === rid; });
    var totalUp = 0, totalCm = 0;
    mine.forEach(function (a) { var c = counts(a); totalUp += c.up; totalCm += c.comments; });

    document.getElementById('view').innerHTML = '' +
      crumbHTML([{ t: '기자' }, { t: byline(r) }]) +
      '<div class="layout two">' +
        '<div>' +
          '<section class="profile">' + avatar() +
            '<div>' +
              '<h1>' + esc(r['이름']) + '<small>' + esc(r['직함'] || '기자') + '</small></h1>' +
              '<dl>' +
                '<dt>부서</dt><dd>' + val(r['부서'] || '[교사 입력]') + '</dd>' +
                '<dt>이메일</dt><dd>' + val(r['이메일'] || '[교사 입력]') + '</dd>' +
                '<dt>소개</dt><dd>' + val(r['소개'] || '[교사 입력]') + '</dd>' +
              '</dl>' +
              '<div class="stats"><span>기사<b>' + mine.length + '</b></span><span>추천<b>' + totalUp + '</b></span><span>댓글<b>' + totalCm + '</b></span></div>' +
            '</div>' +
          '</section>' +
          '<h2 class="list-title">' + esc(byline(r)) + '의 기사 <small>' + mine.length + '건</small></h2>' +
          (mine.length ? '<ul class="alist">' + mine.map(function (a) { return articleItemHTML(a, { thumb: false }); }).join('') + '</ul>' : '<p class="lempty">아직 작성한 기사가 없습니다.</p>') +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 화면: 전체기사 =================
  function renderList() {
    current = null;
    document.title = '전체기사 - ' + OUTLET;
    setNav('list');
    document.getElementById('view').innerHTML = '' +
      crumbHTML([{ t: '전체기사' }]) +
      '<div class="layout two" style="padding-top:12px">' +
        '<div>' +
          '<h2 class="list-title">전체기사 <small>' + ARTICLES.length + '건</small></h2>' +
          '<ul class="alist">' + ARTICLES.map(articleItemHTML).join('') + '</ul>' +
        '</div>' +
        sideHTML() +
      '</div>';
  }

  // ================= 주소(#)에 따라 화면 전환 =================
  function route() {
    var h = location.hash.slice(1), m;
    if (h === 'comments' && current) return;            // 같은 기사 안에서 댓글로 이동
    if (h === 'reset') { renderList(); resetAll(); return; }
    if ((m = h.match(/^reporter-(.+)$/)) && reporterById[m[1]]) renderReporter(m[1]);
    else if (h === 'users') renderUsers();
    else if ((m = h.match(/^user-(.+)$/))) { var nk; try { nk = decodeURIComponent(m[1]); } catch (err) { nk = m[1]; } renderUser(nk); }
    else if (h === 'list') renderList();
    else if ((m = h.match(/^article-(.+)$/)) && articleById[m[1]] && !isCase(articleById[m[1]])) { if (!current) renderList(); lockedNotice(); return; }
    else if ((m = h.match(/^article-(.+)$/)) && articleById[m[1]]) renderArticle(m[1]);
    else renderArticle(ARTICLES[0]['아이디']);
    window.scrollTo(0, 0);
  }

  // ================= 클릭·입력 처리 =================
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1600);
  }

  var fontSize = 18;
  var armedDelete = null, armTimer;

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;

    var ah = t.getAttribute && t.getAttribute('href'), am = ah && ah.match(/^#article-(.+)$/);
    if (am && articleById[am[1]] && !isCase(articleById[am[1]])) { e.preventDefault(); lockedNotice(); return; }
    if (t.hasAttribute('data-closed')) { e.preventDefault(); toast('수업용 페이지에서는 열리지 않는 메뉴입니다.'); return; }
    if (t.hasAttribute('data-toast')) { e.preventDefault(); toast(t.getAttribute('data-toast')); return; }
    if (t.hasAttribute('data-share')) { toast('수업용 페이지에서는 공유 기능이 동작하지 않습니다.'); return; }

    if (t.hasAttribute('data-copy')) {
      var url = location.href;
      try {
        navigator.clipboard.writeText(url).then(function () { toast('기사 주소가 복사되었습니다.'); },
          function () { toast('이 화면에서는 주소를 복사할 수 없습니다.'); });
      } catch (err) { toast('이 화면에서는 주소를 복사할 수 없습니다.'); }
      return;
    }

    if (t.hasAttribute('data-font')) {
      fontSize = Math.min(26, Math.max(14, fontSize + Number(t.getAttribute('data-font')) * 2));
      document.documentElement.style.setProperty('--body-size', fontSize + 'px');
      return;
    }

    if (t.hasAttribute('data-vote') && current) {
      var kind = t.getAttribute('data-vote');
      var prev = getVote(current);
      var next = prev === kind ? '' : kind;
      store.set('vote:' + current, next);
      toast(next ? (kind === 'up' ? '이 기사를 추천했습니다.' : '이 기사에 반대했습니다.') : (kind === 'up' ? '추천을 취소했습니다.' : '반대를 취소했습니다.'));
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-sort')) {
      sortMode = t.getAttribute('data-sort');
      shownCount = PAGE;
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-more')) {
      shownCount += PAGE;
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-creact') && current) {
      var cid = t.getAttribute('data-cid'), ck = t.getAttribute('data-creact');
      if (cid.charAt(0) === 'c') { toast('내 댓글에는 추천·반대를 할 수 없습니다.'); return; }
      var react = getCReact(current);
      if (react[cid] === ck) delete react[cid]; else react[cid] = ck;   // 같은 버튼 다시 누르면 취소
      store.set('creact:' + current, react);
      refreshReactions();
      return;
    }

    if (t.hasAttribute('data-cdel') && current) {
      var did = t.getAttribute('data-cdel');
      // 한 번 누르면 "삭제 확인"으로 바뀌고, 다시 누르면 삭제
      if (armedDelete !== did) {
        armedDelete = did;
        t.classList.add('arm');
        t.textContent = '삭제 확인';
        clearTimeout(armTimer);
        armTimer = setTimeout(function () { armedDelete = null; refreshReactions(); }, 3000);
        return;
      }
      armedDelete = null;
      clearTimeout(armTimer);
      store.set('comments:' + current, getMyComments(current).filter(function (cm) { return cm.id !== did; }));
      toast('댓글을 삭제했습니다.');
      refreshReactions();
      return;
    }
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'cmtForm' || !current) return;
    e.preventDefault();
    var textEl = document.getElementById('cmtText');
    var text = textEl.value.trim();
    if (!text) { toast('댓글 내용을 입력해 주세요.'); textEl.focus(); return; }

    var anonEl = document.getElementById('cmtAnon');
    if (anonEl && anonEl.checked) {
      openModal({
        title: '익명 댓글은 한 번만 쓸 수 있어요',
        body: '익명 댓글은 <b>모든 기사를 통틀어 1회</b>만 작성할 수 있습니다. 등록한 뒤에는 다시 익명으로 쓸 수 없고, 댓글을 지워도 기회는 돌아오지 않습니다.<br>동의하고 등록할까요?',
        ok: '동의하고 등록',
        onOk: function () { store.set('anonUsed', true); postComment(text, true); renderCommentTop(); }
      });
      return;
    }
    if (!myNick()) { showGate(); return; }
    postComment(text, false);
  });

  function postComment(text, anon) {
    var list = getMyComments(current);
    list.push({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nick: anon ? '' : myNick(), anon: anon, text: text, time: now(), ts: Date.now() });
    store.set('comments:' + current, list);
    document.getElementById('cmtText').value = '';
    document.getElementById('cmtLen').textContent = '0';
    sortMode = 'new';
    toast(anon ? '익명 댓글을 등록했습니다.' : '댓글을 등록했습니다.');
    refreshReactions();
  }

  // ---------- 확인 팝업 (브라우저 기본 confirm 대신 화면 안에 띄움) ----------
  var modalBg = null, modalOk = null, lastFocus = null;
  function openModal(o) {
    closeModal();
    lastFocus = document.activeElement;
    modalBg = document.createElement('div');
    modalBg.className = 'modal-bg';
    modalBg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">' +
      '<div class="m-body"><h5 id="mTitle">' + esc(o.title) + '</h5><p>' + o.body + '</p></div>' +
      '<div class="m-btns">' + (o.single ? '' : '<button type="button" data-m="cancel">' + esc(o.cancel || '취소') + '</button>') +
      '<button type="button" class="ok" data-m="ok">' + esc(o.ok || '확인') + '</button></div></div>';
    document.body.appendChild(modalBg);
    modalOk = o.onOk;
    modalBg.querySelector('[data-m="ok"]').focus();
  }
  function lockedNotice() {
    openModal({ title: '안내', body: '사건과 관련된 기사만 조회할 수 있습니다.', ok: '확인', single: true });
  }
  function closeModal() {
    if (!modalBg) return;
    modalBg.remove();
    modalBg = null; modalOk = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('click', function (e) {
    if (!modalBg) return;
    var b = e.target.closest('[data-m]');
    if (b) {
      var fn = b.getAttribute('data-m') === 'ok' ? modalOk : null;
      closeModal();
      if (fn) fn();
    } else if (e.target === modalBg) {
      closeModal();
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'cmtText') document.getElementById('cmtLen').textContent = e.target.value.length;
  });

  // ================= 시작 화면 (학번이름·닉네임) =================
  // 게임에 합칠 때 이 화면이 게임 첫 화면 역할을 함. 닉네임 = 실명 글에 쓰이는 이름.
  var gateEl = null;
  function showGate() {
    if (gateEl) return;
    gateEl = document.createElement('div');
    gateEl.className = 'gate';
    gateEl.innerHTML = '' +
      '<form id="gateForm" autocomplete="off">' +
        '<div><div class="g-kicker">학습 게임 시작</div><h2>내 정보를 입력하세요</h2></div>' +
        '<label for="gateId">학번이름<input id="gateId" maxlength="12" placeholder="예: 1401강기범">' +
          '<span class="g-hint">학번 네 자리 뒤에 이름을 붙여 써요. 띄어쓰기 없이.</span></label>' +
        '<label for="gateNick">닉네임<input id="gateNick" maxlength="10" placeholder="2~10자">' +
          '<span class="g-hint">댓글에 보이는 이름이에요. 시작하면 바꿀 수 없어요.</span></label>' +
        '<button type="submit">시작하기</button>' +
        '<p class="g-note">학번과 이름은 화면에 보이지 않아요.</p>' +
      '</form>';
    document.body.appendChild(gateEl);
    document.getElementById('gateId').focus();
  }
  function hideGate() { if (gateEl) { gateEl.remove(); gateEl = null; } }

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'gateForm') return;
    e.preventDefault();
    var idEl = document.getElementById('gateId'), nickEl = document.getElementById('gateNick');
    // 실제 로그인창처럼 "1401강기범" 한 칸. 띄어쓰기는 지우고, 학번 4~5자리 + 이름 2~5자만 받는다
    var sid = idEl.value.replace(/\s+/g, '');
    var nick = nickEl.value.trim();
    if (!/^\d{4,5}[가-힣]{2,5}$/.test(sid)) { toast('1401강기범 처럼 학번 뒤에 이름을 붙여 입력해 주세요.'); idEl.focus(); return; }
    if (nick.length < 2) { toast('닉네임은 2~10자로 입력해 주세요.'); nickEl.focus(); return; }
    if (nick === '익명') { toast('\'익명\'은 닉네임으로 쓸 수 없어요.'); nickEl.focus(); return; }
    openModal({
      title: '이대로 시작할까요?',
      body: esc(sid) + '<br>닉네임 <b>' + esc(nick) + '</b><br>시작하면 닉네임은 바꿀 수 없어요.',
      ok: '시작하기',
      cancel: '다시 쓰기',
      onOk: function () {
        store.set('profile', { '학번이름': sid, '닉네임': nick });
        hideGate();
        renderCommentTop();
        toast(nick + '님, 시작합니다.');
      }
    });
  });

  // 교사 테스트용: 주소 끝에 #reset 을 붙여 열면 이 브라우저 기록을 지우고 처음 화면으로
  function resetAll() {
    openModal({
      title: '이 브라우저의 기록을 지울까요?',
      body: '학생 정보, 내가 쓴 댓글, 추천·반대 기록이 모두 지워지고 시작 화면으로 돌아갑니다.',
      ok: '모두 지우기',
      onOk: function () {
        try {
          Object.keys(localStorage).forEach(function (k) { if (k.indexOf(NS) === 0) localStorage.removeItem(k); });
        } catch (err) {}
        Object.keys(mem).forEach(function (k) { delete mem[k]; });
        location.hash = 'list';
        showGate();
        toast('기록을 지웠습니다.');
      }
    });
  }

  // ================= 시작 =================
  document.getElementById('updated').textContent = 'UPDATED. ' + DATA['매체']['업데이트'];
  document.querySelectorAll('[data-outlet]').forEach(function (n) { n.textContent = OUTLET; });
  window.addEventListener('hashchange', route);
  route();
  if (!profile() && location.hash !== '#reset') showGate();
})();
</script>
</body>
</html>
