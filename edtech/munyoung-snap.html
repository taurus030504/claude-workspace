<title>문영스냅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&family=Nanum+Pen+Script&display=swap">
<!--
  수업용 가상 사진 SNS "문영스냅" (사진 SNS 템플릿: 피드 · 여러 장 넘기기 · 스토리 · 프로필 · 탐색 · 알림)
  ▣ 계정, 게시물, 스토리, 가상 반응 대본은 모두 아래 <script type="application/json" id="snap-data"> 한 곳에서 고칩니다.
    - posts[].t / stories[].t : "YYYY-MM-DD HH:MM". 현재 시점(턴)보다 늦은 게시물·댓글은 보이지 않습니다.
    - 스토리는 올린 뒤 site.storyHours(24)시간 동안만 보입니다.
    - "{{교사 입력:설명}}" 은 화면에 노란 표시로 나옵니다. 문안을 넣으면 사라집니다.
    - 이미지 칸에 "src": "data:image/..." 를 넣으면 기본 그림 대신 교사가 만든 그림이 나옵니다.
    - "data" 칸(자료 번호·초안 표시)은 교사 도구에서 '자료 번호 표시'를 켰을 때만 보입니다.
  ▣ 턴·교사 학번은 문영일보·문영위키와 같습니다(1턴 2026-02-04 12:00 / 2턴 03-06 12:00 / 3턴 03-08 20:00, 교사 학번 1444).
  ▣ 학생 기록(댓글·좋아요·검색·스토리 열람 등)은 지금은 이 브라우저에만 저장됩니다. 교사 도구 > 기록 복사로 꺼낼 수 있습니다.
-->
<style>
/* 레이아웃: 왼쪽 세로 메뉴 + 가운데 470px 피드 + 오른쪽 추천 열. 휴대폰은 위·아래 막대. 사진 SNS 문법을 따르되 색은 '플래시' 주황 하나만 쓴다 */
:root{
  --bg:#ffffff; --surface:#ffffff; --raise:#f4f4f6; --fg:#16171b; --muted:#6c6f78; --faint:#a3a6ae;
  --line:#e3e4e8; --accent:#ff5a1f; --accent-ink:#ffffff; --like:#ed2f4b; --verify:#3a86f0;
  --ring1:#ffc21a; --ring2:#ff5a1f; --ring3:#e3326c; --seen:#cfd1d6;
  --todo-bg:#fff2b8; --todo-fg:#5c4500; --todo-line:#e0b000;
  --shade:rgba(10,10,14,.62); --card-shadow:0 10px 40px rgba(0,0,0,.18);
  --f-body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-hand:"Nanum Pen Script","Noto Sans KR",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0e11; --surface:#121317; --raise:#1d1f25; --fg:#eef0f3; --muted:#9a9ea8; --faint:#6a6e78;
  --line:#272a31; --accent:#ff7140; --accent-ink:#1a0d06; --like:#ff4d66; --verify:#5b9cff; --seen:#3a3d45;
  --todo-bg:#4a3a06; --todo-fg:#ffe7a0; --todo-line:#a88400; --shade:rgba(0,0,0,.72); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d0e11; --surface:#121317; --raise:#1d1f25; --fg:#eef0f3; --muted:#9a9ea8; --faint:#6a6e78;
  --line:#272a31; --accent:#ff7140; --accent-ink:#1a0d06; --like:#ff4d66; --verify:#5b9cff; --seen:#3a3d45;
  --todo-bg:#4a3a06; --todo-fg:#ffe7a0; --todo-line:#a88400; --shade:rgba(0,0,0,.72); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.fill{fill:currentColor}
.todo{background:var(--todo-bg);color:var(--todo-fg);border:1px dashed var(--todo-line);border-radius:4px;padding:0 4px;font-size:.92em}
.todo::before{content:"교사 입력 · ";font-weight:700}
.vf{display:inline-block;width:13px;height:13px;margin-left:3px;vertical-align:-2px;color:var(--verify)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── 틀 ── */
.app{display:block;min-height:100%}
.nav{position:fixed;left:0;top:0;bottom:0;width:244px;border-right:1px solid var(--line);background:var(--surface);padding:24px 12px 20px;display:flex;flex-direction:column;gap:4px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:6px 12px 26px;font-family:var(--f-display);font-size:24px;letter-spacing:-.01em}
.logo .mk{width:30px;height:30px;flex-shrink:0}
.nav-i{display:flex;align-items:center;gap:16px;padding:12px;border-radius:10px;font-size:15.5px;position:relative;text-align:left;width:100%}
.nav-i:hover{background:var(--raise)}
.nav-i.on{font-weight:700}
.nav-i.on svg.i{stroke-width:2.6}
.nav-i .av{width:26px;height:26px}
.nav-sp{flex:1}
.badge{position:absolute;left:28px;top:6px;min-width:18px;height:18px;border-radius:9px;background:var(--like);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.main{flex:1;min-width:0;margin-left:244px;display:flex;justify-content:center;gap:56px;padding:0 16px 60px}
.col{width:100%;max-width:630px;min-width:0}
.col.feed{max-width:470px}
.rail{width:320px;flex-shrink:0;padding-top:36px}
.topbar,.botbar{display:none}

/* 현재 시점 띠 */
.turnbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 0 10px}
.turn-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;background:var(--surface)}
.turn-k{font-weight:700;color:var(--accent)}
.turn-t{font-weight:700;font-variant-numeric:tabular-nums}
.turn-d{color:var(--muted);font-size:13px;flex:1;min-width:12em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:9px;font-weight:700;font-size:14px;background:var(--raise);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--accent);font-weight:700}

/* ── 스토리 줄 ── */
.tray{display:flex;gap:14px;overflow-x:auto;padding:10px 2px 14px;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray-i{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;flex-shrink:0}
.tray-i span.h{font-size:12px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.tray-i.seen span.h{color:var(--muted)}

/* 프로필 사진 + 스토리 테 */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;width:32px;height:32px;font-weight:900;font-size:11px;letter-spacing:-.02em;position:relative}
.av>img,.av>svg{width:100%;height:100%;object-fit:cover;display:block}
.ring{display:inline-grid;place-items:center;border-radius:50%;padding:2.5px;background:conic-gradient(from 210deg,var(--ring1),var(--ring2),var(--ring3),var(--ring1));flex-shrink:0}
.ring.seen{background:var(--seen);padding:1.5px}
.ring>.av{border:2.5px solid var(--surface)}
.tray .ring>.av{width:62px;height:62px;font-size:15px}
.tray .noring>.av{width:66px;height:66px}
.noring{display:inline-grid;padding:0}
.add-me{position:absolute;right:-1px;bottom:-1px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:2.5px solid var(--surface);display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1}

/* ── 게시물 ── */
.post{border-bottom:1px solid var(--line);padding:14px 0 18px}
.ph{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
.ph .who{flex:1;min-width:0;line-height:1.25}
.ph .who b{font-weight:700}
.ph .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{color:var(--muted);margin:0 4px}
.datab{display:inline-block;font-size:11px;font-weight:700;color:var(--todo-fg);background:var(--todo-bg);border-radius:4px;padding:1px 6px;margin-left:6px}
.media{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--raise)}
.car{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;user-select:none;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative;overflow:hidden;container-type:inline-size}
.slide>img,.slide>svg{width:100%;height:100%;object-fit:cover;display:block}
.c-nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.88);color:#111;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:3}
.c-nav.p{left:10px}.c-nav.n{right:10px}
.c-nav svg.i{width:16px;height:16px;stroke-width:2.6}
.c-nav[hidden]{display:none}
.c-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:4px;z-index:3;pointer-events:none}
.c-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 2px rgba(0,0,0,.4)}
.c-dots i.on{background:#fff}
.c-count{position:absolute;top:10px;right:10px;z-index:3;background:rgba(20,20,24,.7);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;font-variant-numeric:tabular-nums}
.tagbtn{position:absolute;left:10px;bottom:10px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(20,20,24,.75);color:#fff;display:grid;place-items:center}
.tagbtn svg.i{width:15px;height:15px}
.tagpop{position:absolute;left:10px;bottom:46px;z-index:4;display:flex;flex-direction:column;gap:4px}
.tagpop a{background:rgba(20,20,24,.82);color:#fff;font-weight:700;font-size:13px;padding:5px 10px;border-radius:6px}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.burst svg{width:96px;height:96px;fill:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35));animation:pop .8s ease forwards}
@keyframes pop{0%{transform:scale(0);opacity:0}15%{transform:scale(1.2);opacity:1}30%{transform:scale(.95)}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.acts{display:flex;align-items:center;gap:14px;padding:10px 2px 6px}
.acts .sp{flex:1}
.acts button{display:grid;place-items:center}
.acts button:hover{color:var(--muted)}
.liked{color:var(--like)!important}
.liked svg.i{fill:var(--like);stroke:var(--like);animation:beat .35s ease}
@keyframes beat{50%{transform:scale(1.22)}}
.saved svg.i{fill:currentColor}
.likes{font-weight:700;padding:0 2px 4px;font-variant-numeric:tabular-nums}
.cap{padding:0 2px;word-break:keep-all;overflow-wrap:anywhere}
.cap .txt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--muted)}
.edited{color:var(--muted);font-size:12px}
.mention,.htag{color:var(--verify)}
.mention:hover,.htag:hover{text-decoration:underline}
.vc{color:var(--muted);padding:6px 2px 2px;display:block}
.pv{padding:2px 2px 0;display:flex;flex-direction:column;gap:2px}
.pv .c1{overflow-wrap:anywhere}
.pv .c1 b{margin-right:5px}
.when{display:block;color:var(--muted);font-size:12px;padding:8px 2px 0;font-variant-numeric:tabular-nums}
.when strong{color:var(--fg);font-weight:700}
.ad{color:var(--fg);font-size:12px}
.addc{display:flex;gap:8px;align-items:center;padding:10px 2px 0}
.addc input{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0;font-size:14px}
.addc button{color:var(--accent);font-weight:700}
.addc button:disabled{opacity:.4;cursor:default}
.newsl{display:flex;align-items:center;gap:8px;margin:8px 2px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-weight:700;font-size:13px}
.newsl:hover{background:var(--raise)}

/* ── 이미지 안 카드(카드뉴스·기사·공지) : 글자 크기는 칸 너비(cqw) 기준 ── */
.k{position:absolute;inset:0;display:flex;flex-direction:column;padding:8cqw 7.5cqw;word-break:keep-all}
.k-chemi{background:#1f1d24;color:#f5f1e8}
.k-chemi .k-tag{font-family:var(--f-display);color:#ffd84a;font-size:5.2cqw;letter-spacing:.02em}
.k-chemi h3{font-family:var(--f-display);font-weight:400;font-size:9cqw;line-height:1.18;margin:4cqw 0 0;text-wrap:balance}
.k-chemi p{font-size:4.4cqw;margin:4cqw 0 0;color:#cfc9bb;line-height:1.5}
.k-chemi .k-foot{margin-top:auto;display:flex;justify-content:space-between;font-size:3.6cqw;color:#8f897c}
.k-chemi .k-big{font-size:10.5cqw}
.k-check{list-style:none;margin:6cqw 0 0;padding:0;display:flex;flex-direction:column;gap:3.4cqw;font-size:5.4cqw;font-weight:700}
.k-check li::before{content:"✓";color:#ffd84a;margin-right:2.4cqw}
.k-cap{margin:5cqw 0 0;background:#000;border-radius:2cqw;position:relative;aspect-ratio:16/9;overflow:hidden}
.k-cap svg{position:absolute;inset:0;width:100%;height:100%}
.k-cap .k-subs{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:space-around;font-weight:900;font-size:4.6cqw;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
.k-cap .k-cut{position:absolute;left:0;right:0;top:0;height:9%;background:linear-gradient(#000 40%,transparent)}
.k-quote{margin:5cqw 0 0;font-size:4.6cqw;line-height:1.6;color:#e9e3d6}
.k-adtag{display:inline-block;font-size:3.6cqw;border:1px solid #8f897c;border-radius:1.4cqw;padding:.6cqw 2cqw;color:#cfc9bb;margin-bottom:4cqw;align-self:flex-start}
.k-news{background:linear-gradient(165deg,#2b0f1a,#5a1229 55%,#ed1653);color:#fff}
.k-news .k-kick{font-size:4.4cqw;font-weight:700;background:#fff;color:#ed1653;align-self:flex-start;padding:.8cqw 2.6cqw;border-radius:1.2cqw}
.k-news h3{font-size:7.6cqw;font-weight:900;line-height:1.3;margin:6cqw 0 0;text-wrap:balance}
.k-news .k-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:4cqw;opacity:.9}
.k-news .k-foot b{font-family:var(--f-display);font-weight:400;font-size:6cqw}
.k-teaser{color:#fff;padding:0}
.k-teaser img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85) brightness(.62)}
.k-teaser .k-in{position:relative;display:flex;flex-direction:column;height:100%;padding:8cqw 7cqw}
.k-teaser .k-who{font-size:4cqw;letter-spacing:.32em;font-weight:700}
.k-teaser h3{font-family:var(--f-display);font-weight:400;font-size:13cqw;margin:auto 0 2cqw;line-height:1.05}
.k-teaser .k-kind{font-size:4cqw;opacity:.85}
.k-teaser .k-date{font-size:4.6cqw;font-weight:700;margin-top:4cqw;letter-spacing:.06em}
.k-teaser .k-jl{position:absolute;right:7cqw;top:8cqw;font-family:var(--f-display);font-size:5cqw}
.k-notice{background:#fbfbfa;color:#18202e}
.k-notice .k-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5cqw solid #0f1f45;padding-bottom:2.6cqw}
.k-notice .k-head b{font-family:var(--f-display);font-weight:400;font-size:6.2cqw;color:#0f1f45}
.k-notice .k-head span{font-size:3.4cqw;letter-spacing:.2em;color:#4a5670;font-weight:700}
.k-notice .k-body{font-size:3.75cqw;line-height:1.62;margin-top:3.6cqw;white-space:pre-line}
.k-letter{background:#fffdf6;color:#2a2622;background-image:repeating-linear-gradient(#fffdf6 0 calc(8.2cqw - 1px),#e6dfcf calc(8.2cqw - 1px) 8.2cqw)}
.k-letter .k-body{font-family:var(--f-hand);font-size:6.6cqw;line-height:8.2cqw;white-space:pre-line;margin-top:-1cqw}
.k-letter .k-sign{margin-top:auto;align-self:flex-end;font-family:var(--f-hand);font-size:8cqw}
.k-mine{color:#fff;align-items:center;justify-content:center;text-align:center;font-size:7cqw;font-weight:900;line-height:1.35;white-space:pre-line;text-wrap:balance}

/* ── 모달 ── */
.ov{position:fixed;inset:0;z-index:60;background:var(--shade);display:grid;place-items:center;padding:24px}
.ov[hidden]{display:none}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:70;color:#fff;width:36px;height:36px;display:grid;place-items:center}
.pm{display:grid;grid-template-columns:minmax(0,1fr) 400px;width:min(1100px,100%);max-height:min(92vh,900px);background:var(--surface);border-radius:6px;overflow:hidden}
.pm .media{border:0;border-radius:0;align-self:center;background:#000}
.pm .car{max-height:min(92vh,900px)}
.pm-side{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);max-height:min(92vh,900px)}
.pm-side .ph{padding:14px 16px;border-bottom:1px solid var(--line)}
.pm-list{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px;min-height:120px}
.pm-foot{border-top:1px solid var(--line);padding:6px 16px 12px}
.pm-foot .addc{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cm{display:flex;gap:12px;align-items:flex-start}
.cm .body{flex:1;min-width:0;overflow-wrap:anywhere}
.cm .body b{margin-right:5px}
.cm .meta{display:flex;gap:12px;color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
.cm .meta button{font-weight:700;color:var(--muted)}
.cm .hrt{padding-top:4px;color:var(--muted)}
.cm .hrt svg.i{width:13px;height:13px}
.cm.me .body b::after{content:"나";font-size:10px;font-weight:700;background:var(--raise);color:var(--muted);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
.reps{margin-left:44px;display:flex;flex-direction:column;gap:14px}
.reps-t{color:var(--muted);font-size:12px;font-weight:700;display:flex;align-items:center;gap:12px;margin-left:44px}
.reps-t::before{content:"";width:24px;border-top:1px solid var(--muted)}
.pm-note{font-size:12px;color:var(--muted);background:var(--raise);border-radius:8px;padding:8px 10px}

/* 스토리 보기 */
.sv{position:fixed;inset:0;z-index:80;background:#121214;display:grid;place-items:center}
.sv[hidden]{display:none}
.sv-wrap{display:flex;align-items:center;gap:22px}
.sv-frame{position:relative;height:min(92vh,860px);aspect-ratio:9/16;max-width:100vw;border-radius:10px;overflow:hidden;background:#222;container-type:inline-size;color:#fff}
.sv-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:3px;z-index:6}

<script>
(function () {
'use strict';
var D = JSON.parse(document.getElementById('snap-data').textContent);
var IMG = window.__SNAP_IMG || {};
var RX = D.reactions;
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
var uidN = 0; function uid(p) { return (p || 'u') + (++uidN); }

/* ---------- 저장(이 브라우저에만) ---------- */
var NS = 'munyoung-snap:', mem = {};
var store = {
  get: function (k, f) { if (k in mem) return mem[k]; try { var r = localStorage.getItem(NS + k); if (r != null) { mem[k] = JSON.parse(r); return mem[k]; } } catch (e) {} return f; },
  set: function (k, v) { mem[k] = v; try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} },
  clear: function () { mem = {}; try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(NS) === 0) localStorage.removeItem(k); }); } catch (e) {} }
};
function obj(k) { var v = store.get(k, null); return v && typeof v === 'object' ? v : {}; }

/* ---------- 시간: 시나리오 날짜 그대로, '현재 시점'은 턴 ---------- */
function toTs(s) { var m = String(s || '').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})(?:\D+(\d{1,2}):(\d{2}))?/); return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).getTime() : 0; }
var TURNS = D.site.turns.map(function (t) { return { name: t.name, time: t.time, desc: t.desc, ts: toTs(t.time) }; });
function turnIdx() { return Math.max(0, Math.min(TURNS.length - 1, store.get('turn', 0) | 0)); }
function turnTs() { return TURNS[turnIdx()].ts; }

/* ---------- 전체 그리기 ---------- */

    case 'datatoggle': store.set('showData', !showData()); render(); teacherBox(); break;
    case 'copylog': var data = JSON.stringify({ profile: me(), log: store.get('log', []), comments: obj('cmts'), posts: myPosts() }, null, 1); try { navigator.clipboard.writeText(data).then(function () { toast('기록을 복사했어요.'); }, function () { toast('복사가 막혀 있어요.'); }); } catch (e) { toast('복사가 막혀 있어요.'); } break;
    case 'wipe': confirmBox('기록을 모두 지울까요?', '이 브라우저의 학생 정보, 댓글, 좋아요, 시점이 지워지고 시작 화면으로 돌아갑니다.', '지우기', function () { store.clear(); teacherOK = false; stack = []; view = { name: 'home' }; closePost(); render(); openGate(); }); break;
    case 'sw': $$('.sws button').forEach(function (b) { b.classList.toggle('on', b === t); }); $('#boxOv')._bg = t.getAttribute('data-c'); updPrev(); break;
  }
});
document.addEventListener('click', function (ev) { var m = $('.menu'); if (m && !ev.target.closest('.menu')) m.remove(); }, true);
function toggleLike(id, only) {
  var L = obj('likes'); if (only && L[id]) return; L[id] = !L[id]; if (!L[id]) delete L[id]; store.set('likes', L); log(L[id] ? 'like' : 'unlike', { post: id }); refreshPost(id);
}
function updPrev() { var o = $('#boxOv'), tx = ($('#cText') || {}).value || '여기에 쓴 글이 보여요'; $('#cPrev').innerHTML = '<div class="k k-mine" style="background:' + esc(o._bg) + '">' + esc(tx) + '</div>'; }
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.closest && t.closest('.addc')) { $('button', t.closest('.addc')).disabled = !t.value.trim(); if (replyTo && t.id === 'pmc' && t.value.indexOf('@' + replyTo.u) !== 0) { replyTo = null; t.placeholder = '댓글 달기...'; } }
  if (t.id === 'sq') { $('#sres').innerHTML = searchResults(t.value); clearTimeout(t._lt); var q = t.value; t._lt = setTimeout(function () { if (q.trim()) log('search', { query: q.trim() }); }, 900); }
  if (t.id === 'cText') updPrev();
});
document.addEventListener('focusin', function (ev) { if (ev.target.id === 'exq') { ev.target.blur(); go('search', ''); } });
document.addEventListener('submit', function (ev) {
  ev.preventDefault(); var f = ev.target;
  if (f.classList.contains('addc')) { var inp = $('input', f), pid = f.getAttribute('data-id'); if (submitComment(pid, inp.value, f.hasAttribute('data-modal'))) { inp.value = ''; $('button', f).disabled = true; refreshPost(pid); if (openPostId === pid) renderPostModal(); toast('댓글을 게시했어요.'); } return; }
  if (f.id === 'gateF') {
    var sid = $('#gId').value.replace(/\s+/g, ''), nick = $('#gNick').value.trim().toLowerCase(), err = $('#gErr');
    if (!/^\d{4,5}[가-힣]{2,5}$/.test(sid)) { err.textContent = '1401강기범처럼 학번 뒤에 이름을 붙여 입력해 주세요.'; $('#gId').focus(); return; }
    if (!/^[a-z0-9._]{3,20}$/.test(nick)) { err.textContent = '사용자 이름은 영어 소문자, 숫자, _ . 로 3~20자예요.'; $('#gNick').focus(); return; }
    if (D.accounts[nick]) { err.textContent = '이미 있는 계정 이름이에요. 다른 이름을 골라 주세요.'; return; }
    store.set('profile', { sid: sid, handle: nick }); log('start', { handle: nick });
    if ((D.site.teacherCode || []).indexOf(sid.replace(/\D/g, '')) > -1) teacherOK = true;
    closeBox(); render(); toast(nick + '님, 환영해요.'); return;
  }
  if (f.id === 'tF') { var code = $('#tCode').value.trim(); if ((D.site.teacherCode || []).indexOf(code) < 0) { $('#tErr').textContent = '교사 학번이 아닙니다.'; return; } teacherOK = true; teacherBox(); return; }
  if (f.id === 'cF') {
    var ct = $('#cText').value.trim(), cap = $('#cCap').value.trim();
    if (!ct) { $('#cErr').textContent = '카드 글을 한 줄 이상 써 주세요.'; return; }
    if (judge(ct + ' ' + cap) === '차단') { $('#cErr').textContent = '커뮤니티 가이드라인에 맞지 않는 표현이 있어요.'; log('blocked', { text: ct + ' ' + cap }); return; }
    var ps = myPosts(), np = { id: 'my' + Date.now().toString(36), ts: clock(), at: Date.now(), media: [{ mine: ct, bg: $('#boxOv')._bg }], cap: cap, rx: planRx(ct + ' ' + cap, true), comments: [] };
    ps.unshift(np); store.set('myPosts', ps); log('post', { post: np.id, text: ct, caption: cap, judged: np.rx.v });
    closeBox(); stack = []; view = { name: 'home' }; render(); toast('게시물을 공유했어요.');
  }
});
document.addEventListener('dblclick', function (ev) {
  var car = ev.target.closest('.car'); if (!car || ev.target.closest('button')) return;
  toggleLike(car.dataset.car, true);
  var c2 = $$('.car[data-car="' + car.dataset.car + '"]'); c2.forEach(function (c) { var b = document.createElement('div'); b.className = 'burst'; b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-8-4.6-8-10.6A4.6 4.6 0 0 1 12 7.4a4.6 4.6 0 0 1 8 2.5c0 6-8 10.6-8 10.6z"/></svg>'; c.appendChild(b); setTimeout(function () { b.remove(); }, 850); });
});
/* 손가락으로 넘기기 */
var sw0 = null, svDown = 0;
document.addEventListener('pointerdown', function (ev) {
  var car = ev.target.closest('.car'); if (car && +car.dataset.n > 1 && !ev.target.closest('button')) sw0 = { car: car, x: ev.clientX, y: ev.clientY };
  if (ev.target.closest('.sv-frame')) { svDown = Date.now(); if (!ev.target.closest('a,.sv-foot,[data-act="svpause"]')) svPause(true); }
});
document.addEventListener('pointerup', function (ev) {
  if (sw0) { var dx = ev.clientX - sw0.x; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(ev.clientY - sw0.y)) carGo(sw0.car, +sw0.car.dataset.i + (dx < 0 ? 1 : -1)); sw0 = null; }
  if (SV && SV.paused && ev.target.closest('.sv-frame') && !ev.target.closest('[data-act="svpause"]')) svPause(false);
});
document.addEventListener('keydown', function (ev) {
  if (SV && !$('#sv').hidden) { if (ev.key === 'Escape') svClose(); if (ev.key === 'ArrowRight') svStep(1); if (ev.key === 'ArrowLeft') svStep(-1); return; }
  if (ev.key === 'Escape') { if (!$('#boxOv').hidden && me()) closeBox(); else if (openPostId) closePost(); }
  if (openPostId && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { var car = $('#postOv .car'); if (car) carGo(car, +car.dataset.i + (ev.key === 'ArrowRight' ? 1 : -1)); }
});
$('#postOv').addEventListener('click', function (ev) { if (ev.target === this) closePost(); });
$('#boxOv').addEventListener('click', function (ev) { if (ev.target === this && me()) closeBox(); });

/* 반응 도착 확인: 새로 도착한 것이 있으면 해당 부분만 다시 그림 */
var lastN = -1;
setInterval(function () {
  var all = notifs(), n = all.length;
  if (lastN >= 0 && n > lastN) {
    var fresh = all.slice(0, n - lastN); renderNav();
    var e = fresh[0].e; toast(e.type === 'like' ? e.by + '님 외 여러 명이 좋아합니다.' : e.by + '님이 답글을 남겼습니다.');
    fresh.forEach(function (x) { refreshPost(x.pid); });
    if (view.name === 'notifs') render();
  }
  lastN = n;
}, 2000);

/* 시작 */
if (location.hash === '#reset') { history.replaceState(null, '', location.pathname + location.search); confirmBox('이 브라우저 기록을 지울까요?', '학생 정보, 댓글, 좋아요, 시점이 모두 지워집니다.', '지우기', function () { store.clear(); render(); openGate(); }); }
render();
requestAnimationFrame(svTick);
if (!me() && location.hash !== '#reset') openGate();
})();
</script>
