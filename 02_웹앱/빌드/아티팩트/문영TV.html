<title>문영TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Nanum+Brush+Script&family=Nanum+Pen+Script&display=swap" />
<style>
  /* 수업용 가상 영상 플랫폼. 소리는 없고, 가사·대본이 시간에 맞춰 넘어간다. */
  :root{--bg:#0f0f0f;--panel:#181818;--line:#2a2a2a;--text:#f1f1f1;--muted:#aaa;--accent:#e8402f;--chip:#272727}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Pretendard JP","Noto Sans KR","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
  .logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:21px;letter-spacing:-.03em}
  .logo i{display:inline-grid;place-items:center;width:30px;height:21px;border-radius:6px;background:var(--accent)}
  .logo i::after{content:"";border-left:9px solid #fff;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;margin-left:2px}
  .search{margin-left:auto;display:flex;width:min(420px,46vw);height:38px;border:1px solid #303030;border-radius:20px;overflow:hidden;background:#121212}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);padding:0 16px;font:inherit;outline:0}
  .search button{border:0;background:#222;color:#ddd;width:56px;cursor:pointer}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}

  /* 목록 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 16px}
  .card{cursor:pointer}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#222}
  .thumb svg,.thumb img{width:100%;height:100%;display:block}
  .thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);font-size:12px;font-weight:700;padding:2px 5px;border-radius:4px}
  .card h3{margin:10px 0 2px;font-size:15px;font-weight:600;line-height:1.35}
  .card p{margin:0;color:var(--muted);font-size:13px}
  .list-h{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .list-h button{border:0;background:var(--chip);color:#eee;font:inherit;font-size:13.5px;padding:6px 12px;border-radius:8px;cursor:pointer}
  .list-h button.on{background:#f1f1f1;color:#0f0f0f}

  /* 재생 화면 */
  .player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;user-select:none}
  .player .bgart{position:absolute;inset:-40px;filter:blur(26px) brightness(.55);transform:scale(1.15)}
  .player .bgart svg{width:100%;height:100%;display:block}
  .player .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 40%,rgba(0,0,0,.55))}
  .stage{position:absolute;inset:0;display:grid;grid-template-columns:38% 1fr;align-items:center;padding:7% 6% 10%}
  .stage .title{position:absolute;top:6%;left:0;right:0;text-align:center;font-size:clamp(14px,2.6vw,28px);font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .disc{width:min(70%,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .disc svg{width:100%;height:100%;display:block}
  .lines{display:flex;flex-direction:column;gap:clamp(6px,1.4vw,14px);background:rgba(20,20,20,.28);padding:clamp(10px,2vw,22px) clamp(12px,2.4vw,28px);border-radius:8px;backdrop-filter:blur(2px)}
  .lines div{font-size:clamp(11px,1.9vw,21px);font-weight:600;text-align:center;color:rgba(255,255,255,.28);transition:color .3s,transform .3s;text-shadow:0 1px 6px rgba(0,0,0,.5);white-space:pre-wrap}
  .lines div.near{color:rgba(255,255,255,.6)}
  .lines div.now{color:#fff;transform:scale(1.04)}
  .lines .spk{font-weight:800}
  .lines .now .spk{color:#ffb3a7}
  .radio .lines div{text-align:left;font-weight:500}
  .radio .stage{grid-template-columns:34% 1fr}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:120px}
  .wave i{width:5px;border-radius:3px;background:#fff;opacity:.85;height:14px;transition:height .18s}
  .onair{display:block;text-align:center;margin-top:14px;font-weight:800;letter-spacing:.12em;font-size:clamp(10px,1.4vw,14px);color:#ffb3a7}
  .playbtn{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);cursor:pointer}
  .playbtn span{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;border:2px solid rgba(255,255,255,.7)}
  .playbtn span::after{content:"";border-left:24px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
  .player.playing .playbtn{display:none}
  .ctrl{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 10px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);display:flex;align-items:center;gap:12px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .ctrl button{border:0;background:none;color:#fff;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;padding:0}
  .bar{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;position:relative;cursor:pointer}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px;width:0}
  .removed{aspect-ratio:16/9;border-radius:12px;background:#1a1a1a;display:grid;place-items:center;text-align:center;color:#bbb;padding:20px}
  .removed b{display:block;color:#fff;font-size:20px;margin-bottom:8px}
  .removed svg{width:56px;height:56px;margin-bottom:14px;opacity:.7}

  .meta{padding:14px 2px 0}
  .meta h1{margin:0 0 6px;font-size:20px;font-weight:700;line-height:1.35}
  .meta .stat{color:var(--muted);font-size:13.5px}
  .chan{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .chan .av{width:40px;height:40px;border-radius:50%;background:#333;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
  .chan b{display:block}
  .chan small{color:var(--muted)}
  .chan .sub{margin-left:auto;border:0;background:#f1f1f1;color:#0f0f0f;font:inherit;font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:18px;cursor:pointer}
  .desc{background:var(--panel);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px;color:#ddd;white-space:pre-wrap}
  .cmts{margin-top:22px}
  .cmts h2{font-size:16px;margin:0 0 14px}
  .cmt{display:flex;gap:12px;margin-bottom:16px}
  .cmt .av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
  .cmt .who{font-size:13px;font-weight:600}
  .cmt .who small{color:var(--muted);font-weight:400;margin-left:6px}
  .cmt p{margin:3px 0 4px;font-size:14px}
  .cmt .like{font-size:12px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#eee;color:#111;padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{color:#777;font-size:12px;padding:30px 20px;text-align:center;border-top:1px solid var(--line)}
  @media (max-width:640px){
    .top{padding:0 12px;gap:8px}.wrap{padding:12px 12px 30px}
    .search{width:auto;flex:1}
    .stage{padding:12% 5% 14%;gap:8px}
    .disc{width:min(80%,140px)}
    .lines{gap:4px;padding:8px 10px}
    .wave{height:70px}
    .player,.removed{border-radius:0;margin:0 -12px}
  }
  @media (prefers-reduced-motion:reduce){.lines div,.wave i{transition:none}}
</style>

  const photoSvg = name => `<svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice"><image href="${PHOTO[name]}" width="120" height="120" preserveAspectRatio="xMidYMid slice"/></svg>`;
  const cover = (name, text, k) => PHOTO[name] ? photoSvg(name) : COVERS[name] ? COVERS[name](text, k) : '';
  const coverBg = {'두 번째 창': '#b9ad9c', '초점': '#17303a', '낮게, 오래': '#6d6470', '천천히 말해': '#c9ccd0'};
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const radioThumb = (v) => `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#1d1d1f"/><g fill="#ffb3a7">${[...Array(18)].map((_, i) => `<rect x="${22 + i * 6.5}" y="${45 - (6 + ((i * 37) % 23))}" width="3.5" height="${12 + ((i * 37) % 23) * 2}" rx="1.5"/>`).join('')}</g><text x="80" y="78" font-size="8" fill="#aaa" text-anchor="middle" style="font-family:inherit;letter-spacing:.2em">${esc(v.channel)}</text></svg>`;
  const removedThumb = `<svg viewBox="0 0 160 90"><rect width="160" height="90" fill="#222"/><text x="80" y="50" font-size="10" fill="#888" text-anchor="middle" style="font-family:inherit">삭제된 영상</text></svg>`;
  const thumb = v => v.type === 'lyric' ? `<div style="position:absolute;inset:0;background:${coverBg[v.cover] || '#333'}"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div style="width:38%;aspect-ratio:1;border-radius:50%;overflow:hidden">${cover(v.cover, false, 't' + v.id)}</div></div>` : v.type === 'radio' ? radioThumb(v) : removedThumb;

  const find = id => { id = DATA.aliases[id] || id; return DATA.videos.find(v => v.id === id); };
  const avColor = n => `hsl(${[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 360} 40% 45%)`;

  /* ── 목록 ── */
  let filter = 'all';
  function renderList(q) {
    stop();
    const vids = DATA.videos.filter(v => filter === 'all' || v.type === filter).filter(v => !q || v.title.includes(q) || (v.channel || '').includes(q));
    main.innerHTML = `<div class="list-h">${[['all', '전체'], ['lyric', '가사 영상'], ['radio', '라디오 / 인터뷰']].map(([k, l]) => `<button type="button" data-filter="${k}" class="${filter === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${q ? `<p style="color:#aaa;margin:0 0 14px">'${esc(q)}' 검색 결과 ${vids.length}개</p>` : ''}
      <div class="grid">${vids.map(v => `<a class="card" href="#${v.id}"><div class="thumb">${thumb(v)}${v.duration ? `<span class="dur">${fmt(v.duration)}</span>` : ''}</div><h3>${esc(v.title)}</h3><p>${esc(v.channel)}${v.views ? ` · 조회수 ${esc(v.views)} · ${esc(v.date)}` : ''}</p></a>`).join('')}</div>`;
    document.title = (q ? q + ' - ' : '') + DATA.site.name;
  }

  /* ── 재생 화면 ── */
  let timer = null, t = 0, cur = null;
  function stop() { clearInterval(timer); timer = null; }
  function renderVideo(v) {
    stop(); t = 0; cur = v;
    if (v.type === 'removed') {
      main.innerHTML = `<div class="removed"><div><svg viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg><b>${esc(v.reason)}</b><span>${esc(v.title)}</span></div></div>
        <div class="meta"><h1>${esc(v.title)}</h1><div class="stat">${esc(v.channel)}</div></div>`;
      document.title = v.title + ' - ' + DATA.site.name; return;
    }
    const isLyric = v.type === 'lyric';
    const art = isLyric ? `<div class="disc">${cover(v.cover, false, 'd')}</div>` :`<div><div class="wave" id="wave">${[...Array(28)].map(() => '<i></i>').join('')}</div><span class="onair">${esc(v.show || v.channel)}</span></div>`;
    main.innerHTML = `
      <div class="player ${isLyric ? 'lyric' : 'radio'}" id="player">
        <div class="bgart" style="${isLyric ? '' : 'background:#2a1d1b'}">${isLyric ? cover(v.cover, false, 'b') : ''}</div><div class="veil"></div>
        <div class="stage"><div class="title">${esc(isLyric ? `${v.artist} - ${v.song}` : v.title.replace(/^\[.*?\]\s*/, ''))}</div>${art}<div class="lines" id="lines"></div></div>
        <div class="playbtn" id="playbtn" title="재생"><span></span></div>
        <div class="ctrl"><button type="button" id="toggle" aria-label="재생/일시정지">▶</button><span id="time">0:00</span><div class="bar" id="bar"><i id="fill"></i></div><span>${fmt(v.duration)}</span></div>
      </div>
      <div class="meta"><h1>${esc(v.title)}</h1><div class="stat">조회수 ${esc(v.views)} · ${esc(v.date)}</div>
        <div class="chan"><div class="av">${esc(v.channelMark || v.channel.slice(0, 2))}</div><div><b>${esc(v.channel)}</b><small>구독자 ${esc(v.channel === '문영FM' ? '12.4만명' : v.channel === '뮤직노트' ? '3.1만명' : '8.7만명')}</small></div><button type="button" class="sub" data-unsupported="구독">구독</button></div>
        <div class="desc">${esc(v.desc || '')}</div></div>
      <div class="cmts"><h2>댓글 ${v.comments.length}개</h2>${v.comments.map(([n, d, c, l]) => `<div class="cmt"><div class="av" style="background:${avColor(n)}">${esc(n.slice(0, 1))}</div><div><div class="who">@${esc(n)}<small>${esc(d)}</small></div><p>${esc(c)}</p><div class="like">👍 ${l}</div></div></div>`).join('')}</div>`;
    paint();
    $('#playbtn').addEventListener('click', play);
    $('#toggle').addEventListener('click', () => timer ? pause() : play());
    $('#bar').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); t = Math.floor((e.clientX - r.left) / r.width * v.duration); paint(); });
    document.title = v.title + ' - ' + DATA.site.name;
  }
  function play() { if (timer) return; $('#player').classList.add('playing'); $('#toggle').textContent = '❚❚'; timer = setInterval(() => { t++; if (t >= cur.duration) { t = cur.duration; pause(); } paint(); }, 1000); }
  function pause() { stop(); const p = $('#player'); if (p) { p.classList.remove('playing'); $('#toggle').textContent = '▶'; } }
  function paint() {
    const v = cur, lines = v.lines;
    let idx = -1; lines.forEach(([s], i) => { if (t >= s) idx = i; });
    const win = v.type === 'lyric' ? 2 : 1;
    const from = Math.max(0, Math.min(idx - win, lines.length - (win * 2 + 1))), to = Math.min(lines.length, from + win * 2 + 1);
    const box = $('#lines');
    box.innerHTML = lines.slice(from, to).map(([s, text], k) => {
      const i = from + k; const cls = i === idx ? 'now' : Math.abs(i - idx) === 1 ? 'near' : '';
      const m = text.match(/^([^:]{1,6}): (.*)$/);
      return `<div class="${cls}">${m ? `<span class="spk">${esc(m[1])}</span>  ${esc(m[2])}` : esc(text)}</div>`;
    }).join('');
    $('#time').textContent = fmt(t); $('#fill').style.width = (t / v.duration * 100) + '%';
    const w = $('#wave'); if (w) [...w.children].forEach((b, i) => { b.style.height = (timer ? 10 + Math.abs(Math.sin(t * 1.7 + i * .9)) * 46 + ((i * 13) % 7) : 14) + 'px'; });
  }

  /* ── 이동 (샌드박스에서도 동작하도록 주소 변경 실패는 무시) ── */
  function route(h) {
    h = (h || '').replace(/^#/, '');
    let m;
    if (!h || h === 'list') return renderList();
    if ((m = h.match(/^search=(.+)$/))) return renderList(decodeURIComponent(m[1]));
    const v = find(h);
    if (v) renderVideo(v); else main.innerHTML = `<div class="removed"><div><b>해당 영상을 찾을 수 없습니다.</b><span>${esc(h)}</span></div></div>`;
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function nav(h) { route(h); try { location.hash = h; } catch (e) {} }
  const toastEl = $('#toast'); let tt;
  const toast = m => { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1800); };
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"],[data-filter],[data-unsupported]');
    if (!a) return;
    if (a.dataset.filter) { filter = a.dataset.filter; renderList(); return; }
    if (a.dataset.unsupported) { e.preventDefault(); toast(`'${a.dataset.unsupported}' 기능은 수업용 화면에서 지원하지 않습니다.`); return; }
    e.preventDefault(); nav(a.getAttribute('href').slice(1));
  });
  const doSearch = () => { const q = $('#q').value.trim(); if (q) nav('search=' + encodeURIComponent(q)); };
  $('#searchBtn').addEventListener('click', doSearch);
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  window.addEventListener('hashchange', () => route(location.hash));
  route((() => { try { return location.hash; } catch (e) { return ''; } })());
})();
</script>
