<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문영 수사본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 문영위키(나무위키 양식)와 같은 화면 언어. 값은 문영위키에서 가져왔다. */
:root {
  --top-a: #08857A;        /* 상단 바 왼쪽: 흰 글자 4.5:1 이상 */
  --top-b: #2CB27C;        /* 상단 바 오른쪽 끝: 문영위키와 같은 초록 */
  --bg: #F5F5F5;
  --card: #FFFFFF;
  --line: #CCCCCC;
  --line-soft: #DDDDDD;
  --hover: #F2F2F2;
  --text: #212529;
  --muted: #666666;
  --link: #0275D8;
  --link-ext: #008000;
  --accent: #0E9F92;       /* 문영위키 청록: 목차 표시, 시점 줄 */
  --accent-ink: #0A7A70;
  --th: #0B7D73;           /* 표 머리, 정보상자 칸 */
  --ibox-a: #0E9F92; --ibox-b: #2CB27C;
  --wiki: #0A7A70; --news: #2F6FB5; --sns: #C2477F;   /* 문영위키 스크랩 색 */
  --v-true: #212529; --on-true: #FFFFFF;
  --v-false: #C0392B; --on-false: #FFFFFF;
  --v-open: #E0A800; --on-open: #212529;
  --notice-bg: #FFFBEA; --notice-line: #E8D48B;
  --flash: #FFF3B0;
  --sel: #EEFAF7;
  --tip: #222222; --on-tip: #FFFFFF;
  --f: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --top-a: #06665E; --top-b: #1C7D58; --bg: #1C1D1F; --card: #27292D; --line: #43464C; --line-soft: #383B40; --hover: #303338;
    --text: #E0E0E0; --muted: #A0A4A8; --link: #6CB2FF; --link-ext: #5FCB6E; --accent: #2CC3B3; --accent-ink: #5FD9CB; --th: #0B6E66;
    --ibox-a: #0B7D73; --ibox-b: #1C8A5E; --wiki: #2FB3A6; --news: #6FA2E6; --sns: #E07AAA;
    --v-true: #E0E0E0; --on-true: #1C1D1F; --v-false: #FF7B6E; --on-false: #1C1D1F; --v-open: #F0C23C; --on-open: #1C1D1F;
    --notice-bg: #3A3420; --notice-line: #6B5D2A; --flash: #5A4E1C; --sel: #1F3A37; --tip: #E0E0E0; --on-tip: #1C1D1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --top-a: #06665E; --top-b: #1C7D58; --bg: #1C1D1F; --card: #27292D; --line: #43464C; --line-soft: #383B40; --hover: #303338;
  --text: #E0E0E0; --muted: #A0A4A8; --link: #6CB2FF; --link-ext: #5FCB6E; --accent: #2CC3B3; --accent-ink: #5FD9CB; --th: #0B6E66;
  --ibox-a: #0B7D73; --ibox-b: #1C8A5E; --wiki: #2FB3A6; --news: #6FA2E6; --sns: #E07AAA;
  --v-true: #E0E0E0; --on-true: #1C1D1F; --v-false: #FF7B6E; --on-false: #1C1D1F; --v-open: #F0C23C; --on-open: #1C1D1F;
  --notice-bg: #3A3420; --notice-line: #6B5D2A; --flash: #5A4E1C; --sel: #1F3A37; --tip: #E0E0E0; --on-tip: #1C1D1F;
  color-scheme: dark;
}

* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg); scroll-behavior: smooth; scrollbar-color: var(--line) transparent }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; caret-color: var(--link) }
::selection { background: var(--flash); color: var(--text) }
a { color: var(--link); text-decoration: none }
a:hover { text-decoration: underline }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid #1B6EC2; outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }
svg.i { width: 1em; height: 1em; vertical-align: -.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 50; background: linear-gradient(90deg, var(--top-a) 0%, var(--top-a) 35%, var(--top-b) 100%); color: #fff; padding-top: env(safe-area-inset-top, 0px) }
.top-in { display: flex; align-items: center; gap: 6px; min-height: 56px; padding: 0 36px; max-width: 1520px; margin: 0 auto }
.logo { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 800; font-size: 21px; letter-spacing: -.04em; margin-right: 14px; white-space: nowrap }
.logo:hover { text-decoration: none }
.logo svg { width: 34px; height: 34px }
.nav-item { display: flex; align-items: center; gap: 8px; color: #fff; font-size: 16px; padding: 8px 12px; border-radius: 4px; white-space: nowrap }
.nav-item:hover { background: rgba(255, 255, 255, .14); text-decoration: none }
.nav-item svg.i { font-size: 20px }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 8px }
.team-box { display: flex; align-items: center; width: 250px; height: 40px; background: #fff; border-radius: 3px; color: #333 }
.team-box:focus-within { box-shadow: inset 0 0 0 2px #1B6EC2 }
.team-box svg.i { font-size: 19px; margin-left: 11px; color: #555; flex-shrink: 0 }
.team-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; padding: 0 10px; background: transparent; color: #212529; font-size: 14px }
.team-box input::placeholder { color: #6B6B6B }

/* 시점 줄 (문영위키와 같은 모양) */
.turn-bar { max-width: 1520px; margin: 0 auto; padding: 12px 36px 0 }
.turn-in { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line-soft); border-left: 4px solid var(--accent); border-radius: 4px; padding: 8px 10px 8px 14px; font-size: 14.5px }
.turn-in .k { color: var(--muted) }
.turn-in b { font-size: 15.5px }
.turn-in .d { color: var(--muted) }
.turn-pick { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted) }
.turn-pick select { height: 36px; border: 1px solid var(--accent-ink); background: var(--accent-ink); color: #fff; font-weight: 700; border-radius: 4px; padding: 0 8px }
:root[data-theme="dark"] .turn-pick select { color: #1C1D1F }

/* 본문 틀: 문서 + 오른쪽 사이드바 */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 16px 36px 0; max-width: 1520px; margin: 0 auto }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 5px }
.article { padding: 24px 24px 0; min-width: 0 }
.head { display: flex; align-items: flex-start; gap: 16px }
.head h1 { margin: 0; font-size: 36px; font-weight: 600; line-height: 1.25; letter-spacing: -.02em }
.actions { margin-left: auto; display: flex; flex-shrink: 0; padding-top: 4px }
.btn-group { display: flex; border: 1px solid var(--line); border-radius: 4px; background: var(--card) }
.btn-group button { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text); font-size: 14px; white-space: nowrap }
.btn-group > :first-child { border-left: 0; border-radius: 3px 0 0 3px }
.btn-group > :last-child { border-radius: 0 3px 3px 0 }
.btn-group button:hover { background: var(--hover) }
.btn-group button svg.i { font-size: 16px; color: var(--muted) }
.btn-group button.warn { color: var(--v-false) }
.updated { margin: 4px 0 0; font-size: 14px; color: var(--muted) }
.cat-bar { display: flex; flex-wrap: wrap; gap: 0 4px; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 14px; margin: 22px 0 10px }
.cat-bar span:not(:first-child):not(:last-child)::after { content: ""; display: inline-block; width: 1px; height: 11px; background: #BBB; margin: 0 6px; vertical-align: -1px }
.notice { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: 15px }
.notice .ico { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; background: #16A085; color: #fff; display: grid; place-items: center; margin-top: 1px }
.notice .ico svg.i { font-size: 12px; stroke-width: 3 }

.wiki { font-size: 15px; line-height: 1.6; padding-bottom: 28px }
.wiki p { margin: 0 0 15px }
.infobox { float: right; width: 360px; max-width: 100%; margin: 6px 0 16px 20px; border: 2px solid var(--ibox-a); background: var(--card); font-size: 14.5px }
.ibox-title { background: linear-gradient(90deg, var(--top-a), var(--th)); color: #fff; text-align: center; padding: 9px 10px 8px; line-height: 1.3 }
.ibox-title b { display: block; font-size: 19px; font-weight: 700 }
.ibox-title span { font-size: 13.5px; font-weight: 600 }
.infobox table { width: 100%; border-collapse: collapse }
.infobox th { width: 92px; background: var(--th); color: #fff; font-weight: 700; text-align: center; padding: 7px 6px; border-top: 1px solid rgba(255, 255, 255, .25) }
.infobox td { padding: 6px 10px; border-top: 1px solid var(--line-soft); line-height: 1.55 }
.toc { display: inline-block; min-width: 220px; max-width: 100%; border: 1px solid var(--line); padding: 12px 16px 14px; margin: 6px 0 10px }
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: 30px; font-size: 18px; width: 100%; border: 0; background: none; padding: 0; text-align: left }
.toc-head svg.i { color: var(--muted); transition: transform .15s }
.toc.closed .toc-head svg.i { transform: rotate(-90deg) }
.toc.closed .toc-list { display: none }
.toc-list { margin-top: 10px; line-height: 1.55 }
.toc-list div { padding-left: 6px }
.toc-list .lv2 { padding-left: 26px }

.sec-h { clear: both; display: flex; align-items: center; gap: 6px; margin: 30px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 70px }
.sec-h h2, .sec-h h3 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -.02em; line-height: 1.3 }
.sec-h.lv2 { margin-top: 24px; clear: none }
.sec-h.lv2 h3 { font-size: 21px; font-weight: 700 }
.sec-h .n { color: var(--link) }
.sec-h .fold { color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border: 0; background: none; padding: 0; border-radius: 3px; flex-shrink: 0; transition: transform .15s }
.sec-h .fold:hover { background: var(--hover) }
.sec-h.closed .fold { transform: rotate(-90deg) }
.sec-h .tail { margin-left: auto; align-self: center; font-size: 13px; color: var(--muted); font-weight: 400; white-space: nowrap }
.sec-body.closed { display: none }

/* 2. 증거 시간선 */
.tl-box { border: 1px solid var(--line); border-radius: 4px; overflow: hidden }
.tl-frame { position: relative; padding-left: 76px }
.tl-frame .pills { position: absolute; inset: 0 auto 0 0; width: 76px; z-index: 5; pointer-events: none; background: var(--card); border-right: 1px solid var(--line-soft) }
.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain }
.tl-scroll.fl { -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px); mask-image: linear-gradient(90deg, transparent, #000 16px) }
.tl-scroll.fr { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent) }
.tl-scroll.fl.fr { -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 28px), transparent) }
.map { position: relative; height: 290px; min-width: 780px }
.map svg { position: absolute; inset: 0; width: 100%; height: 100% }
.line-tag { position: absolute; left: 12px; transform: translateY(-50%); min-width: 50px; height: 24px; padding: 0 8px; border-radius: 3px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 12.5px }
.t-wiki { background: var(--wiki) } .t-news { background: var(--news) } .t-sns { background: var(--sns) }
:root[data-theme="dark"] .line-tag, :root[data-theme="dark"] .src-tag { color: #1C1D1F }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .line-tag, :root:not([data-theme="light"]) .src-tag { color: #1C1D1F } :root:not([data-theme="light"]) .turn-pick select { color: #1C1D1F } }
.s-wiki { --src: var(--wiki) } .s-news { --src: var(--news) } .s-sns { --src: var(--sns) }
.st { position: absolute; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 5px; border: 0; background: none; padding: 0 2px; transform: translate(-50%, calc(-100% + 8px)); color: var(--text) }
.st .lab { font-size: 13px; line-height: 1.3; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; background: var(--card); padding: 0 3px }
.st .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 4px solid var(--src); flex-shrink: 0 }
.st:hover .lab { color: var(--link); text-decoration: underline }
.st.on .lab { font-weight: 700; color: var(--text) }
.st.on .dot { background: var(--src); box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--text) }
.st.off .lab { color: var(--muted) }
.st.cur .lab { background: var(--flash) }
.dl { position: absolute; transform: translateX(-50%); font-size: 12.5px; color: var(--muted); white-space: nowrap; z-index: 2 }
.dl b { color: var(--text) }
.day-span { position: absolute; height: 6px; border: 1px solid var(--line); border-top: 0; z-index: 1 }
.tm { position: absolute; top: 8px; transform: translateX(-50%); z-index: 4; height: 26px; padding: 0 9px; border-radius: 3px; display: flex; align-items: center; gap: 5px; font-size: 12.5px; white-space: nowrap; border: 1px solid var(--line); background: var(--card); color: var(--muted) }
.tm.now { background: var(--tip); border-color: var(--tip); color: var(--on-tip); font-weight: 700 }
.tm.past { color: var(--text) }
.tm.future { border-style: dashed }
.future-note { position: absolute; z-index: 2; font-size: 12.5px; color: var(--muted); transform: translateX(-50%); white-space: nowrap }
.tl-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 12px; border-top: 1px solid var(--line-soft); font-size: 13.5px; color: var(--muted); background: var(--card) }

/* 3. 판단할 주장 */
.claim-sec { scroll-margin-top: 70px }
.claim-sec.sel > .sec-h { background: var(--sel); border-bottom-color: var(--accent); margin-inline: -8px; padding: 6px 8px 8px; border-radius: 4px 4px 0 0 }
.vrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px }
.vgroup { display: flex; border: 1px solid var(--line); border-radius: 4px; background: var(--card) }
.vbtn { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--text); font-size: 14.5px; font-weight: 500 }
.vbtn:first-child { border-left: 0; border-radius: 3px 0 0 3px }
.vbtn:last-child { border-radius: 0 3px 3px 0 }
.vbtn:hover { background: var(--hover) }
.vbtn svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--vm) }
.v-true { --vm: var(--v-true); --vm-on: var(--card) }
.v-false { --vm: var(--v-false); --vm-on: var(--on-false) }
.v-open { --vm: var(--v-open); --vm-on: var(--on-open) }
.vbtn.v-true[aria-pressed="true"] { background: var(--v-true); color: var(--on-true); font-weight: 700; --vm: var(--on-true); --vm-on: var(--v-true) }
.vbtn.v-false[aria-pressed="true"] { background: var(--v-false); color: var(--on-false); font-weight: 700; --vm: var(--on-false); --vm-on: var(--v-false) }
.vbtn.v-open[aria-pressed="true"] { background: var(--v-open); color: var(--on-open); font-weight: 700; --vm: var(--on-open); --vm-on: var(--v-open) }
.history { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px }
.history b { color: var(--text); font-weight: 500 }
.trail { width: 58px; height: 18px; flex-shrink: 0 }
.field-l { display: block; font-weight: 700; margin: 4px 0 6px; font-size: 14.5px }
.field-l span { font-weight: 400; color: var(--muted); font-size: 13.5px; margin-left: 6px }
.input { width: 100%; min-width: 0; height: 38px; border: 1px solid var(--line); background: var(--card); border-radius: 4px; padding: 0 10px; color: var(--text) }
.input:hover { border-color: #999 }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; line-height: 1.6; resize: vertical }
.input::placeholder { color: var(--muted) }
.wiki-list { margin: 0 0 12px; padding-left: 1.4em }
.wiki-list li { margin: 6px 0; line-height: 1.6 }
.src-tag { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; border-radius: 3px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; line-height: 1.6 }
.ev-date { color: var(--muted); font-size: 13.5px; margin-right: 4px }
.ev-from { color: var(--muted); font-size: 13px }
.cn { font-size: .72em; color: var(--link); margin-left: 1px; vertical-align: super; white-space: nowrap }
.lnk { border: 0; background: none; padding: 0 2px; color: var(--link); font-size: 13.5px }
.lnk:hover { text-decoration: underline }
.lnk.del { color: var(--muted) }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--text); font-size: 14px; white-space: nowrap }
.btn:hover { background: var(--hover) }
.btn.pri { border-color: var(--accent-ink); color: var(--accent-ink); font-weight: 700 }
.btn svg.i { font-size: 15px }
.picker { border: 1px solid var(--line); border-radius: 4px; margin: 8px 0 4px; max-height: 300px; overflow: auto; background: var(--card) }
.picker-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line-soft) }
.picker-row:first-child { border-top: 0 }
.picker-row > div { flex: 1; min-width: 0; font-size: 14px }
.picker-empty { margin: 0; padding: 10px; color: var(--muted); font-size: 14px }
.add-claim { display: flex; gap: 8px; margin-top: 22px; clear: both }

/* 4. 증거함 */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px }
.filters button { font-size: 13px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); color: var(--muted) }
.filters button:hover { color: var(--text) }
.filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--card) }
.wiki-table-wrap { overflow-x: auto; margin: 0 0 15px }
.wiki-table { border-collapse: collapse; width: 100%; min-width: 720px }
.wiki-table th, .wiki-table td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: middle }
.wiki-table th { background: var(--th); color: #fff; font-weight: 700; text-align: center; white-space: nowrap }
.wiki-table td.c { text-align: center; white-space: nowrap }
.wiki-table tr.flash td { background: var(--flash) }
.wiki-table td { transition: background-color 1.2s }
.ev-cell b { font-weight: 700 }
.ev-cell p { margin: 2px 0 0; font-size: 14px }
.chk { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; background: none; padding: 0 }
.chk .box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 3px; display: grid; place-items: center; background: var(--card) }
.chk .box svg { width: 12px; height: 12px; opacity: 0 }
.chk[aria-pressed="true"] .box { background: var(--accent-ink); border-color: var(--accent-ink) }
.chk[aria-pressed="true"] .box svg { opacity: 1 }
.used a { margin-right: 6px }

/* 5. 증거 직접 추가 */
.addev-form { display: grid; grid-template-columns: 120px 170px minmax(0, 1fr); gap: 10px 12px; max-width: 860px }
.addev-form label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); font-weight: 500 }
.addev-form .full { grid-column: 1 / -1 }
.addev-form .row-end { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px }
.err { color: var(--v-false); font-size: 13.5px; margin: 0 }
.copy-out { margin: 0 0 20px }
.copy-out textarea { min-height: 180px; font-size: 14px }

.license { clear: both; border-top: 1px solid var(--line); margin: 0 -24px; padding: 20px 24px; text-align: right; font-size: 14px; color: var(--muted); line-height: 1.6 }
.license p { margin: 0 }

/* 오른쪽 사이드바 */

    return s + '</svg>';
  }
  const trailText = c => TURNS.filter(t => t.n <= S.turn).map(t => `${t.n}턴 ${c.v[t.n] ? VERDICT[c.v[t.n]] : '판정 전'}`).join(', ');
  const badge = v => v ? `<span class="badge b-${v}">${VERDICT[v]}</span>` : `<span class="badge b-none">판정 전</span>`;

  /* ── 문단 제목 (나무위키처럼 번호, 접기) ── */
  function secHead(id, n, title, lv = 1, tail = '') {
    const closed = !!S.closed[id];
    const tag = lv === 1 ? 'h2' : 'h3';
    return `<div class="sec-h${lv === 2 ? ' lv2' : ''}${closed ? ' closed' : ''}" id="s-${id}">
      <button type="button" class="fold" data-fold="${id}" aria-expanded="${!closed}" aria-controls="b-${id}" aria-label="${esc(title)} ${closed ? '펼치기' : '접기'}">${icon('down')}</button>
      <${tag}><a class="n" href="#s-${id}">${n}.</a> <span class="t">${esc(title)}</span></${tag}>${tail ? `<span class="tail">${tail}</span>` : ''}
    </div>`;
  }
  const body = (id, html) => `<div class="sec-body${S.closed[id] ? ' closed' : ''}" id="b-${id}">${html}</div>`;

  /* ── 문서 본문 ── */
  function renderDoc() {
    const t = turnOf(S.turn);
    const judged = S.claims.filter(c => c.v[S.turn]).length;
    const cnt = { wiki: 0, news: 0, sns: 0 }; S.evidence.forEach(e => cnt[e.src]++);
    const toc = [['ov', '1', '개요'], ['tl', '2', '증거 시간선'], ['cl', '3', '판단할 주장'], ...S.claims.map(c => [`c-${c.id}`, cnum(c), c.text, 2]), ['box', '4', '증거함'], ['add', '5', '증거 직접 추가']];
    let h = `
      <div class="infobox">
        <div class="ibox-title"><b>이은호 김서진 열애설</b><span>사건 파일 2026-02</span></div>
        <table><tbody>
          <tr><th>현재 시점</th><td class="num">${S.turn}턴, ${t.label}</td></tr>
          <tr><th>모둠</th><td>${S.team ? esc(S.team) : '<span style="color:var(--muted)">이름 없음</span>'}</td></tr>
          <tr><th>판단할 주장</th><td class="num">${S.claims.length}개 중 ${judged}개 판정</td></tr>
          <tr><th>모은 증거</th><td class="num">${S.evidence.length}개 (위키 ${cnt.wiki}, 기사 ${cnt.news}, SNS ${cnt.sns})</td></tr>
          <tr><th>자료</th><td><a href="https://claude.ai/artifact/JM9iRLeWXGpZZE3h4RTWDV" target="_blank" rel="noopener">문영위키</a>, <a href="https://claude.ai/artifact/FB262z41ts6fv9AuVNjSLB" target="_blank" rel="noopener">문영일보</a></td></tr>
        </tbody></table>
      </div>
      <p>'''이은호 김서진 열애설''' 사건을 확인하는 모둠의 수사 기록이다. 지금은 <b>${S.turn}턴</b>(${t.label}), ${esc(t.desc)}이다.</p>
      <p>주장마다 증거를 연결하고, 판정과 그렇게 판단한 근거를 적는다. 판정에는 정답 표시가 없다. 새 턴이 열리면 새 증거를 찾아 다시 판정한다.</p>
      <div class="toc" id="toc">
        <button type="button" class="toc-head" id="tocHead" aria-expanded="true">목차 ${icon('down')}</button>
        <div class="toc-list">${toc.map(([id, n, label, lv]) => `<div${lv === 2 ? ' class="lv2"' : ''}><a href="#s-${id}">${n}.</a> ${esc(label)}</div>`).join('')}</div>
      </div>`;
    h = h.replace("'''이은호 김서진 열애설'''", '<b>이은호 김서진 열애설</b>');

    h += secHead('ov', 1, '개요') + body('ov', `
      <p>${S.turn}턴 시점까지 모은 증거는 ${S.evidence.length}개, 판단할 주장은 ${S.claims.length}개이다. 판정이 끝나지 않은 주장은 오른쪽 <b>판정 현황</b>에서 바로 찾아갈 수 있다.</p>`);

    h += secHead('tl', 2, '증거 시간선') + body('tl', `
      <p id="tlNote"></p>
      <div class="tl-box">
        <div class="tl-frame"><div class="pills" id="pills"></div><div class="tl-scroll" id="tlScroll"><div class="map" id="map"></div></div></div>
        <div class="tl-foot"><span>점은 증거, 줄은 출처입니다.</span><span>검은 표시가 지금 시점이고, 그 오른쪽 점선은 아직 오지 않은 시간입니다.</span></div>
      </div>`);

    h += secHead('cl', 3, '판단할 주장', 1, `${S.turn}턴 판정 ${judged} / ${S.claims.length}`) + body('cl', S.claims.map(claimSec).join('') + `
      <form class="add-claim" id="addClaim">
        <label for="newClaim" hidden>새 주장</label>
        <input class="input" id="newClaim" autocomplete="off" placeholder="새로 확인할 주장을 한 문장으로 적으세요">
        <button class="btn" type="submit">${icon('plus')}주장 추가</button>
      </form>`);

    h += secHead('box', 4, '증거함') + body('box', boxHtml());
    h += secHead('add', 5, '증거 직접 추가') + body('add', addHtml());
    $('#doc').innerHTML = h;
  }

  function claimSec(c) {
    const v = c.v[S.turn] || '';
    const linked = sortEv(c.ev.map(evById).filter(Boolean));
    const past = TURNS.filter(t => t.n < S.turn && c.v[t.n]);
    const open = S.pick === c.id;
    const rest = sortEv(S.evidence.filter(e => !c.ev.includes(e.id)));
    return `<section class="claim-sec${c.id === S.sel ? ' sel' : ''}" data-claim="${c.id}">
      ${secHead(`c-${c.id}`, cnum(c), c.text, 2)}
      ${body(`c-${c.id}`, `
        <div class="vrow">
          <div class="vgroup" role="group" aria-label="${S.turn}턴 판정">
            ${['true', 'false', 'open'].map(k => `<button type="button" class="vbtn v-${k}" data-v="${k}" aria-pressed="${v === k}">${mark(k)}${VERDICT[k]}</button>`).join('')}
          </div>
          <span class="history">${trail(c)}<span>${past.length ? `이전 판정: ${past.map(t => `${t.n}턴 <b>${VERDICT[c.v[t.n]]}</b>`).join(', ')}` : `${S.turn}턴 판정 ${v ? '완료' : '전'}`}</span></span>
        </div>
        <label class="field-l" for="note-${c.id}">근거<span>어떤 증거 때문에 그렇게 판단했나요?</span></label>
        <textarea class="input" id="note-${c.id}" data-note="${c.id}" rows="2" placeholder="예: 노래가 메시지보다 먼저 나왔으므로 답장일 수 없다">${esc(c.note)}</textarea>
        <p class="field-l" style="margin-top:14px">연결한 증거<span class="num">${linked.length}개</span></p>
        ${linked.length ? `<ul class="wiki-list">${linked.map(e => `<li>${srcTag(e.src)}<span class="ev-date num">${fmtDate(e.date)}</span><b>${esc(e.short)}</b>${e.cn ? '<span class="cn">[출처 필요]</span>' : ''} <span class="ev-from">${esc(e.from || '')}</span> <button type="button" class="lnk del" data-unlink="${e.id}">연결 끊기</button></li>`).join('')}</ul>` : '<p style="color:var(--muted)">아직 연결한 증거가 없습니다. 아래 단추로 증거함에서 골라 연결하세요.</p>'}
        <button type="button" class="btn pri" data-pickfor="${c.id}" aria-expanded="${open}">${icon('plus')}증거 연결</button>
        ${open ? `<div class="picker">${rest.length ? rest.map(e => `<div class="picker-row"><div>${srcTag(e.src)}<span class="ev-date num">${fmtDate(e.date)}</span><b>${esc(e.short)}</b><br><span class="ev-from">${esc(e.text)}</span></div><button type="button" class="btn" data-link="${e.id}">연결</button></div>`).join('') : '<p class="picker-empty">연결할 증거가 더 없습니다. 5. 증거 직접 추가에서 새 증거를 넣으세요.</p>'}</div>` : ''}
      `)}
    </section>`;
  }
  const srcTag = s => `<span class="src-tag t-${s}">${SRC[s]}</span>`;

  function boxHtml() {
    const counts = { all: S.evidence.length }; S.evidence.forEach(e => counts[e.src] = (counts[e.src] || 0) + 1);
    const list = sortEv(S.evidence.filter(e => S.filter === 'all' || e.src === S.filter));
    return `<div class="filters" role="group" aria-label="출처별로 보기">${[['all', '전체'], ...LINES.map(l => [l, SRC[l]])].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${S.filter === k}">${l} <span class="num">${counts[k] || 0}</span></button>`).join('')}</div>
      <div class="wiki-table-wrap"><table class="wiki-table">
        <thead><tr><th>출처</th><th>날짜</th><th>증거</th><th>출처 있음</th><th>원문 확인</th><th>연결한 주장</th></tr></thead>
        <tbody>${list.length ? list.map(e => {
          const used = S.claims.filter(c => c.ev.includes(e.id));
          return `<tr id="ev-${e.id}" tabindex="-1">
            <td class="c">${srcTag(e.src)}</td>
            <td class="c num">${fmtDate(e.date)}<br><span class="ev-from">${e.found}턴에 찾음</span></td>
            <td class="ev-cell"><b>${esc(e.short)}</b>${e.cn ? '<span class="cn">[출처 필요]</span>' : ''}<p>${esc(e.text)}</p><span class="ev-from">${esc(e.from || '')}</span></td>
            ${['src', 'orig'].map(k => `<td class="c"><button type="button" class="chk" data-check="${k}" data-id="${e.id}" aria-pressed="${!!e.checks[k]}" aria-label="${esc(e.short)} ${k === 'src' ? '출처 있음' : '원문 확인함'}"><span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></td>`).join('')}
            <td class="c used">${used.length ? used.map(c => `<a href="#s-c-${c.id}" data-go="${c.id}">${cnum(c)}</a>`).join('') : '<span class="ev-from">없음</span>'}</td>
          </tr>`; }).join('') : `<tr><td colspan="6" style="color:var(--muted)">${SRC[S.filter]} 증거가 아직 없습니다. 5. 증거 직접 추가에서 넣으세요.</td></tr>`}</tbody>
      </table></div>`;
  }

  function addHtml() {
    return `<p>문영위키나 문영일보에서 새로 찾은 내용을 옮겨 적습니다. ${S.turn}턴 시점보다 뒤의 날짜는 넣을 수 없습니다.</p>
      <form class="addev-form" id="addEvForm" novalidate>
        <label>출처<select class="input" name="src">${LINES.map(l => `<option value="${l}">${SRC[l]}</option>`).join('')}</select></label>
        <label>날짜<input class="input" type="date" name="date" min="2020-01-01" max="2026-12-31"></label>
        <label>짧은 이름<input class="input" name="short" maxlength="20" placeholder="시간선에 보일 이름"></label>
        <label class="full">내용<textarea class="input" name="text" placeholder="찾은 문장을 그대로 옮겨 적으세요"></textarea></label>
        <label style="grid-column:span 2">어디서 찾았나요<input class="input" name="from" placeholder="예: 문영위키 이은호 문서 각주 3"></label>
        <label>연결할 주장<select class="input" name="claim"><option value="">나중에 연결</option>${S.claims.map(c => `<option value="${c.id}"${c.id === S.sel ? ' selected' : ''}>${cnum(c)} ${esc(c.text)}</option>`).join('')}</select></label>
        <div class="row-end"><button class="btn pri" type="submit">${icon('plus')}증거 추가</button><p class="err" id="evErr" role="alert"></p></div>
      </form>`;
  }

  /* ── 2. 증거 시간선 ── */
  const G = 24, R = 36, LINE_Y = [104, 168, 232], AXIS_Y = 260;
  let lastNowX = null, animFrom = null;
  function layout(width) {
    const items = sortEv(S.evidence);
    const seg = it => TURNS.filter(t => ms(it.date) >= t.ms).length;
    const groups = [[], [], [], []];
    items.forEach(it => groups[seg(it)].push(it));
    const w = groups.map((g, k) => Math.max(g.length, k === 0 ? 2 : k === 3 ? 0.8 : 1.3));
    const total = w.reduce((a, b) => a + b, 0), inner = width - G - R;
    const segW = w.map(x => x / total * inner);
    const bx = []; let acc = G;
    segW.forEach((sw, k) => { acc += sw; if (k < 3) bx.push(acc); });
    const pos = {};
    groups.forEach((g, k) => { const start = k === 0 ? G : bx[k - 1]; g.forEach((it, i) => { pos[it.id] = start + (i + 0.5) * segW[k] / g.length; }); });
    return { items, pos, bx };
  }
  function renderMap() {
    const mapEl = $('#map'); if (!mapEl) return;
    const width = Math.max(mapEl.clientWidth, 600);
    const L = layout(width), c = claim(), linked = new Set(c ? c.ev : []);
    const nowX = L.bx[S.turn - 1], endX = width - R + 12;
    let svg = `<svg viewBox="0 0 ${width} 290" aria-hidden="true">`;
    L.bx.forEach((x, i) => { const now = i + 1 === S.turn; svg += `<path d="M${x} 34V${AXIS_Y - 12}" stroke="${now ? 'var(--tip)' : 'var(--line)'}" stroke-width="${now ? 3 : 1}" ${now ? 'class="now-line"' : 'stroke-dasharray="4 4"'}/>`; });
    LINES.forEach((ln, i) => {
      const y = LINE_Y[i];
      const solidEnd = animFrom !== null && nowX > animFrom ? animFrom : nowX;
      svg += `<path d="M0 ${y}H${solidEnd}" stroke="var(--${ln})" stroke-width="5" stroke-linecap="round"/>`;
      svg += `<path d="M${nowX + 6} ${y}H${endX}" stroke="var(--${ln})" stroke-width="4" stroke-dasharray="8 7" opacity=".35"/>`;
      if (animFrom !== null && nowX > animFrom) svg += `<path class="opening" d="M${animFrom} ${y}H${nowX}" stroke="var(--${ln})" stroke-width="5" stroke-linecap="round"/>`;
    });
    svg += '</svg>';
    let html = svg;
    $('#pills').innerHTML = LINES.map((ln, i) => `<span class="line-tag t-${ln}" style="top:${LINE_Y[i]}px">${SRC[ln]}</span>`).join('');
    TURNS.forEach((t, i) => {
      const cls = t.n < S.turn ? 'past' : t.n === S.turn ? 'now' : 'future';
      html += `<span class="tm ${cls}" style="left:${L.bx[i]}px">${t.n === S.turn ? '지금 ' : ''}${t.n}턴 <span class="num">${t.short}</span></span>`;
    });
    if (S.turn < 3) html += `<span class="future-note" style="left:${(nowX + endX) / 2}px;top:${AXIS_Y - 2}px">다음 턴에 열리는 구간</span>`;
    let prevMonth = ''; const days = [];
    L.items.forEach(it => { const last = days[days.length - 1]; if (last && last.date === it.date) last.xs.push(L.pos[it.id]); else days.push({ date: it.date, xs: [L.pos[it.id]] }); });
    days.forEach(dg => {
      const [, m, d] = dg.date.split('-').map(Number), mk = dg.date.slice(0, 7), x0 = dg.xs[0], x1 = dg.xs[dg.xs.length - 1];
      if (dg.xs.length > 1) html += `<span class="day-span" style="left:${x0}px;width:${x1 - x0}px;top:${AXIS_Y - 8}px"></span>`;
      html += `<span class="dl num" style="left:${(x0 + x1) / 2}px;top:${AXIS_Y - 2}px">${mk !== prevMonth ? `<b>${m}월</b> ${d}일` : `${d}일`}${dg.xs.length > 1 ? ` 같은 날 ${dg.xs.length}건` : ''}</span>`;
      prevMonth = mk;
    });
    L.items.forEach(it => {
      const x = L.pos[it.id], y = LINE_Y[LINES.indexOf(it.src)];
      const same = L.items.filter(o => o !== it && o.src === it.src).map(o => Math.abs(L.pos[o.id] - x));
      let room = Math.min(170, ...same.map(dd => dd - 10));
      const wall = L.bx.find(b => b > x); if (wall !== undefined) room = Math.min(room, (wall - x) * 2 - 14);
      const cls = [`s-${it.src}`, linked.has(it.id) ? 'on' : linked.size ? 'off' : '', S.focus === it.id ? 'cur' : ''].join(' ');
      html += `<button type="button" class="st ${cls}" data-st="${it.id}" style="left:${x}px;top:${y}px" aria-label="${esc(`${fmtDate(it.date)} ${SRC[it.src]} ${it.short}${linked.has(it.id) ? `, ${c ? cnum(c) : ''} 주장에 연결됨` : ''}`)}"><span class="lab" style="max-width:${Math.max(64, room)}px">${esc(it.short)}</span><span class="dot"></span></button>`;
    });
    mapEl.innerHTML = html;
    $('#tlNote').innerHTML = c && c.ev.length ? `<b>${cnum(c)}</b> 주장에 연결한 증거 ${c.ev.length}개를 진하게 표시했습니다. 점을 누르면 4. 증거함의 그 줄로 갑니다.` : '증거를 날짜 순서로 놓았습니다. 점을 누르면 4. 증거함의 그 줄로 갑니다.';
    if (animFrom !== null && !reduce) {
      const dx = animFrom - nowX, ease = 'cubic-bezier(.16, 1, .3, 1)';
      const tm = mapEl.querySelector('.tm.now'), nl = mapEl.querySelector('.now-line');
      tm && tm.animate([{ transform: `translateX(calc(-50% + ${dx}px))` }, { transform: 'translateX(-50%)' }], { duration: 700, easing: ease });
      nl && nl.animate([{ transform: `translateX(${dx}px)` }, { transform: 'translateX(0)' }], { duration: 700, easing: ease });
      mapEl.querySelectorAll('.opening').forEach(p => { const len = Math.abs(nowX - animFrom); p.style.strokeDasharray = len; p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 700, easing: ease, fill: 'both' }); });
    }
    animFrom = null; lastNowX = nowX;
  }

  /* ── 위쪽 줄, 분류, 사이드바 ── */
  function renderChrome() {
    const t = turnOf(S.turn);
    $('#turnName').textContent = `${S.turn}턴`; $('#turnTime').textContent = t.label; $('#turnDesc').textContent = t.desc;
    $('#turn').innerHTML = TURNS.map(x => `<option value="${x.n}"${x.n === S.turn ? ' selected' : ''}>${x.n}턴</option>`).join('');
    $('#saved').textContent = S.saved ? `최근 저장 시각: ${S.saved}` : '아직 저장한 기록이 없습니다';
    $('#cats').innerHTML = ['<span>분류:</span>', '<span>사건 파일</span>', '<span>연예</span>', `<span>${S.turn}턴</span>`, '<span>수업용 가상 사건</span>'].join('');
    $('#stat').innerHTML = S.claims.map(c => `<li><span class="k">${cnum(c)}</span><a href="#s-c-${c.id}" data-go="${c.id}" title="${esc(c.text)}">${esc(c.text)}</a>${badge(c.v[S.turn])}</li>`).join('');
    const now = Date.now(), ago = t0 => { const s = Math.round((now - t0) / 1000); return s < 60 ? `${s}초 전` : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${Math.floor(s / 86400)}일 전`; };
    $('#log').innerHTML = S.log.length ? S.log.map(l => `<li><a href="#s-c-${l.cid}" data-go="${l.cid}">${esc(l.text)}</a><time>${ago(l.t)}</time></li>`).join('') : '<li class="empty">판정하거나 증거를 연결하면 여기에 쌓입니다.</li>';
  }
  /* 좁은 화면에서도 '지금' 표시는 늘 보이게: 지금 표시를 오른쪽 가까이에 둔다 */
  const edges = sc => { sc.classList.toggle('fl', sc.scrollLeft > 4); sc.classList.toggle('fr', sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 4); };
  function showNow() {
    const sc = $('#tlScroll'); if (!sc) return;
    if (sc.scrollWidth > sc.clientWidth + 2 && lastNowX !== null) sc.scrollLeft = Math.max(0, lastNowX - sc.clientWidth + 90);
    edges(sc);
  }
  const render = () => { const sc = $('#tlScroll'), keep = sc ? sc.scrollLeft : null; renderChrome(); renderDoc(); renderMap(); const n = $('#tlScroll'); if (n && keep !== null) n.scrollLeft = keep; if (n) edges(n); };

  function flashRow(id) {
    const el = document.getElementById('ev-' + id); if (!el) return;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }); el.focus({ preventScroll: true });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
  }
  const goClaim = id => { S.sel = id; save(); render(); const el = document.getElementById('s-c-' + id); el && el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); };

  document.addEventListener('click', e => {
    const t = e.target;
    const go = t.closest('[data-go]'); if (go) { e.preventDefault(); if (S.claims.some(c => c.id === go.dataset.go)) goClaim(go.dataset.go); return; }
    const fold = t.closest('[data-fold]');
    if (fold) { const id = fold.dataset.fold; S.closed[id] = !S.closed[id]; save(); render(); return; }
    if (t.closest('#tocHead')) { const toc = $('#toc'); toc.classList.toggle('closed'); $('#tocHead').setAttribute('aria-expanded', !toc.classList.contains('closed')); return; }
    const sec = t.closest('[data-claim]');
    const v = t.closest('[data-v]');
    if (v && sec) {
      const c = S.claims.find(x => x.id === sec.dataset.claim), k = v.dataset.v; S.sel = c.id;
      if (c.v[S.turn] === k) { delete c.v[S.turn]; toast('판정을 지웠습니다.'); logIt(`${cnum(c)} 판정 지움`, c.id); }
      else { c.v[S.turn] = k; toast(`${cnum(c)} ${S.turn}턴 판정: ${VERDICT[k]}`); logIt(`${cnum(c)} ${VERDICT[k]}`, c.id); }
      save(); render(); return;
    }
    const pf = t.closest('[data-pickfor]');
    if (pf) { S.sel = pf.dataset.pickfor; S.pick = S.pick === pf.dataset.pickfor ? null : pf.dataset.pickfor; render(); return; }
    const ln = t.closest('[data-link]');
    if (ln && sec) { const c = S.claims.find(x => x.id === sec.dataset.claim); c.ev.push(ln.dataset.link); S.sel = c.id; logIt(`${cnum(c)} 증거 연결: ${evById(ln.dataset.link).short}`, c.id); save(); render(); toast('증거를 연결했습니다.'); return; }
    const ul = t.closest('[data-unlink]');
    if (ul && sec) { const c = S.claims.find(x => x.id === sec.dataset.claim); c.ev = c.ev.filter(x => x !== ul.dataset.unlink); S.sel = c.id; logIt(`${cnum(c)} 연결 끊음`, c.id); save(); render(); toast('연결을 끊었습니다.'); return; }
    const st = t.closest('[data-st]');
    if (st) { S.focus = st.dataset.st; if (S.filter !== 'all' && evById(S.focus).src !== S.filter) S.filter = 'all'; if (S.closed.box) S.closed.box = false; save(); render(); flashRow(S.focus); return; }
    const ck = t.closest('[data-check]');
    if (ck) { const ev = evById(ck.dataset.id); ev.checks[ck.dataset.check] = !ev.checks[ck.dataset.check]; save(); ck.setAttribute('aria-pressed', ev.checks[ck.dataset.check]); return; }
    const f = t.closest('[data-f]'); if (f) { S.filter = f.dataset.f; save(); render(); return; }
    if (sec && S.sel !== sec.dataset.claim && !t.closest('textarea')) { S.sel = sec.dataset.claim; renderMap(); document.querySelectorAll('.claim-sec').forEach(s => s.classList.toggle('sel', s.dataset.claim === S.sel)); }
  });
  document.addEventListener('focusin', e => {
    const sec = e.target.closest && e.target.closest('[data-claim]');
    if (sec && S.sel !== sec.dataset.claim) { S.sel = sec.dataset.claim; renderMap(); document.querySelectorAll('.claim-sec').forEach(s => s.classList.toggle('sel', s.dataset.claim === S.sel)); }
  });
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.note) { S.claims.find(x => x.id === e.target.dataset.note).note = e.target.value; save(); }
    if (e.target.id === 'team') { S.team = e.target.value; save(); renderDoc(); renderMap(); }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'addClaim') {
      const inp = $('#newClaim'), v = inp.value.trim();
      if (!v) { inp.focus(); toast('주장을 한 문장으로 적은 뒤 추가하세요.'); return; }
      const c = { id: 'c' + Date.now().toString(36), text: v, v: {}, ev: [], note: '' };
      S.claims.push(c); S.sel = c.id; S.pick = c.id; logIt(`${cnum(c)} 주장 추가`, c.id); save(); render();
      document.getElementById('s-c-' + c.id).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      toast('주장을 추가했습니다. 증거를 연결하고 판정하세요.'); return;
    }
    if (e.target.id === 'addEvForm') {
      const d = Object.fromEntries(new FormData(e.target)), err = $('#evErr'), miss = [];
      if (!d.date) miss.push('날짜'); if (!d.short.trim()) miss.push('짧은 이름'); if (!d.text.trim()) miss.push('내용');
      if (miss.length) { const last = miss[miss.length - 1], code = last.charCodeAt(last.length - 1) - 0xAC00; err.textContent = `${miss.join(', ')}${code % 28 ? '을' : '를'} 적어야 시간선에 놓을 수 있습니다.`; return; }
      if (ms(d.date) > TURNS[S.turn - 1].ms) { err.textContent = `${S.turn}턴 시점(${turnOf(S.turn).label})보다 뒤의 날짜입니다. 날짜를 다시 확인하세요.`; return; }
      const id = 'e' + Date.now().toString(36);
      S.evidence.push({ id, src: d.src, date: d.date, found: S.turn, short: d.short.trim(), text: d.text.trim(), from: d.from.trim(), checks: { src: false, orig: false } });
      const c = S.claims.find(x => x.id === d.claim);
      if (c) { c.ev.push(id); S.sel = c.id; logIt(`${cnum(c)} 증거 추가: ${d.short.trim()}`, c.id); }
      S.focus = id; S.filter = 'all'; save(); render(); flashRow(id);
      toast(c ? `증거를 추가하고 ${cnum(c)} 주장에 연결했습니다.` : '증거를 추가했습니다.');
    }
  });
  $('#turn').addEventListener('change', e => {
    const n = Number(e.target.value); if (n === S.turn) return;
    animFrom = n > S.turn ? lastNowX : null; S.turn = n; save(); render(); showNow();
    toast(`${n}턴으로 맞췄습니다. 새 증거를 찾아 다시 판정하세요.`);
  });

  let armed = false, armT;
  $('#reset').addEventListener('click', e => {
    const b = e.currentTarget, lbl = b.querySelector('span');
    if (!armed) { armed = true; lbl.textContent = '모두 지워집니다. 한 번 더 누르세요'; b.classList.add('warn'); armT = setTimeout(() => { armed = false; lbl.textContent = '처음 상태로'; b.classList.remove('warn'); }, 4000); return; }
    clearTimeout(armT); armed = false; lbl.textContent = '처음 상태로'; b.classList.remove('warn');
    S = clone(SAMPLE); $('#team').value = ''; save(); render(); toast('처음 상태로 되돌렸습니다.');
  });
  function recordText() {
    const lines = ['문영 수사본부 수사 기록', '사건: 이은호 김서진 열애설', `모둠: ${S.team || '(이름 없음)'}`, `현재 시점: ${S.turn}턴, ${turnOf(S.turn).label}`, ''];
    S.claims.forEach(c => {
      lines.push(`${cnum(c)} ${c.text}`, `   판정: ${trailText(c)}`);
      if (c.note) lines.push(`   근거: ${c.note}`);
      const ev = sortEv(c.ev.map(evById).filter(Boolean));
      if (ev.length) lines.push(`   증거: ${ev.map(x => `${SRC[x.src]} ${fmtDate(x.date)} ${x.short}`).join(' / ')}`);
      lines.push('');
    });
    return lines.join('\n');
  }
  $('#copy').addEventListener('click', async () => {
    const txt = recordText();
    try { await navigator.clipboard.writeText(txt); $('#copyOut').hidden = true; toast('기록을 복사했습니다. 제출 칸에 붙여 넣으세요.'); }
    catch (err) { $('#copyText').value = txt; $('#copyOut').hidden = false; $('#copyText').focus(); $('#copyText').select(); }
  });
  $('#toTop').addEventListener('click', () => scrollTo({ top: 0 }));
  $('#toEnd').addEventListener('click', () => scrollTo({ top: document.body.scrollHeight }));
  $('#toToc').addEventListener('click', () => { const el = $('#toc'); el && el.scrollIntoView({ block: 'center' }); });

  $('#team').value = S.team || '';
  render();
  /* 안내 문구와 선택지 글자는 웹 글꼴이 따로 불러오지 않으므로 미리 불러 한 글꼴로 보이게 한다 */
  const glyphs = () => [...document.querySelectorAll('[placeholder]')].map(el => el.placeholder).join('') + [...document.querySelectorAll('option')].map(o => o.textContent).join('');
  if (document.fonts && document.fonts.load) ['400', '700'].forEach(w => document.fonts.load(`${w} 15px "Noto Sans KR"`, glyphs()).catch(() => {}));
  requestAnimationFrame(showNow);
  let lastW = 0;
  new ResizeObserver(es => { const w = es[0].contentRect.width; if (Math.abs(w - lastW) > 1) { lastW = w; renderMap(); const sc = $('#tlScroll'); if (sc) edges(sc); } }).observe($('#doc'));
  document.addEventListener('scroll', e => { if (e.target.id === 'tlScroll') edges(e.target); }, true);
})();
</script>
</body>
</html>
